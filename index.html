<!DOCTYPE html>
<html lang="hi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Rajdhani AI – Shape Based Pattern</title>

<style>
:root{
 --gold:#ffd700; --blue:#3e84ff; --red:#ff3e3e;
 --green:#00ff00; --purple:#b84cff; --bg:#0a0a0a;
}
body{background:var(--bg);color:#fff;font-family:sans-serif;margin:0;padding:10px}
.toolbar{display:flex;gap:8px;justify-content:center;margin-bottom:10px}
button{padding:10px;font-weight:bold;border-radius:6px;border:none;cursor:pointer}
.table-container{position:relative;background:#fff;padding:10px;border-radius:6px;max-height:55vh;overflow:auto}
table{border-collapse:collapse;width:100%;color:#000;font-size:13px}
th,td{border:1px solid #999;height:42px;text-align:center;font-weight:bold}
th{background:#800;color:#fff;position:sticky;top:0}

.blank{background:#f0f0f0;color:#bbb;cursor:pointer}
.fam{border-radius:50%;border:3px solid var(--blue);background:rgba(62,132,255,.25)}
.base{border:3px solid #000!important;background:#ffeaa7!important}
.cross{border-radius:50%;border:3px solid var(--purple);background:rgba(184,76,255,.3)}
.res{border-radius:50%;border:3px solid var(--green);background:rgba(0,255,0,.3)}

canvas{position:absolute;top:0;left:0;pointer-events:none}
.dashboard{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:10px}
.card{background:#1a1a1a;padding:10px;border-left:4px solid var(--gold);border-radius:8px}
.check-btn{background:#252525;color:var(--gold);margin-top:6px;padding:10px;border-radius:6px;border:1px solid #444;text-align:left}
</style>
</head>

<body>

<div class="toolbar">
 <input type="file" id="csvFile" accept=".csv" hidden onchange="importCSV(this)">
 <button style="background:var(--gold)" onclick="csvFile.click()">CSV Load</button>
 <button style="background:var(--blue);color:#fff" onclick="addRow()">Add Row</button>
 <button style="background:var(--green)" onclick="saveToLocal()">Save</button>
</div>

<div class="table-container">
 <canvas id="cvs"></canvas>
 <table id="tbl"></table>
</div>

<div class="dashboard">
 <div class="card">
  <h3>Analysis Lines</h3>
  <div id="checkList">Blank cell par click karein</div>
 </div>
 <div class="card">
  <h3>Prediction</h3>
  <div id="future" style="font-size:22px;color:var(--gold)">-- | -- | --</div>
 </div>
</div>

<script>
/* ---------------- DATA ---------------- */
let data=JSON.parse(localStorage.getItem("raj_ai_shape"))||[["**","**","**","**","**","**"]];
let active=null, clickCell=null;

/* ---------------- DRAW TABLE ---------------- */
function draw(){
 let h="<tr><th>MON</th><th>TUE</th><th>WED</th><th>THU</th><th>FRI</th><th>SAT</th></tr>";
 data.forEach((r,ri)=>{
  h+="<tr>";
  r.forEach((c,ci)=>{
   let cls=c==="**"?"blank":"";
   if(active){
    let v=active.mask?.[ri-active.start]?.[ci];
    if(v===1)cls+=" fam";
    if(v===9)cls+=" base";
    if(v===8)cls+=" cross";
    if(ri===active.resR && ci===active.resC)cls+=" res";
   }
   h+=`<td class="${cls}" contenteditable
        onclick="scan(${ri},${ci})"
        onblur="data[${ri}][${ci}]=this.innerText.trim()||'**'">${c}</td>`;
  });
  h+="</tr>";
 });
 tbl.innerHTML=h;
 setTimeout(drawLines,60);
}

/* ---------------- SCAN LOGIC ---------------- */
function scan(r,c){
 if(data[r][c]!=="**")return;
 clickCell={r,c};

 let mask=Array.from({length:10},()=>Array(6).fill(0));
 let base=null, marks=0;

 for(let i=1;i<=10;i++){
  if(!data[r-i])break;
  for(let j=0;j<6;j++){
   if(data[r-i][j]!=="**"){
    mask[10-i][j]=1;
    marks++;
    if(!base) base={ri:r-i,ci:j};
   }
  }
 }
 if(marks<3 || !base)return;

 mask[base.ri-(r-10)][base.ci]=9;

 let matches=[];
 for(let i=0;i<=data.length-11;i++){
  let hit=0;
  for(let k=0;k<10;k++){
   for(let j=0;j<6;j++){
    if(mask[k][j] && data[i+k][j]!=="**") hit++;
   }
  }
  if(hit>=3 && data[i+10][c]!=="**"){
   let m=JSON.parse(JSON.stringify(mask));
   m[10-(r-(i+10))]?.[c]=8;
   matches.push({start:i,mask:m,resR:i+10,resC:c,val:data[i+10][c],per:hit});
  }
 }

 checkList.innerHTML="";
 matches.slice(0,3).forEach((m,i)=>{
  let b=document.createElement("button");
  b.className="check-btn";
  b.innerHTML=`Pattern ${i+1} | Match ${m.per}`;
  b.onclick=()=>{active=m;draw()};
  checkList.appendChild(b);
 });
 future.innerText=matches.map(m=>m.val).join(" | ")||"-- | -- | --";
 active=null;
}

/* ---------------- LINES ---------------- */
function drawLines(){
 if(!active)return;
 let ctx=cvs.getContext("2d");
 cvs.width=tbl.offsetWidth; cvs.height=tbl.offsetHeight;
 ctx.clearRect(0,0,cvs.width,cvs.height);
 let rect=tbl.getBoundingClientRect();

 ["fam","cross","res"].forEach(cls=>{
  let els=[...tbl.querySelectorAll("."+cls)];
  if(!els.length)return;
  ctx.strokeStyle=cls==="fam"?"#3e84ff":cls==="cross"?"#b84cff":"#00ff00";
  ctx.lineWidth=3; ctx.beginPath();
  els.forEach((e,i)=>{
   let r=e.getBoundingClientRect();
   let x=r.left-rect.left+r.width/2;
   let y=r.top-rect.top+r.height/2;
   i?ctx.lineTo(x,y):ctx.moveTo(x,y);
  });
  ctx.stroke();
 });
}

/* ---------------- UTILS ---------------- */
function importCSV(f){
 let r=new FileReader();
 r.onload=e=>{
  data=e.target.result.split("\n").filter(x=>x.trim())
   .map(r=>r.split(",").map(c=>c.trim().padStart(2,"0")));
  saveToLocal(); draw();
 };
 r.readAsText(f.files[0]);
}
function addRow(){data.push(["**","**","**","**","**","**"]);draw()}
function saveToLocal(){localStorage.setItem("raj_ai_shape",JSON.stringify(data))}
draw();
</script>

</body>
</html>
