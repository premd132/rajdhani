<!DOCTYPE html>
<html lang="hi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Rajdhani AI - CSV Fix</title>
<style>
    :root { --gold: #ffd700; --blue: #3e84ff; --red: #ff3e3e; --green: #00ff00; --bg: #0a0a0a; }
    body { font-family: 'Segoe UI', Arial; background: var(--bg); color: #fff; margin: 0; padding: 10px; }
    .toolbar { background: #1a1a1a; padding: 15px; border-radius: 10px; display: flex; gap: 10px; justify-content: center; border-bottom: 2px solid var(--gold); margin-bottom: 15px; }
    .table-container { position: relative; display: inline-block; background: #fff; border-radius: 5px; padding: 10px; }
    table { border-collapse: collapse; font-size: 13px; color: #000; position: relative; z-index: 10; }
    td, th { border: 1px solid #999; width: 45px; height: 42px; text-align: center; font-weight: bold; }
    th { background: #800; color: #fff; }
    
    .f1 { border: 3px solid var(--blue) !important; border-radius: 50%; background: rgba(62, 132, 255, 0.2); }
    .f2 { border: 3px solid var(--red) !important; border-radius: 50%; background: rgba(255, 62, 62, 0.2); }
    .f-res { border: 3px solid var(--green) !important; background: rgba(0, 255, 0, 0.2); }
    .blank { background: #eee !important; cursor: pointer; border: 1px dashed #777 !important; }

    canvas { position: absolute; top: 0; left: 0; pointer-events: none; z-index: 20; }
    .dashboard { display: grid; grid-template-columns: 1fr 1fr; gap: 15px; margin-top: 20px; }
    .card { background: #1a1a1a; padding: 15px; border-radius: 8px; border-left: 5px solid var(--gold); }
    button { padding: 10px 15px; cursor: pointer; font-weight: bold; border-radius: 5px; border: none; }
    .btn-csv { background: var(--gold); color: #000; }
    .btn-add { background: var(--blue); color: #fff; }
    .btn-save { background: var(--green); color: #000; }
</style>
</head>
<body>

<div class="toolbar">
    <input type="file" id="csvFile" accept=".csv" style="display:none" onchange="handleCSV(this)">
    <button class="btn-csv" onclick="document.getElementById('csvFile').click()">📂 Upload CSV</button>
    <button class="btn-add" onclick="addRow()">➕ Add Row</button>
    <button class="btn-save" onclick="saveData()">💾 Save Memory</button>
</div>

<center>
    <div class="table-container">
        <canvas id="mainCanvas"></canvas>
        <table id="tbl"></table>
    </div>
</center>

<div class="dashboard">
    <div class="card">
        <h3>📍 Check Lines (80% Match)</h3>
        <div id="checkList">CSV upload karein ya Row add karein...</div>
    </div>
    <div class="card">
        <h3>🔮 Future AI</h3>
        <div id="future" style="font-size: 24px; color: var(--gold); font-weight: bold; text-align: center;">-- | -- | --</div>
    </div>
</div>

<script>
// Families and Storage Logic
const families = {"22":["22","27","72","77"],"11":["11","61","66","16"],"33":["33","83","88","38"],"99":["99","44","49","94"],"55":["50","00","05","55"],"12":["12","17","21","26","62","67","71","76"],"13":["13","18","31","36","63","68","81","86"],"14":["14","19","41","46","64","69","91","96"],"15":["01","06","10","15","51","56","60","65"],"23":["23","28","32","37","73","78","82","87"],"24":["24","29","42","47","74","79","92","97"],"25":["02","07","20","25","52","57","70","75"],"34":["34","39","43","48","84","89","93","98"],"35":["03","08","30","35","53","58","80","85"],"45":["04","09","40","45","54","59","90","95"]};

let data = JSON.parse(localStorage.getItem("raj_memory_v2")) || [["**","**","**","**","**"]];

function fam(v){ 
    let s = String(v).padStart(2,'0');
    for(let k in families) if(families[k].includes(s)) return k; 
    return "NA"; 
}

function draw() {
    let h = "<tr><th>MON</th><th>TUE</th><th>WED</th><th>THU</th><th>FRI</th></tr>";
    data.forEach((row, ri) => {
        h += "<tr>";
        row.forEach((cell, ci) => {
            let cls = cell === "**" ? "blank" : "";
            h += `<td class="${cls}" contenteditable="true" onblur="updateCell(${ri},${ci},this.innerText)">${cell}</td>`;
        });
        h += "</tr>";
    });
    document.getElementById("tbl").innerHTML = h;
}

function updateCell(r, c, v) { data[r][c] = v.trim() || "**"; }

// CSV Handling Function
function handleCSV(input) {
    const file = input.files[0];
    if (file) {
        const reader = new FileReader();
        reader.onload = function(e) {
            const text = e.target.result;
            const rows = text.split('\n').filter(row => row.trim() !== "");
            const newData = rows.map(row => {
                let cols = row.split(',').map(c => c.trim());
                // Ensure 5 columns
                while(cols.length < 5) cols.push("**");
                return cols.slice(0, 5);
            });
            data = newData;
            saveData();
            draw();
            alert("CSV Data Uploaded Successfully!");
        };
        reader.readAsText(file);
    }
}

function addRow() { data.push(["**","**","**","**","**"]); draw(); }

function saveData() { 
    localStorage.setItem("raj_memory_v2", JSON.stringify(data)); 
    alert("Data saved to Local Storage!");
}

draw();
</script>
</body>
</html>
