<!DOCTYPE html>
<html lang="hi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Rajdhani AI – Precise Pattern Scanner</title>
<style>
    :root { --gold: #ffd700; --blue: #3e84ff; --red: #ff3e3e; --green: #00ff00; --bg: #0a0a0a; }
    body { font-family: sans-serif; background: var(--bg); color: #fff; margin: 0; padding: 10px; }
    .toolbar { background: #1a1a1a; padding: 15px; border-radius: 10px; display: flex; gap: 8px; justify-content: center; border-bottom: 2px solid var(--gold); margin-bottom: 15px; }
    .table-container { position: relative; display: inline-block; background: #fff; padding: 10px; border-radius: 5px; max-height: 55vh; overflow-y: auto; width: 100%; }
    table { border-collapse: collapse; font-size: 13px; color: #000; position: relative; z-index: 10; width: 100%; table-layout: fixed; }
    td, th { border: 1px solid #999; height: 45px; text-align: center; font-weight: bold; position: relative; }
    th { background: #800; color: #fff; position: sticky; top: 0; }
    
    /* Strict Marking Logic */
    .f-circle { border: 3px solid var(--blue) !important; border-radius: 50%; background: rgba(62, 132, 255, 0.2); }
    .base-box { border: 4px solid #000 !important; background: var(--gold) !important; color: #000; font-weight: 900; } 
    .cross-mark { border: 3px solid var(--red) !important; border-radius: 50%; background: rgba(255, 62, 62, 0.3); }
    .current-blank { border: 3px solid var(--green) !important; background: rgba(0, 255, 0, 0.1); }
    .blank { background: #f0f0f0 !important; cursor: pointer; color: #ccc; }

    canvas { position: absolute; top: 0; left: 0; pointer-events: none; z-index: 20; }
    .dashboard { display: grid; grid-template-columns: 1fr 1fr; gap: 15px; margin-top: 15px; }
    .card { background: #1a1a1a; padding: 12px; border-radius: 10px; border-left: 5px solid var(--gold); }
    .check-btn { display: block; width: 100%; margin-top: 8px; padding: 12px; background: #252525; color: var(--gold); border: 1px solid #444; text-align: left; cursor: pointer; border-radius: 5px; }
</style>
</head>
<body>

<div class="toolbar">
    <input type="file" id="csvFile" accept=".csv" style="display:none" onchange="importCSV(this)">
    <button onclick="document.getElementById('csvFile').click()" style="background:var(--gold)">📂 CSV Upload</button>
    <button onclick="addRow()" style="background:var(--blue); color:#fff">➕ Add Row</button>
    <button onclick="saveToLocal()" style="background:var(--green)">💾 Save Memory</button>
</div>

<center>
    <div class="table-container" id="scrollBox">
        <canvas id="mainCanvas"></canvas>
        <table id="tbl"></table>
    </div>
</center>

<div class="dashboard">
    <div class="card">
        <h3>📍 Check Lines (10-Row Cross)</h3>
        <div id="checkList">Blank cell par click karein...</div>
    </div>
    <div class="card">
        <h3>🔮 Future AI (3-Pair)</h3>
        <div id="future" style="font-size: 22px; color: var(--gold); font-weight: bold; text-align: center;">-- | -- | --</div>
    </div>
</div>

<script>
const families = {"22":["22","27","72","77"],"11":["11","61","66","16"],"33":["33","83","88","38"],"99":["99","44","49","94"],"55":["50","00","05","55"],"12":["12","17","21","26","62","67","71","76"],"13":["13","18","31","36","63","68","81","86"],"14":["14","19","41","46","64","69","91","96"],"15":["01","06","10","15","51","56","60","65"],"23":["23","28","32","37","73","78","82","87"],"24":["24","29","42","47","74","79","92","97"],"25":["02","07","20","25","52","57","70","75"],"34":["34","39","43","48","84","89","93","98"],"35":["03","08","30","35","53","58","80","85"],"45":["04","09","40","45","54","59","90","95"]};
let data = JSON.parse(localStorage.getItem("raj_v5_pro")) || Array(20).fill(["**","**","**","**","**","**"]);
let activeMatch = null;
let lastClick = null;

function fam(v){ let s = String(v).padStart(2,'0'); for(let k in families) if(families[k].includes(s)) return k; return "NA"; }

function draw() {
    let h = "<tr><th>MON</th><th>TUE</th><th>WED</th><th>THU</th><th>FRI</th><th>SAT</th></tr>";
    data.forEach((row, ri) => {
        h += `<tr id="tr-${ri}">`;
        row.forEach((cell, ci) => {
            let cls = cell === "**" ? "blank" : "";
            if(activeMatch) {
                // Determine if row is within current or historical 10-row window
                const isCur = (lastClick && ri > lastClick.r - 11 && ri < lastClick.r);
                const isHist = (ri >= activeMatch.start && ri < activeMatch.start + 10);
                let relR = isCur ? ri - (lastClick.r - 10) : (isHist ? ri - activeMatch.start : -1);

                if (relR !== -1) {
                    // 1. Fixed Base Jodi (Same spot in every pattern)
                    if (relR === activeMatch.baseR && ci === activeMatch.baseC) cls += " base-box";
                    // 2. Family Marking (Max 2-3 connections)
                    else if (activeMatch.points.some(p => p.r === relR && p.c === ci)) cls += " f-circle";
                }
                // 3. Target Marking
                if (ri === activeMatch.resR && ci === activeMatch.resC) cls += " cross-mark";
                if (lastClick && ri === lastClick.r && ci === lastClick.c) cls += " current-blank";
            }
            h += `<td class="${cls}" contenteditable="true" onblur="updateCell(${ri},${ci},this.innerText)" onclick="deepAnalyze(${ri},${ci})">${cell}</td>`;
        });
        h += "</tr>";
    });
    document.getElementById("tbl").innerHTML = h;
    setTimeout(renderLines, 100);
}

function updateCell(r, c, v) { data[r][c] = v.trim() || "**"; }

function deepAnalyze(r, c) {
    if(data[r][c] !== "**") return;
    lastClick = {r, c};
    activeMatch = null;

    // 1. Identify Base Jodi and Shape from Current 10 Rows
    let points = [];
    let baseR = 7, baseC = (c + 2) % 6; // Fixed logic: Base is always 3 rows up, 2 cols over

    for(let i=1; i<=10; i++) {
        if(r-i < 0) break;
        data[r-i].forEach((v, ci) => {
            if(v !== "**" && points.length < 3) points.push({r: 10-i, c: ci});
        });
    }

    // 2. Search History for Exact Shape Match
    let matches = [];
    for(let i=0; i < data.length - 11; i++) {
        if(data[i+10][c] === "**") continue;
        let score = 0;
        points.forEach(p => { if(data[i+p.r][p.c] !== "**") score++; });

        if(score >= 2) {
            matches.push({
                start: i, points, baseR, baseC,
                resR: i+10, resC: c, val: data[i+10][c]
            });
        }
    }

    let list = document.getElementById("checkList");
    list.innerHTML = matches.length ? "" : "Koi fixed shape match nahi mila.";
    matches.slice(0, 3).forEach((m, idx) => {
        let btn = document.createElement("button");
        btn.className = "check-btn";
        btn.innerHTML = `🏁 <b>Check Line ${idx+1}</b> | Fixed Base: Row ${m.baseR+1}<br>History Result: ${m.val}`;
        btn.onclick = () => { activeMatch = m; draw(); document.getElementById(`tr-${m.start}`).scrollIntoView({behavior:"smooth", block:"center"}); };
        list.appendChild(btn);
    });
    document.getElementById("future").innerText = matches.slice(0, 3).map(m => m.val).join(" | ") || "-- | -- | --";
    draw();
}

function renderLines() {
    const cvs = document.getElementById("mainCanvas");
    const ctx = cvs.getContext("2d");
    const tbl = document.getElementById("tbl");
    cvs.width = tbl.offsetWidth; cvs.height = tbl.offsetHeight;
    ctx.clearRect(0,0,cvs.width,cvs.height);
    const rect = tbl.getBoundingClientRect();

    const drawPath = (selector, color) => {
        let els = Array.from(tbl.querySelectorAll(selector));
        if(els.length < 2) return;
        ctx.strokeStyle = color; ctx.lineWidth = 3; ctx.setLineDash([]); ctx.beginPath();
        els.forEach((el, i) => {
            let r = el.getBoundingClientRect();
            let x = r.left - rect.left + r.width/2;
            let y = r.top - rect.top + r.height/2;
            if(i===0) ctx.moveTo(x,y); else ctx.lineTo(x,y);
        });
        ctx.stroke();
    };

    drawPath(".f-circle, .base-box", "#3e84ff"); // Family Pattern
    drawPath(".cross-mark, .current-blank", "#ff3e3e"); // Cross Result Logic
}

function importCSV(input) {
    const reader = new FileReader();
    reader.onload = (e) => {
        data = e.target.result.split('\n').filter(r => r.trim()).map(r => {
            let cols = r.split(',').map(c => c.trim().padStart(2,'0').replace(/^00$/, "**"));
            while(cols.length < 6) cols.push("**");
            return cols.slice(0, 6);
        });
        saveToLocal(); draw();
    };
    reader.readAsText(input.files[0]);
}
function addRow() { data.push(["**","**","**","**","**","**"]); draw(); }
function saveToLocal() { localStorage.setItem("raj_v5_pro", JSON.stringify(data)); alert("Memory Saved!"); }
draw();
</script>
</body>
</html>
