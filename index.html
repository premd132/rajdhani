<!DOCTYPE html>
<html lang="hi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Rajdhani AI – DPBoss Style</title>
<style>
    :root { --gold: #ffd700; --blue: #007bff; --red: #dc3545; --green: #28a745; --bg: #000; }
    body { font-family: 'Arial', sans-serif; background: var(--bg); color: #fff; margin: 0; padding: 5px; }
    
    /* DPBoss Table Style */
    .table-container { position: relative; background: #fff; padding: 5px; border-radius: 2px; overflow-x: auto; }
    table { border-collapse: collapse; width: 100%; color: #000; font-size: 16px; table-layout: fixed; }
    td, th { border: 1px solid #000; height: 50px; text-align: center; font-weight: 700; position: relative; }
    th { background: #fdfd96; color: #000; font-size: 12px; }

    /* DPBoss Circle & Box Marking */
    .f-circle { 
        position: relative; z-index: 5;
    }
    .f-circle::after {
        content: ""; position: absolute; top: 10%; left: 10%; width: 80%; height: 80%;
        border: 3px solid var(--blue); border-radius: 50%; box-sizing: border-box;
    }
    
    .base-box { 
        background: #ffff00 !important; border: 3px solid #000 !important; 
        color: #000; font-size: 18px; z-index: 6;
    }

    .cross-mark::after {
        content: ""; position: absolute; top: 10%; left: 10%; width: 80%; height: 80%;
        border: 3px solid var(--red); border-radius: 50%; box-sizing: border-box;
    }

    .target-cell { border: 4px solid var(--green) !important; background: #e8f5e9; }
    .blank { background: #eee !important; color: #ccc; cursor: pointer; }

    canvas { position: absolute; top: 0; left: 0; pointer-events: none; z-index: 10; }
    
    .toolbar { display: flex; gap: 5px; margin-bottom: 10px; flex-wrap: wrap; }
    button { flex: 1; padding: 10px; font-weight: bold; border: none; cursor: pointer; border-radius: 4px; }
    .btn-csv { background: var(--gold); } .btn-row { background: var(--blue); color: #fff; } .btn-save { background: var(--green); color: #fff; }

    .dashboard { display: grid; grid-template-columns: 1fr; gap: 10px; margin-top: 10px; }
    .card { background: #1a1a1a; padding: 10px; border-left: 4px solid var(--gold); }
    .check-btn { width: 100%; padding: 12px; background: #333; color: var(--gold); border: 1px solid #444; margin-top: 5px; text-align: left; }
</style>
</head>
<body>

<div class="toolbar">
    <input type="file" id="csvFile" accept=".csv" style="display:none" onchange="importCSV(this)">
    <button class="btn-csv" onclick="document.getElementById('csvFile').click()">📂 CSV</button>
    <button class="btn-row" onclick="addRow()">➕ ROW</button>
    <button class="btn-save" onclick="saveData()">💾 SAVE</button>
</div>

<div class="table-container" id="scrollBox">
    <canvas id="mainCanvas"></canvas>
    <table id="tbl"></table>
</div>

<div class="dashboard">
    <div class="card">
        <h3>📍 Check Lines (DP Style)</h3>
        <div id="checkList">Blank cell click karein...</div>
    </div>
    <div class="card">
        <h3>🔮 Future AI (3-Pair)</h3>
        <div id="future" style="font-size: 24px; color: var(--gold); text-align: center; font-weight: bold;">-- | -- | --</div>
    </div>
</div>

<script>
let data = JSON.parse(localStorage.getItem("raj_dpboss_v1")) || Array(15).fill(["**","**","**","**","**","**"]);
let activeMatch = null;
let lastClick = null;

function draw() {
    let h = "<tr><th>MON</th><th>TUE</th><th>WED</th><th>THU</th><th>FRI</th><th>SAT</th></tr>";
    data.forEach((row, ri) => {
        h += `<tr id="tr-${ri}">`;
        row.forEach((cell, ci) => {
            let cls = cell === "**" ? "blank" : "";
            if(activeMatch) {
                const isCur = (lastClick && ri > lastClick.r - 11 && ri < lastClick.r);
                const isHist = (ri >= activeMatch.start && ri < activeMatch.start + 10);
                let relR = isCur ? ri - (lastClick.r - 10) : (isHist ? ri - activeMatch.start : -1);

                if (relR !== -1) {
                    if (relR === activeMatch.baseR && ci === activeMatch.baseC) cls += " base-box";
                    else if (activeMatch.points.some(p => p.r === relR && p.c === ci)) cls += " f-circle";
                }
                if (ri === activeMatch.resR && ci === activeMatch.resC) cls += " cross-mark";
                if (lastClick && ri === lastClick.r && ci === lastClick.c) cls += " target-cell";
            }
            h += `<td class="${cls}" onclick="analyze(${ri},${ci})" contenteditable="true" onblur="updateCell(${ri},${ci},this.innerText)">${cell}</td>`;
        });
        h += "</tr>";
    });
    document.getElementById("tbl").innerHTML = h;
    setTimeout(renderLines, 100);
}

function updateCell(r, c, v) { data[r][c] = v.trim() || "**"; }

function analyze(r, c) {
    if(data[r][c] !== "**") return;
    lastClick = {r, c}; activeMatch = null;
    let points = [];
    let baseR = 7, baseC = (c + 2) % 6; // Fixed Base Location

    for(let i=1; i<=10; i++) {
        if(r-i < 0) break;
        data[r-i].forEach((v, ci) => { if(v !== "**" && points.length < 3) points.push({r: 10-i, c: ci}); });
    }

    let matches = [];
    for(let i=0; i < data.length - 11; i++) {
        if(data[i+10][c] === "**") continue;
        let score = points.filter(p => data[i+p.r][p.c] !== "**").length;
        if(score >= 2) {
            matches.push({start: i, points, baseR, baseC, resR: i+10, resC: c, val: data[i+10][c]});
        }
    }

    let list = document.getElementById("checkList");
    list.innerHTML = matches.length ? "" : "No match.";
    matches.slice(0, 3).forEach((m, idx) => {
        let btn = document.createElement("button"); btn.className = "check-btn";
        btn.innerHTML = `🏁 Line ${idx+1} | History: ${m.val}`;
        btn.onclick = () => { activeMatch = m; draw(); document.getElementById(`tr-${m.start}`).scrollIntoView({behavior:"smooth", block:"center"}); };
        list.appendChild(btn);
    });
    document.getElementById("future").innerText = matches.slice(0, 3).map(m => m.val).join(" | ") || "-- | -- | --";
    draw();
}

function renderLines() {
    const cvs = document.getElementById("mainCanvas");
    const ctx = cvs.getContext("2d");
    const tbl = document.getElementById("tbl");
    cvs.width = tbl.offsetWidth; cvs.height = tbl.offsetHeight;
    ctx.clearRect(0,0,cvs.width,cvs.height);
    const rect = tbl.getBoundingClientRect();

    const drawLine = (sel, col) => {
        let els = Array.from(tbl.querySelectorAll(sel));
        if(els.length < 2) return;
        ctx.strokeStyle = col; ctx.lineWidth = 3; ctx.beginPath();
        els.forEach((el, i) => {
            let r = el.getBoundingClientRect();
            let x = r.left - rect.left + r.width/2;
            let y = r.top - rect.top + r.height/2;
            if(i===0) ctx.moveTo(x,y); else ctx.lineTo(x,y);
        });
        ctx.stroke();
    };
    drawLine(".f-circle, .base-box", "#007bff"); // Blue Line
    drawLine(".cross-mark, .target-cell", "#dc3545"); // Red Line
}

function importCSV(input) {
    const reader = new FileReader();
    reader.onload = (e) => {
        data = e.target.result.split('\n').filter(r => r.trim()).map(r => {
            let cols = r.split(',').map(c => c.trim().padStart(2,'0').replace(/^00$/, "**"));
            while(cols.length < 6) cols.push("**");
            return cols.slice(0, 6);
        });
        saveData(); draw();
    };
    reader.readAsText(input.files[0]);
}
function addRow() { data.push(["**","**","**","**","**","**"]); draw(); }
function saveData() { localStorage.setItem("raj_dpboss_v1", JSON.stringify(data)); }
draw();
</script>
</body>
</html>
