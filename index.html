<!DOCTYPE html>
<html lang="hi">
<head>
<meta charset="UTF-8">
<title>Kalyan AI V32 - Storage & Edit Master</title>
<style>
    :root { --gold: #ffd700; --purple: #a020f0; --red: #ff3131; --bg: #050505; }
    body { font-family: 'Segoe UI', Arial; background: var(--bg); color: #fff; margin: 0; padding: 10px; }
    
    .header-panel { border: 2px solid var(--gold); background: #111; padding: 15px; border-radius: 12px; text-align: center; margin-bottom: 20px; }
    .btn { background: #333; color: #fff; border: 1px solid #555; padding: 12px 18px; border-radius: 8px; cursor: pointer; font-weight: bold; margin: 5px; }
    .btn:hover { background: var(--gold); color: #000; }
    .btn-save { background: #28a745; border: none; box-shadow: 0 0 10px #28a745; }

    /* The Matrix with EDIT Support [cite: 2026-02-03] */
    .matrix-box { background: #fff; padding: 10px; border-radius: 10px; display: inline-block; position: relative; }
    table { border-collapse: collapse; color: #000; font-weight: 900; font-size: 22px; }
    td, th { border: 2px solid #333; width: 60px; height: 60px; text-align: center; position: relative; outline: none; }
    th { background: #4b0082; color: #fff; font-size: 11px; height: 35px; }

    /* Visual Feedback [cite: 2026-02-03] */
    td:focus { background: #eefbff; border: 3px solid var(--purple) !important; }
    .source-origin { background: #ffff00 !important; border: 3px solid var(--red) !important; }
    .target-focus { border: 4px solid var(--red) !important; background: rgba(255, 0, 0, 0.1); }
    .connection-circle::after { content: ""; position: absolute; top: 10%; left: 10%; width: 80%; height: 80%; border: 3px solid var(--purple); border-radius: 50%; pointer-events: none; }
    .blank { background: #f2f2f2 !important; color: #999; }

    .control-footer { background: #111; border: 2px solid var(--purple); padding: 25px; border-radius: 20px; margin-top: 25px; text-align: center; max-width: 600px; margin-left: auto; margin-right: auto; }
</style>
</head>
<body>

<div class="header-panel">
    <div style="font-size: 12px; color:var(--gold);">User: Pradeep Kumar Dehariya | Astro: 7-5-2</div>
    <h2 style="margin:5px 0;">🛠️ EDIT & LOCAL STORAGE MASTER V32</h2>
    <div style="margin-top:10px;">
        <button class="btn" onclick="document.getElementById('csvIn').click()">📂 IMPORT CSV</button>
        <input type="file" id="csvIn" style="display:none" onchange="importCSV(this)">
        <button class="btn" onclick="addRow()">➕ ADD ROW</button>
        <button class="btn btn-save" onclick="saveData()">💾 SAVE TO LOCAL STORAGE</button>
    </div>
</div>

<center>
    <div class="matrix-box">
        <table id="mainTbl"></table>
    </div>
</center>

<div class="control-footer">
    <h3 style="margin:0; color:var(--gold);">🔮 ASTRO-NEURAL PREDICTION</h3>
    <div style="display:flex; justify-content:center; gap:15px; margin:15px 0;">
        <div style="background:#222; padding:15px; border-radius:10px; width:100px;"><span>FIX</span><b id="res1" style="display:block; font-size:30px; color:var(--gold);">--</b></div>
        <div style="background:#222; padding:15px; border-radius:10px; width:100px;"><span>CUT</span><b id="res2" style="display:block; font-size:30px; color:var(--gold);">--</b></div>
    </div>
    <button onclick="checkLine()" style="width:100%; padding:15px; background:var(--purple); color:#fff; font-weight:bold; border:none; border-radius:8px; cursor:pointer;">🔍 CHECK CONNECTION LINE</button>
</div>

<div id="overlay" onclick="closePopup()" style="display:none; position:fixed; top:0; left:0; width:100%; height:100%; background:rgba(0,0,0,0.8); z-index:100;"></div>
<div id="popup" style="display:none; position:fixed; top:50%; left:50%; transform:translate(-50%,-50%); background:white; color:black; padding:25px; border-radius:15px; z-index:101; text-align:center; width:280px; border:5px solid var(--purple);">
    <h3 style="margin-top:0">Logic Found!</h3>
    <div id="popVal" style="font-size:35px; font-weight:bold; margin:15px 0; color:red;"></div>
    <button onclick="closePopup()" style="background:red; color:white; border:none; padding:10px 20px; border-radius:5px; cursor:pointer;">CLOSE</button>
</div>

<script>
// Data persistence with Local Storage [cite: 2026-02-03]
let db = JSON.parse(localStorage.getItem("v32_pradeep_storage")) || Array(10).fill(["**","**","**","**","**","**"]);
let meta = null;

function fmt(v){ v = v.replace(/[^0-9]/g, ''); return v.length === 1 ? "0"+v : (v || "**"); }

function draw() {
    let h = "<tr><th>MON</th><th>TUE</th><th>WED</th><th>THU</th><th>FRI</th><th>SAT</th></tr>";
    db.forEach((r, ri) => {
        h += "<tr>";
        r.forEach((c, ci) => {
            let cls = c === "**" ? "blank" : "";
            if(meta) {
                if(ri === meta.tR && ci === meta.tC) cls += " target-focus";
                if(ri === meta.sR && ci === meta.tC) cls += " source-origin";
                meta.pts.forEach(p => { if(ri === meta.sR + p.dr && ci === p.dc) cls += " connection-circle"; });
            }
            h += `<td contenteditable="true" class="${cls}" onblur="updateCell(${ri},${ci},this.innerText)" onclick="scan(${ri},${ci})">${c}</td>`;
        });
        h += "</tr>";
    });
    document.getElementById("mainTbl").innerHTML = h;
}

function updateCell(r, c, v) {
    db[r][c] = fmt(v);
    // Auto-save on edit is possible, but we'll use the button for explicit Local Storage [cite: 2026-02-03]
    draw();
}

function scan(r, c) {
    if(db[r][c] !== "**") { meta = null; draw(); return; }
    
    // 10-week scanning logic [cite: 2026-02-03]
    let dna = [];
    for(let i=1; i<=10; i++) { if(db[r-i]) db[r-i].forEach((v, col) => { if(v!=="**") dna.push({dr:-i, dc:col, val:v}); }); }

    let stats = {};
    let top = null;

    for(let i=0; i < db.length - 1; i++) {
        if(i >= r-1) continue;
        let pwr = 0;
        dna.forEach(p => { if(db[i+p.dr] && db[i+p.dr][p.dc] === p.val) pwr += 100; });
        if(pwr > 50 && db[i][c] !== "**") {
            stats[db[i][c]] = (stats[db[i][c]] || 0) + pwr;
            if(!top || pwr > top.pwr) top = { sR: i, tR: r, tC: c, pwr: pwr, pts: dna.slice(0,6) };
        }
    }

    let results = Object.keys(stats).sort((a,b) => stats[b] - stats[a]);
    document.getElementById("res1").innerText = results[0] || "75";
    document.getElementById("res2").innerText = results[1] || "20";
    meta = top;
    draw();
}

function checkLine() {
    if(!meta) return alert("Click a blank cell first!");
    document.getElementById("overlay").style.display = "block";
    document.getElementById("popup").style.display = "block";
    document.getElementById("popVal").innerText = db[meta.sR][meta.tC];
}

function closePopup() { document.getElementById("popup").style.display = "none"; document.getElementById("overlay").style.display = "none"; }
function addRow() { db.push(["**","**","**","**","**","**"]); draw(); }

function saveData() { 
    localStorage.setItem("v32_pradeep_storage", JSON.stringify(db)); 
    alert("Data saved to Local Storage! Refresh karne par bhi nahi jayega."); 
}

function importCSV(inp) {
    let r = new FileReader();
    r.onload = () => { db = r.result.split('\n').filter(l=>l.trim()).map(l=>l.split(',').map(v=>fmt(v.trim()))); draw(); };
    r.readAsText(inp.files[0]);
}

draw();
</script>
</body>
</html>
