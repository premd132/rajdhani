<!DOCTYPE html>
<html lang="hi">
<head>
<meta charset="UTF-8">
<title>Kalyan AI V23 - Final Fix</title>
<style>
    :root { --gold: #ffd700; --blue: #00d2ff; --red: #ff3131; --bg: #0a0a0a; }
    body { font-family: 'Segoe UI', Arial; background: var(--bg); color: #fff; margin: 0; padding: 10px; }
    
    .dashboard { border: 2px solid var(--gold); background: #111; padding: 15px; border-radius: 12px; margin-bottom: 20px; text-align: center; }
    
    .nav-btn { background: #333; color: white; border: 1px solid #555; padding: 8px 15px; border-radius: 5px; cursor: pointer; margin: 5px; font-weight: bold; }
    .nav-btn:hover { background: var(--gold); color: black; }

    .table-wrapper { background: #fff; padding: 15px; border-radius: 8px; display: inline-block; position: relative; margin-top: 10px; }
    table { border-collapse: collapse; color: #000; font-weight: 900; font-size: 18px; }
    td, th { border: 1px solid #222; width: 50px; height: 50px; text-align: center; position: relative; }
    th { background: #800000; color: #fff; font-size: 11px; }

    /* REQUIRED MARKINGS */
    .blank { background: #f2f2f2 !important; cursor: pointer; border: 1px dashed #999; }
    .circle-source::after { content: ""; position: absolute; top: 10%; left: 10%; width: 80%; height: 80%; border: 4px solid var(--blue); border-radius: 50%; }
    .source-origin { background: #ffeb3b !important; border: 3px solid var(--red) !important; color: #000; }
    .target-cell { border: 5px solid var(--red) !important; background: rgba(255,0,0,0.1); }

    .future-board { background: #111; border: 2px solid var(--blue); padding: 20px; border-radius: 15px; margin-top: 25px; text-align: center; }
    .f-grid { display: flex; gap: 15px; justify-content: center; margin-top: 15px; }
    .f-card { background: #222; border-top: 4px solid var(--gold); padding: 15px; border-radius: 10px; width: 100px; }
    .f-card b { font-size: 32px; color: var(--gold); display: block; }

    .popup-overlay { display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.8); z-index: 100; }
    .popup-content { position: fixed; top: 50%; left: 50%; transform: translate(-50%, -50%); background: white; color: #000; padding: 25px; border-radius: 15px; z-index: 101; text-align: center; width: 280px; }
</style>
</head>
<body>

<div class="dashboard">
    <h2 style="color:var(--gold); margin:0;">🚀 LOSS RECOVERY AI V23</h2>
    <div style="margin-top:15px;">
        <button class="nav-btn" onclick="document.getElementById('csvInp').click()">📂 LOAD CSV</button>
        <input type="file" id="csvInp" style="display:none" onchange="importCSV(this)">
        <button class="nav-btn" onclick="addRow()" style="border-color:var(--gold);">➕ ADD ROW</button>
        <button class="nav-btn" onclick="saveData()" style="background:#28a745; border:none;">💾 SAVE</button>
    </div>
</div>

<center>
    <div class="table-wrapper">
        <table id="tbl"></table>
    </div>
</center>

<div class="future-board">
    <h3 style="margin:0; color:var(--blue);">🔮 100% FUTURE PREDICTION (3-PAIR)</h3>
    <div class="f-grid">
        <div class="f-card"><span>MAIN</span><b id="p1">--</b></div>
        <div class="f-card"><span>SUPP</span><b id="p2">--</b></div>
        <div class="f-card"><span>CUT</span><b id="p3">--</b></div>
    </div>
    <button onclick="openPopup()" style="width:100%; padding:15px; margin-top:15px; background:var(--blue); color:#000; font-weight:bold; border:none; border-radius:8px; cursor:pointer;">🔍 VIEW REAL RECORD (CHECK LINE)</button>
</div>

<div class="popup-overlay" id="overlay" onclick="closePopup()"></div>
<div class="popup-content" id="popup" style="display:none;">
    <h3 style="margin-top:0">Historical Connection</h3>
    <div id="popData" style="font-size:20px; margin:15px 0;"></div>
    <p style="font-size:12px; color:#666;">This pair followed the exact pattern from your old records.</p>
    <button onclick="closePopup()" style="background:red; color:white; border:none; padding:10px 20px; border-radius:5px; cursor:pointer;">CLOSE</button>
</div>

<script>
const families = {"22":["22","27","72","77"],"11":["11","61","66","16"],"33":["33","83","88","38"],"99":["99","44","49","94"],"55":["50","00","05","55"],"12":["12","17","21","26","62","67","71","76"],"13":["13","18","31","36","63","68","81","86"],"14":["14","19","41","46","64","69","91","96"],"15":["01","06","10","15","51","56","60","65"],"23":["23","28","32","37","73","78","82","87"],"24":["24","29","42","47","74","79","92","97"],"25":["02","07","20","25","52","57","70","75"],"34":["34","39","43","48","84","89","93","98"],"35":["03","08","30","35","53","58","80","85"],"45":["04","09","40","45","54","59","90","95"]};

let db = JSON.parse(localStorage.getItem("v23_final")) || Array(20).fill(["**","**","**","**","**","**"]);
let activeMeta = null;

function fmt(v){ v = v.replace(/[^0-9]/g, ''); return v.length === 1 ? "0"+v : (v || "**"); }
function getF(v){ let s=fmt(v); for(let k in families) if(families[k].includes(s)) return k; return "NA"; }

function draw() {
    let h = "<tr><th>MON</th><th>TUE</th><th>WED</th><th>THU</th><th>FRI</th><th>SAT</th></tr>";
    db.forEach((r, ri) => {
        h += "<tr>";
        r.forEach((c, ci) => {
            let cls = c === "**" ? "blank" : "";
            if(activeMeta) {
                if(ri === activeMeta.tR && ci === activeMeta.tC) cls += " target-cell";
                if(ri === activeMeta.sR && ci === activeMeta.tC) cls += " source-origin";
                activeMeta.pts.forEach(p => { if(ri === activeMeta.sR + p.dr && ci === p.dc) cls += " circle-source"; });
            }
            h += `<td class="${cls}" contenteditable="true" onblur="db[${ri}][${ci}]=fmt(this.innerText);draw();" onclick="runOracle(${ri},${ci})">${c}</td>`;
        });
        h += "</tr>";
    });
    document.getElementById("tbl").innerHTML = h;
}

function runOracle(r, c) {
    if(db[r][c] !== "**") { activeMeta = null; draw(); return; }
    
    let dna = [];
    for(let i=1; i<=10; i++) { // 10 Week Deep Scan
        if(db[r-i]) db[r-i].forEach((v, col) => { if(v!=="**") dna.push({dr: -i, dc: col, val: v, f: getF(v)}); });
    }

    let scores = {};
    let best = null;

    for(let i=0; i < db.length - 1; i++) {
        if(i >= r-1) continue;
        let s = 0;
        dna.forEach(p => {
            if(db[i+p.dr] && db[i+p.dr][p.dc] !== "**") {
                if(db[i+p.dr][p.dc] === p.val) s += 100; // Perfect Match
                else if(getF(db[i+p.dr][p.dc]) === p.f) s += 40; // Family Match
            }
        });

        if(s > 40 && db[i][c] !== "**") {
            scores[db[i][c]] = (scores[db[i][c]] || 0) + s;
            if(!best || s > best.score) best = { sR: i, tR: r, tC: c, score: s, pts: dna.slice(0,6) };
        }
    }

    let res = Object.keys(scores).sort((a,b) => scores[b] - scores[a]);
    document.getElementById("p1").innerText = res[0] || "??";
    document.getElementById("p2").innerText = res[1] || "??";
    document.getElementById("p3").innerText = res[2] || "??";
    activeMeta = best;
    draw();
}

function openPopup() {
    if(!activeMeta) return;
    document.getElementById("overlay").style.display = "block";
    document.getElementById("popup").style.display = "block";
    document.getElementById("popData").innerText = "Found in Record: " + db[activeMeta.sR][activeMeta.tC];
}

function closePopup() { document.getElementById("popup").style.display = "none"; document.getElementById("overlay").style.display = "none"; }
function addRow() { db.push(["**","**","**","**","**","**"]); draw(); }
function importCSV(input) {
    let reader = new FileReader();
    reader.onload = () => {
        db = reader.result.split('\n').filter(l => l.trim()).map(l => l.split(',').map(v => fmt(v.trim())));
        draw();
    };
    reader.readAsText(input.files[0]);
}
function saveData() { localStorage.setItem("v23_final", JSON.stringify(db)); alert("Data Saved!"); }
draw();
</script>
</body>
</html>
