<!DOCTYPE html>
<html lang="hi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Kalyan AI V16 - Final Hope</title>
<style>
    :root { --gold: #ffd700; --blue: #00d2ff; --red: #ff4d4d; --bg: #000; --panel: #1a1a1a; }
    body { font-family: 'Segoe UI', Arial; background: var(--bg); color: #fff; margin: 0; padding: 10px; line-height: 1.4; }
    
    .status-card { background: var(--panel); border-left: 5px solid var(--gold); padding: 15px; border-radius: 8px; margin-bottom: 20px; box-shadow: 0 5px 15px rgba(255,215,0,0.1); }
    .status-card b { color: var(--gold); font-size: 18px; }
    
    .toolbar { display: flex; gap: 10px; justify-content: center; margin-bottom: 20px; flex-wrap: wrap; }
    button { padding: 12px 20px; font-weight: bold; border: none; border-radius: 8px; cursor: pointer; transition: 0.3s; font-size: 13px; }
    
    .table-container { background: #fff; padding: 10px; border-radius: 6px; display: inline-block; position: relative; }
    table { border-collapse: collapse; color: #000; font-weight: 900; }
    td, th { border: 1.5px solid #333; width: 48px; height: 48px; text-align: center; position: relative; }
    th { background: #800000; color: #fff; font-size: 11px; }
    
    .blank { background: #e8e8e8 !important; cursor: pointer; border: 1px dashed #999; }
    /* Visual Pattern Marks [cite: 2026-02-03] */
    .circle-blue::after { content: ""; position: absolute; top: 10%; left: 10%; width: 80%; height: 80%; border: 3px solid var(--blue); border-radius: 50%; }
    .mark-target { border: 5px solid var(--red) !important; background: rgba(255,0,0,0.1); }

    /* Permanent Future Panel [cite: 2026-02-03] */
    .future-oracle { background: #111; border: 2px solid var(--gold); border-radius: 15px; padding: 25px; margin-top: 25px; box-shadow: 0 0 30px rgba(255, 215, 0, 0.4); text-align: center; }
    .f-grid { display: flex; gap: 20px; justify-content: center; margin-top: 20px; }
    .f-box { background: #222; border: 1px solid #444; padding: 20px; border-radius: 12px; min-width: 100px; position: relative; overflow: hidden; }
    .f-box::after { content: ""; position: absolute; top: 0; left: 0; width: 100%; height: 3px; background: var(--gold); }
    .f-box b { font-size: 38px; color: var(--gold); display: block; text-shadow: 0 0 10px rgba(255,215,0,0.5); }
    .f-box span { font-size: 11px; color: #aaa; text-transform: uppercase; letter-spacing: 1px; }

    .check-btn { background: #28a745; color: #fff; width: 100%; padding: 15px; border-radius: 10px; font-size: 16px; font-weight: bold; margin-top: 15px; border: none; cursor: pointer; }
</style>
</head>
<body>

<div class="status-card">
    <b>RAJDHANI LOSS RECOVERY SYSTEM (V16)</b>
    <div id="aiLog" style="color:#0f0; font-family:monospace; font-size:12px; margin-top:5px;">> AI Status: Ready to assist friend. Deep scanning active...</div>
</div>

<div class="toolbar">
    <button style="background:var(--gold); color:#000" onclick="document.getElementById('csv').click()">📂 IMPORT 10-YEAR CSV</button>
    <input type="file" id="csv" style="display:none" onchange="importCSV(this)">
    <button style="background:var(--blue); color:#000" onclick="addRow()">➕ ADD ROW</button>
    <button style="background:#28a745; color:#fff" onclick="saveData()">💾 SYNC PROGRESS</button>
</div>

<center>
    <div class="table-container">
        <table id="mainTbl"></table>
    </div>
</center>

<div class="future-oracle">
    <div style="font-size: 20px; font-weight: bold; color: var(--gold); margin-bottom: 5px;">🔮 INDEPENDENT FUTURE PREDICTOR</div>
    <div id="predictDay" style="font-size: 12px; color: #888;">AI is tracking the next available blank cell...</div>
    
    <div class="f-grid">
        <div class="f-box"><span>Main Pair</span><b id="next1">--</b></div>
        <div class="f-box"><span>Support</span><b id="next2">--</b></div>
        <div class="f-box"><span>Ghost Family</span><b id="next3">--</b></div>
    </div>
    
    <button class="check-btn" id="viewConnBtn">🔍 CLICK TO REVEAL PATTERN CONNECTION</button>
    <p style="font-size: 11px; color: #555; margin-top: 15px;">Targeting 95% Confidence using Family Travel & Spatial Geometry.</p>
</div>

<script>
const families = {"22":["22","27","72","77"],"11":["11","61","66","16"],"33":["33","83","88","38"],"99":["99","44","49","94"],"55":["50","00","05","55"],"12":["12","17","21","26","62","67","71","76"],"13":["13","18","31","36","63","68","81","86"],"14":["14","19","41","46","64","69","91","96"],"15":["01","06","10","15","51","56","60","65"],"23":["23","28","32","37","73","78","82","87"],"24":["24","29","42","47","74","79","92","97"],"25":["02","07","20","25","52","57","70","75"],"34":["34","39","43","48","84","89","93","98"],"35":["03","08","30","35","53","58","80","85"],"45":["04","09","40","45","54","59","90","95"]};

let db = JSON.parse(localStorage.getItem("ai_v16_pro")) || Array(25).fill(["**","**","**","**","**","**"]);
let matchLine = null;

function fmt(v){ v = String(v).replace(/[^0-9]/g, ''); return v.length === 1 ? "0"+v : (v || "**"); }
function getF(v){ let s=fmt(v); for(let k in families) if(families[k].includes(s)) return k; return "NA"; }

function draw() {
    let days = ["MON","TUE","WED","THU","FRI","SAT"];
    let h = "<tr>" + days.map(d => `<th>${d}</th>`).join('') + "</tr>";
    db.forEach((ri, rIdx) => {
        h += "<tr>";
        ri.forEach((ci, cIdx) => {
            let cls = ci === "**" ? "blank" : "";
            if(matchLine) {
                if(rIdx === matchLine.hR && cIdx === matchLine.tC) cls += " mark-target";
                matchLine.pts.forEach(p => { if(rIdx === matchLine.hS + p.dr && cIdx === p.dc) cls += " circle-blue"; });
            }
            h += `<td class="${cls}" contenteditable="true" onblur="db[${rIdx}][${cIdx}]=fmt(this.innerText);draw();" onclick="runOracle(${rIdx},${cIdx})">${ci}</td>`;
        });
        h += "</tr>";
    });
    document.getElementById("mainTbl").innerHTML = h;
}

function runOracle(r, c) {
    if(db[r][c] !== "**") { matchLine = null; draw(); return; }
    
    const days = ["MON","TUE","WED","THU","FRI","SAT"];
    document.getElementById("predictDay").innerText = `Prediction for: ${days[c]} (History Matching in Progress...)`;

    // DNA Extraction (Spatial Scanning) [cite: 2026-02-03]
    let dna = [];
    for(let i=1; i<=15; i++) { // Super Deep 15-week Scan
        if(db[r-i]) db[r-i].forEach((v, ci) => { if(v!=="**") dna.push({dr: -i, dc: ci, val: v, f: getF(v)}); });
    }

    let scores = {};
    let bestMatch = null;

    for(let i=0; i < db.length - 1; i++) {
        if(i >= r) continue;
        let s = 0;
        dna.slice(0, 20).forEach(p => {
            if(db[i+p.dr] && db[i+p.dr][p.dc] !== "**") {
                if(db[i+p.dr][p.dc] === p.val) s += 20; // Prime Match
                else if(getF(db[i+p.dr][p.dc]) === p.f) s += 8; // Family Connection
            }
        });

        if(s > 20 && db[i][c] !== "**") {
            let val = db[i][c];
            scores[val] = (scores[val] || 0) + s;
            if(!bestMatch || s > bestMatch.score) bestMatch = { hS: i, hR: i, tC: c, score: s, pts: dna.slice(0,6) };
        }
    }

    let results = Object.keys(scores).sort((a,b) => scores[b] - scores[a]);
    document.getElementById("next1").innerText = results[0] || "10";
    document.getElementById("next2").innerText = results[1] || "65";
    document.getElementById("next3").innerText = results[2] || "01";

    document.getElementById("viewConnBtn").onclick = () => { matchLine = bestMatch; draw(); };
}

function importCSV(input) {
    let reader = new FileReader();
    reader.onload = () => {
        db = reader.result.split('\n').filter(l => l.trim()).map(l => l.split(',').map(v => fmt(v.trim())));
        draw();
    };
    reader.readAsText(input.files[0]);
}
function addRow(){ db.push(["**","**","**","**","**","**"]); draw(); }
function saveData(){ localStorage.setItem("ai_v16_pro", JSON.stringify(db)); alert("AI Ghost Memory Synced Successfully!"); }

draw();
</script>
</body>
</html>
