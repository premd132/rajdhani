<!DOCTYPE html>
<html lang="hi">
<head>
<meta charset="UTF-8">
<title>Kalyan AI V27 - Calculation Master</title>
<style>
    :root { --gold: #ffd700; --blue: #00d2ff; --bg: #0a0a0a; --panel: #1a1a1a; }
    body { font-family: 'Segoe UI', Arial; background: var(--bg); color: #fff; margin: 0; padding: 10px; }
    
    .header { background: var(--panel); border: 2px solid var(--gold); padding: 15px; border-radius: 12px; text-align: center; margin-bottom: 15px; }
    .btn-row { margin-top: 10px; display: flex; justify-content: center; gap: 8px; flex-wrap: wrap; }
    .btn { background: #333; color: #fff; border: 1px solid #555; padding: 10px 15px; border-radius: 6px; cursor: pointer; font-weight: bold; }
    .btn:hover { background: var(--gold); color: #000; }

    .chart-container { background: #fff; padding: 15px; border-radius: 8px; display: inline-block; position: relative; }
    table { border-collapse: collapse; color: #000; font-weight: 900; font-size: 19px; }
    td, th { border: 1px solid #333; width: 52px; height: 52px; text-align: center; position: relative; }
    th { background: #500; color: #fff; font-size: 11px; }

    /* Logic Markers [cite: 2026-02-03] */
    .blank { background: #eee !important; cursor: text; color: #aaa; }
    .source-highlight { background: #ffff00 !important; border: 2px solid red !important; }
    .calc-dot { position: absolute; top: 2px; left: 2px; width: 6px; height: 6px; background: var(--blue); border-radius: 50%; }

    .calc-panel { background: #111; border: 2px solid var(--blue); padding: 20px; border-radius: 15px; margin-top: 20px; }
    .calc-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 15px; text-align: center; }
    .calc-box { background: #222; padding: 15px; border-radius: 10px; border-top: 3px solid var(--gold); }
    .calc-box span { font-size: 11px; color: var(--gold); text-transform: uppercase; }
    .calc-box b { font-size: 28px; display: block; margin-top: 5px; color: #fff; }

    .popup { display: none; position: fixed; top: 50%; left: 50%; transform: translate(-50%, -50%); background: white; color: #000; padding: 25px; border-radius: 15px; z-index: 100; width: 300px; border: 5px solid var(--blue); box-shadow: 0 0 50px rgba(0,0,0,0.5); }
    .overlay { display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.8); z-index: 99; }
</style>
</head>
<body>

<div class="header">
    <h2 style="margin:0; color:var(--gold);">🎯 KALYAN SUM-CALCULATOR AI</h2>
    <div class="btn-row">
        <button class="btn" onclick="document.getElementById('csvInp').click()">📂 LOAD CSV</button>
        <input type="file" id="csvInp" style="display:none" onchange="importCSV(this)">
        <button class="btn" onclick="addRow()">➕ ADD WEEK</button>
        <button class="btn" style="background:#28a745; border:none;" onclick="saveData()">💾 SYNC DATA</button>
    </div>
</div>

<center>
    <div class="chart-container">
        <table id="mainTbl"></table>
    </div>
</center>

<div class="calc-panel">
    <h3 style="margin:0 0 15px 0; color:var(--blue); text-align:center;">📊 CALCULATION: OPEN-CLOSE SUM TRICK</h3>
    <div class="calc-grid">
        <div class="calc-box">
            <span>PREDICTED OPEN</span>
            <b id="predOpen">--</b>
            <small id="openDetail" style="font-size:10px; color:#0f0;"></small>
        </div>
        <div class="calc-box">
            <span>PREDICTED CLOSE</span>
            <b id="predClose">--</b>
            <small id="closeDetail" style="font-size:10px; color:#0f0;"></small>
        </div>
    </div>
    <button onclick="showCheckLine()" style="width:100%; padding:15px; margin-top:15px; background:var(--blue); color:#000; font-weight:bold; border:none; border-radius:8px; cursor:pointer;">🔍 VIEW CONNECTION & CALCULATION (POPUP)</button>
</div>

<div class="overlay" id="overlay" onclick="closePopup()"></div>
<div class="popup" id="popup">
    <h3 style="margin-top:0">Sum Calculation Proof</h3>
    <div id="popContent" style="text-align:left; font-family:monospace; font-size:14px; background:#f9f9f9; padding:10px; border-radius:5px;"></div>
    <button onclick="closePopup()" style="margin-top:15px; background:red; color:white; border:none; padding:10px 20px; border-radius:5px; cursor:pointer; width:100%;">CLOSE</button>
</div>

<script>
let db = JSON.parse(localStorage.getItem("v27_calc")) || Array(10).fill(["**","**","**","**","**","**"]);
let activeCalc = null;

function fmt(v){ v = v.replace(/[^0-9]/g, ''); return v.length === 1 ? "0"+v : (v || "**"); }
function getCut(n){ return (parseInt(n) + 5) % 10; }

function draw() {
    let h = "<tr><th>MON</th><th>TUE</th><th>WED</th><th>THU</th><th>FRI</th><th>SAT</th></tr>";
    db.forEach((r, ri) => {
        h += "<tr>";
        r.forEach((c, ci) => {
            let cls = c === "**" ? "blank" : "";
            if(activeCalc && activeCalc.rows.includes(ri) && ci === activeCalc.col) cls += " source-highlight";
            h += `<td class="${cls}" contenteditable="true" onblur="updateCell(${ri},${ci},this.innerText)">${c}${cls.includes('source-highlight')?'<div class="calc-dot"></div>':''}</td>`;
        });
        h += "</tr>";
    });
    document.getElementById("mainTbl").innerHTML = h;
}

function updateCell(ri, ci, val) {
    db[ri][ci] = fmt(val);
    runCalculation(ri, ci); // Re-calculate whenever a cell is edited
    draw();
}

function runCalculation(row, col) {
    // Collect last 5 pairs from the SAME column (vertical sum)
    let openSum = 0, closeSum = 0, usedRows = [], openFormula = "", closeFormula = "";
    let count = 0;
    
    for(let i = row - 1; i >= 0 && count < 5; i--) {
        let pair = db[i][col];
        if(pair !== "**") {
            let o = parseInt(pair[0]);
            let c = parseInt(pair[1]);
            openSum += o;
            closeSum += c;
            usedRows.push(i);
            openFormula += (count === 0 ? "" : "+") + o;
            closeFormula += (count === 0 ? "" : "+") + c;
            count++;
        }
    }

    if(count > 0) {
        let finalOpen = openSum % 10;
        let finalClose = closeSum % 10;
        document.getElementById("predOpen").innerText = `${finalOpen},${getCut(finalOpen)}`;
        document.getElementById("predClose").innerText = `${finalClose},${getCut(finalClose)}`;
        document.getElementById("openDetail").innerText = `${openFormula}=${openSum}`;
        document.getElementById("closeDetail").innerText = `${closeFormula}=${closeSum}`;
        
        activeCalc = { rows: usedRows, col: col, openSum: openSum, closeSum: closeSum, openF: openFormula, closeF: closeFormula, fO: finalOpen, fC: finalClose };
    }
}

function showCheckLine() {
    if(!activeCalc) return alert("Pehle data bharo!");
    document.getElementById("overlay").style.display = "block";
    document.getElementById("popup").style.display = "block";
    document.getElementById("popContent").innerHTML = `
        <b>Open Calculation:</b><br>${activeCalc.openF} = ${activeCalc.openSum}<br>
        Result: ${activeCalc.fO} (Cut: ${getCut(activeCalc.fO)})<br><br>
        <b>Close Calculation:</b><br>${activeCalc.closeF} = ${activeCalc.closeSum}<br>
        Result: ${activeCalc.fC} (Cut: ${getCut(activeCalc.fC)})
    `;
}

function closePopup() { document.getElementById("popup").style.display = "none"; document.getElementById("overlay").style.display = "none"; }
function addRow() { db.push(["**","**","**","**","**","**"]); draw(); }
function saveData() { localStorage.setItem("v27_calc", JSON.stringify(db)); alert("AI Synced!"); }
function importCSV(input) {
    let reader = new FileReader();
    reader.onload = () => {
        db = reader.result.split('\n').filter(l => l.trim()).map(l => l.split(',').map(v => fmt(v.trim())));
        draw();
    };
    reader.readAsText(input.files[0]);
}

draw();
</script>
</body>
</html>
