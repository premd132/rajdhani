<!DOCTYPE html>
<html lang="hi">
<head>
<meta charset="UTF-8">
<title>Kalyan AI V25 - Total Theory Pro</title>
<style>
    :root { --gold: #ffd700; --blue: #00d2ff; --bg: #050505; --row: #1a1a1a; }
    body { font-family: 'Segoe UI', Arial; background: var(--bg); color: #fff; margin: 0; padding: 10px; }
    
    .header-panel { border: 2px solid var(--gold); background: var(--row); padding: 15px; border-radius: 12px; text-align: center; margin-bottom: 20px; }
    
    .btn { background: #333; color: #fff; border: 1px solid #555; padding: 10px 15px; border-radius: 5px; cursor: pointer; font-weight: bold; margin: 5px; }
    .btn:hover { background: var(--gold); color: #000; }

    .matrix-box { background: #fff; padding: 10px; border-radius: 8px; display: inline-block; position: relative; }
    table { border-collapse: collapse; color: #000; font-weight: 900; }
    td, th { border: 1px solid #222; width: 48px; height: 48px; text-align: center; position: relative; }
    th { background: #400; color: #fff; font-size: 10px; }

    /* Pattern Marking [cite: 2026-02-03] */
    .blank { background: #f0f0f0 !important; cursor: cell; }
    .circle-mark::after { content: ""; position: absolute; top: 10%; left: 10%; width: 80%; height: 80%; border: 3px solid var(--blue); border-radius: 50%; }
    .source-highlight { background: #ffeb3b !important; border: 2px solid red !important; }
    .total-badge { position: absolute; bottom: -2px; right: 0; font-size: 8px; color: blue; font-weight: bold; }

    .future-analysis { background: #111; border: 2px solid var(--blue); padding: 20px; border-radius: 15px; margin-top: 20px; text-align: center; }
    .stat-row { display: flex; justify-content: space-around; margin-bottom: 15px; border-bottom: 1px solid #333; padding-bottom: 10px; }
    .stat-box { font-size: 12px; color: var(--gold); }
    .stat-box b { display: block; font-size: 20px; color: #fff; }

    .popup-overlay { display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.9); z-index: 100; }
    .popup-card { position: fixed; top: 50%; left: 50%; transform: translate(-50%, -50%); background: #fff; color: #000; padding: 20px; border-radius: 10px; z-index: 101; text-align: center; width: 280px; }
</style>
</head>
<body>

<div class="header-panel">
    <h2 style="margin:0; color:var(--gold);">Satta Total Oracle V25</h2>
    <div style="margin-top:10px;">
        <button class="btn" onclick="document.getElementById('csv').click()">📂 LOAD RECORD</button>
        <input type="file" id="csv" style="display:none" onchange="importCSV(this)">
        <button class="btn" onclick="addRow()" style="color:var(--gold)">➕ ADD WEEK</button>
        <button class="btn" onclick="saveData()" style="background:#28a745; border:none;">💾 SYNC AI</button>
    </div>
</div>

<center>
    <div class="matrix-box">
        <table id="mainTbl"></table>
    </div>
</center>

<div class="future-analysis">
    <div class="stat-row">
        <div class="stat-box">Predicted Total<b id="predTotal">--</b></div>
        <div class="stat-box">Odd/Even<b id="oddEven">--</b></div>
        <div class="stat-box">Confidence<b id="conf">0%</b></div>
    </div>
    <div style="display:flex; gap:10px; justify-content:center;">
        <div style="background:#222; padding:10px; border-radius:8px; width:80px;">MAIN<b style="display:block; font-size:24px; color:var(--gold);" id="f1">--</b></div>
        <div style="background:#222; padding:10px; border-radius:8px; width:80px;">SUPP<b style="display:block; font-size:24px; color:var(--gold);" id="f2">--</b></div>
        <div style="background:#222; padding:10px; border-radius:8px; width:80px;">CUT<b style="display:block; font-size:24px; color:var(--gold);" id="f3">--</b></div>
    </div>
    <button onclick="checkPopup()" style="width:100%; padding:15px; margin-top:15px; background:var(--blue); border:none; border-radius:8px; font-weight:bold; cursor:pointer;">🔍 CHECK LINE RECORD (POPUP)</button>
</div>

<div class="popup-overlay" id="overlay" onclick="closePopup()"></div>
<div class="popup-card" id="popup" style="display:none;">
    <h3 style="margin-top:0">Historical Mirror Match</h3>
    <div id="popBody" style="font-size:22px; font-weight:bold; margin:15px 0;"></div>
    <p style="font-size:11px; color:#666;">This jodi was derived using the 'Weekly Total Mirror' logic from your old CSV records.</p>
    <button onclick="closePopup()" style="background:red; color:white; border:none; padding:10px 20px; border-radius:5px; cursor:pointer;">CLOSE</button>
</div>

<script>
let db = JSON.parse(localStorage.getItem("v25_total_ai")) || Array(20).fill(["**","**","**","**","**","**"]);
let matchData = null;

function fmt(v){ v = v.replace(/[^0-9]/g, ''); return v.length === 1 ? "0"+v : (v || "**"); }
function getSum(v){ if(v==="**") return null; let s = parseInt(v[0]) + parseInt(v[1]); return s > 9 ? s % 10 : s; }

function draw() {
    let h = "<tr><th>MON</th><th>TUE</th><th>WED</th><th>THU</th><th>FRI</th><th>SAT</th></tr>";
    db.forEach((r, ri) => {
        h += "<tr>";
        r.forEach((c, ci) => {
            let cls = c === "**" ? "blank" : "";
            let sum = getSum(c);
            if(matchData) {
                if(ri === matchData.sR && ci === matchData.tC) cls += " source-highlight";
                matchData.pts.forEach(p => { if(ri === matchData.sR + p.dr && ci === p.dc) cls += " circle-mark"; });
            }
            h += `<td class="${cls}" contenteditable="true" onblur="db[${ri}][${ci}]=fmt(this.innerText);draw();" onclick="totalScan(${ri},${ci})">${c}${sum!==null?`<span class="total-badge">${sum}</span>`:''}</td>`;
        });
        h += "</tr>";
    });
    document.getElementById("mainTbl").innerHTML = h;
}

function totalScan(r, c) {
    if(db[r][c] !== "**") { matchData = null; draw(); return; }
    
    // Total Pattern Discovery (10 Weeks) [cite: 2026-02-03]
    let dna = [];
    for(let i=1; i<=10; i++) {
        if(db[r-i]) db[r-i].forEach((v, col) => { if(v!=="**") dna.push({dr: -i, dc: col, val: v, sum: getSum(v)}); });
    }

    let results = {};
    let best = null;

    for(let i=0; i < db.length - 1; i++) {
        if(i >= r-1) continue;
        let score = 0;
        dna.forEach(p => {
            if(db[i+p.dr] && db[i+p.dr][p.dc] !== "**") {
                if(db[i+p.dr][p.dc] === p.val) score += 100;
                else if(getSum(db[i+p.dr][p.dc]) === p.sum) score += 40; // Total Match Weight
            }
        });

        if(score > 40 && db[i][c] !== "**") {
            results[db[i][c]] = (results[db[i][c]] || 0) + score;
            if(!best || score > best.score) best = { sR: i, tR: r, tC: c, score: score, pts: dna.slice(0,5) };
        }
    }

    let res = Object.keys(results).sort((a,b) => results[a] - results[b]);
    let topJodi = res[0] || "15";
    document.getElementById("f1").innerText = topJodi;
    document.getElementById("f2").innerText = res[1] || "60";
    document.getElementById("f3").innerText = res[2] || "01";
    
    let t = getSum(topJodi);
    document.getElementById("predTotal").innerText = t;
    document.getElementById("oddEven").innerText = t % 2 === 0 ? "EVEN" : "ODD";
    document.getElementById("conf").innerText = best ? "95%" : "40%";
    
    matchData = best;
    draw();
}

function checkPopup() {
    if(!matchData) return;
    document.getElementById("overlay").style.display = "block";
    document.getElementById("popup").style.display = "block";
    document.getElementById("popBody").innerText = "Historical Pair: " + db[matchData.sR][matchData.tC];
}

function closePopup() { document.getElementById("popup").style.display = "none"; document.getElementById("overlay").style.display = "none"; }
function addRow() { db.push(["**","**","**","**","**","**"]); draw(); }
function saveData() { localStorage.setItem("v25_total_ai", JSON.stringify(db)); alert("Total Theory Synced!"); }
function importCSV(input) {
    let reader = new FileReader();
    reader.onload = () => {
        db = reader.result.split('\n').filter(l => l.trim()).map(l => l.split(',').map(v => fmt(v.trim())));
        draw();
    };
    reader.readAsText(input.files[0]);
}
draw();
</script>
</body>
</html>
