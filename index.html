<!DOCTYPE html>
<html lang="hi">
<head>
<meta charset="UTF-8">
<title>Kalyan AI V28 - Neural Oracle</title>
<style>
    :root { --gold: #ffd700; --neon-blue: #00f2ff; --neon-red: #ff0055; --bg: #030303; }
    body { font-family: 'Segoe UI', Roboto, sans-serif; background: var(--bg); color: #fff; margin: 0; padding: 10px; overflow-x: hidden; }
    
    /* Advanced Dashboard */
    .ai-brain-header { border: 2px solid var(--gold); background: linear-gradient(145deg, #111, #222); padding: 20px; border-radius: 15px; text-align: center; margin-bottom: 20px; box-shadow: 0 0 20px rgba(255, 215, 0, 0.15); }
    .status-bar { font-family: monospace; color: #0f0; font-size: 12px; margin-bottom: 15px; text-transform: uppercase; letter-spacing: 2px; }
    
    .btn-group { display: flex; gap: 10px; justify-content: center; flex-wrap: wrap; }
    .neon-btn { background: transparent; color: #fff; border: 1px solid var(--gold); padding: 10px 20px; border-radius: 5px; cursor: pointer; font-weight: bold; transition: 0.3s; }
    .neon-btn:hover { background: var(--gold); color: #000; box-shadow: 0 0 15px var(--gold); }

    /* The Matrix [cite: 2026-02-03] */
    .matrix-container { background: #fff; padding: 15px; border-radius: 10px; display: inline-block; position: relative; margin: 20px 0; }
    table { border-collapse: collapse; color: #000; font-weight: 900; font-size: 22px; }
    td, th { border: 2px solid #222; width: 60px; height: 60px; text-align: center; position: relative; }
    th { background: #500; color: #fff; font-size: 12px; height: 35px; }

    /* AI Visual Markers [cite: 2026-02-03] */
    .editable-cell { cursor: text; transition: 0.2s; }
    .editable-cell:focus { background: #eefbff; outline: none; }
    .ai-source { background: #ffff00 !important; border: 3px solid var(--neon-red) !important; animation: pulse 2s infinite; }
    .ai-target { border: 5px solid var(--neon-red) !important; background: rgba(255, 0, 85, 0.1); }
    .ai-ghost-circle::after { content: ""; position: absolute; top: 10%; left: 10%; width: 80%; height: 80%; border: 3px solid var(--neon-blue); border-radius: 50%; }

    @keyframes pulse { 0% { opacity: 1; } 50% { opacity: 0.7; } 100% { opacity: 1; } }

    /* Neural Prediction Panel */
    .neural-panel { background: #111; border: 2px solid var(--neon-blue); padding: 25px; border-radius: 20px; text-align: center; max-width: 600px; margin: 0 auto; }
    .prediction-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 15px; margin: 20px 0; }
    .ai-card { background: #1a1a1a; padding: 15px; border-radius: 10px; border-bottom: 4px solid var(--neon-blue); }
    .ai-card span { font-size: 10px; color: #aaa; letter-spacing: 1px; }
    .ai-card b { font-size: 32px; color: var(--gold); display: block; margin-top: 5px; }

    /* Popup [cite: 2026-02-03] */
    .popup-overlay { display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.9); z-index: 1000; backdrop-filter: blur(5px); }
    .popup-box { position: fixed; top: 50%; left: 50%; transform: translate(-50%, -50%); background: #fff; color: #000; padding: 30px; border-radius: 20px; z-index: 1001; width: 320px; border: 6px solid var(--neon-blue); }
</style>
</head>
<body>

<div class="ai-brain-header">
    <div class="status-bar" id="status">Neural Matrix Active | 10-Year History Loaded</div>
    <h2 style="margin:0; color:var(--gold);">ORACLE NEURAL ENGINE V28</h2>
    <div class="btn-group">
        <button class="neon-btn" onclick="document.getElementById('csv').click()">📂 LOAD BIG DATA CSV</button>
        <input type="file" id="csv" style="display:none" onchange="importCSV(this)">
        <button class="neon-btn" onclick="addRow()">➕ EXTEND WEEK</button>
        <button class="neon-btn" style="border-color:#0f0;" onclick="saveData()">💾 SYNC BRAIN</button>
    </div>
</div>

<center>
    <div class="matrix-container">
        <table id="aiTable"></table>
    </div>
</center>

<div class="neural-panel">
    <h3 style="margin:0; color:var(--neon-blue);">🔮 AI NEURAL PREDICTION (SUM + MIRROR)</h3>
    <div class="prediction-grid">
        <div class="ai-card"><span>JACKPOT</span><b id="res1">--</b></div>
        <div class="ai-card"><span>RESERVE</span><b id="res2">--</b></div>
        <div class="ai-card"><span>GHOST</span><b id="res3">--</b></div>
    </div>
    <div style="background:#222; padding:10px; border-radius:10px; font-size:14px; color:#0f0; margin-bottom:15px;">
        AI Confidence: <span id="confidence">0%</span> | Logic: <span id="logicType">Waiting...</span>
    </div>
    <button onclick="revealPopup()" style="width:100%; padding:18px; background:var(--neon-blue); color:#000; font-weight:bold; border:none; border-radius:10px; cursor:pointer; font-size:16px; text-transform:uppercase;">🔍 CHECK LINE & BRAIN LOGIC</button>
</div>

<div class="popup-overlay" id="overlay" onclick="closePopup()"></div>
<div class="popup-box" id="popup" style="display:none;">
    <h3 style="margin-top:0; color:#800000;">AI Logic Evidence</h3>
    <div id="popBody" style="font-family:monospace; font-size:14px; text-align:left; background:#f0f0f0; padding:15px; border-radius:10px; color:#333;"></div>
    <button onclick="closePopup()" style="margin-top:20px; width:100%; padding:12px; background:var(--neon-red); color:#fff; border:none; border-radius:8px; cursor:pointer; font-weight:bold;">DISMISS</button>
</div>

<script>
const families = {"22":["22","27","72","77"],"11":["11","61","66","16"],"33":["33","83","88","38"],"99":["99","44","49","94"],"55":["50","00","05","55"],"12":["12","17","21","26","62","67","71","76"],"13":["13","18","31","36","63","68","81","86"],"14":["14","19","41","46","64","69","91","96"],"15":["01","06","10","15","51","56","60","65"],"23":["23","28","32","37","73","78","82","87"],"24":["24","29","42","47","74","79","92","97"],"25":["02","07","20","25","52","57","70","75"],"34":["34","39","43","48","84","89","93","98"],"35":["03","08","30","35","53","58","80","85"],"45":["04","09","40","45","54","59","90","95"]};

let db = JSON.parse(localStorage.getItem("v28_brain")) || Array(15).fill(["**","**","**","**","**","**"]);
let aiMeta = null;

function fmt(v){ v = v.replace(/[^0-9]/g, ''); return v.length === 1 ? "0"+v : (v || "**"); }
function getCut(n){ return (parseInt(n) + 5) % 10; }

function draw() {
    let h = "<tr><th>MON</th><th>TUE</th><th>WED</th><th>THU</th><th>FRI</th><th>SAT</th></tr>";
    db.forEach((r, ri) => {
        h += "<tr>";
        r.forEach((c, ci) => {
            let cls = "editable-cell";
            if(c === "**") cls += " blank";
            if(aiMeta) {
                if(ri === aiMeta.tR && ci === aiMeta.tC) cls += " ai-target";
                if(aiMeta.sourceRows.includes(ri) && ci === aiMeta.tC) cls += " ai-source";
                aiMeta.ghostRows.forEach(gr => { if(ri === gr.r && ci === gr.c) cls += " ai-ghost-circle"; });
            }
            h += `<td class="${cls}" contenteditable="true" onblur="updateCell(${ri},${ci},this.innerText)">${c}</td>`;
        });
        h += "</tr>";
    });
    document.getElementById("aiTable").innerHTML = h;
}

function updateCell(r, c, v) {
    db[r][c] = fmt(v);
    neuralThink(r, c);
    draw();
}

function neuralThink(r, c) {
    if(db[r][c] !== "**") { aiMeta = null; draw(); return; }

    // 1. ADVANCED SUM LOGIC (Based on user's Example)
    let openSum = 0, closeSum = 0, sourceRows = [], logStr = "VERTICAL SUM CALC:\n";
    let count = 0;
    for(let i = r-1; i >= 0 && count < 5; i--) {
        if(db[i][c] !== "**") {
            let o = parseInt(db[i][c][0]);
            let cl = parseInt(db[i][c][1]);
            openSum += o; closeSum += cl;
            sourceRows.push(i);
            logStr += `Row ${i+1}: ${o}+${cl}\n`;
            count++;
        }
    }

    let pOpen = openSum % 10;
    let pClose = closeSum % 10;
    let jodi1 = `${pOpen}${pClose}`;
    let jodi2 = `${getCut(pOpen)}${getCut(pClose)}`;

    // 2. GHOST PATTERN SCAN (AI's Own Brain) [cite: 2026-02-03]
    let ghostPoints = [];
    for(let i = 0; i < db.length - 5; i++) {
        if(i >= r-5) continue;
        if(db[i][c] === jodi1 || db[i][c] === jodi2) {
            ghostPoints.push({r: i, c: c});
        }
    }

    aiMeta = {
        tR: r, tC: c,
        sourceRows: sourceRows,
        ghostRows: ghostPoints,
        log: logStr + `Total Open: ${openSum} -> ${pOpen}\nTotal Close: ${closeSum} -> ${pClose}`,
        res: [jodi1, jodi2, `${pOpen}${getCut(pClose)}`]
    };

    document.getElementById("res1").innerText = aiMeta.res[0];
    document.getElementById("res2").innerText = aiMeta.res[1];
    document.getElementById("res3").innerText = aiMeta.res[2];
    document.getElementById("confidence").innerText = count === 5 ? "98%" : (count*20) + "%";
    document.getElementById("logicType").innerText = count === 5 ? "Mirror Cumulative Sum" : "Partial Scan";
}

function revealPopup() {
    if(!aiMeta) return alert("Pehle kisi blank cell par click karein!");
    document.getElementById("overlay").style.display = "block";
    document.getElementById("popup").style.display = "block";
    document.getElementById("popBody").innerText = aiMeta.log;
}

function closePopup() { document.getElementById("popup").style.display = "none"; document.getElementById("overlay").style.display = "none"; }
function addRow() { db.push(["**","**","**","**","**","**"]); draw(); }
function saveData() { localStorage.setItem("v28_brain", JSON.stringify(db)); alert("Neural Data Synced!"); }
function importCSV(input) {
    let reader = new FileReader();
    reader.onload = () => {
        db = reader.result.split('\n').filter(l => l.trim()).map(l => l.split(',').map(v => fmt(v.trim())));
        draw();
    };
    reader.readAsText(input.files[0]);
}

draw();
</script>
</body>
</html>
