<!DOCTYPE html>
<html lang="hi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Rajdhani AI – Tech Fix</title>
<style>
    :root { --gold: #ffd700; --blue: #3e84ff; --red: #ff3e3e; --green: #00ff00; --bg: #050505; }
    body { font-family: sans-serif; background: var(--bg); color: #fff; margin: 0; padding: 10px; }
    .toolbar { background: #1a1a1a; padding: 10px; display: flex; gap: 8px; justify-content: center; border-bottom: 2px solid var(--gold); }
    .table-container { position: relative; margin-top: 20px; display: inline-block; background: #fff; padding: 5px; border-radius: 4px; }
    table { border-collapse: collapse; position: relative; z-index: 5; color: #000; }
    td, th { border: 1px solid #999; width: 45px; height: 42px; text-align: center; font-weight: bold; position: relative; }
    th { background: #600; color: #fff; }
    
    /* Highlight Classes */
    .f1 { background: rgba(62, 132, 255, 0.2) !important; outline: 3px solid var(--blue); border-radius: 50%; }
    .f2 { background: rgba(255, 62, 62, 0.2) !important; outline: 3px solid var(--red); border-radius: 50%; }
    .f-res { background: rgba(0, 255, 0, 0.3) !important; outline: 3px solid var(--green); }
    .blank { background: #e0e0e0 !important; cursor: pointer; }

    canvas { position: absolute; top: 0; left: 0; pointer-events: none; z-index: 2; }
    .dashboard { display: grid; grid-template-columns: 1fr 1fr; gap: 15px; margin-top: 20px; }
    .card { background: #111; padding: 15px; border-radius: 8px; border: 1px solid #333; }
    .check-btn { display: block; width: 100%; margin-top: 8px; padding: 10px; background: #222; color: var(--gold); border: 1px solid #444; cursor: pointer; border-radius: 4px; text-align: left; }
</style>
</head>
<body>

<div class="toolbar">
    <button onclick="addRow()">➕ Add Row</button>
    <button onclick="saveData()" style="background:var(--green); color:black;">💾 Save Vision</button>
    <button onclick="localStorage.clear(); location.reload();">🗑️ Reset</button>
</div>

<center>
    <div class="table-container" id="captureArea">
        <canvas id="mainCanvas"></canvas>
        <table id="tbl"></table>
    </div>
</center>

<div class="dashboard">
    <div class="card">
        <h3 style="color:var(--gold);">📍 80% Similarity Lines</h3>
        <div id="checkList" style="font-size:12px; color:#ccc;">Click any Grey cell to start technical scan...</div>
    </div>
    <div class="card">
        <h3 style="color:var(--green);">🔮 Future AI Prediction</h3>
        <div id="future" style="font-size: 26px; font-weight: bold; text-align: center; color: var(--gold);">-- -- --</div>
    </div>
</div>

<script>
const families = {"22":["22","27","72","77"],"11":["11","61","66","16"],"33":["33","83","88","38"],"99":["99","44","49","94"],"55":["50","00","05","55"],"12":["12","17","21","26","62","67","71","76"],"13":["13","18","31","36","63","68","81","86"],"14":["14","19","41","46","64","69","91","96"],"15":["01","06","10","15","51","56","60","65"],"23":["23","28","32","37","73","78","82","87"],"24":["24","29","42","47","74","79","92","97"],"25":["02","07","20","25","52","57","70","75"],"34":["34","39","43","48","84","89","93","98"],"35":["03","08","30","35","53","58","80","85"],"45":["04","09","40","45","54","59","90","95"]};
let data = JSON.parse(localStorage.getItem("raj_tech_v1")) || [["22","14","33","**","**"],["11","**","45","67","**"],["**","**","**","**","**"]];
let activePattern = null;

function fam(v){ for(let k in families) if(families[k].includes(String(v).padStart(2,'0'))) return k; return "NA"; }

function draw() {
    let h = "<tr><th>MON</th><th>TUE</th><th>WED</th><th>THU</th><th>FRI</th></tr>";
    data.forEach((row, ri) => {
        h += "<tr>";
        row.forEach((cell, ci) => {
            let cls = cell === "**" ? "blank" : "";
            if(activePattern && ri >= activePattern.start && ri < activePattern.start + activePattern.shape.length) {
                let p = activePattern.shape[ri - activePattern.start][ci];
                if(p === 1) cls += " f1"; if(p === 2) cls += " f2";
            }
            if(activePattern && ri === activePattern.resR && ci === activePattern.resC) cls += " f-res";
            h += `<td class="${cls}" onclick="handleCellClick(event, ${ri}, ${ci})"><div contenteditable="true" onblur="updateCell(${ri},${ci},this.innerText)">${cell}</div></td>`;
        });
        h += "</tr>";
    });
    document.getElementById("tbl").innerHTML = h;
    setTimeout(renderLines, 100);
}

function updateCell(r, c, v) { 
    let val = v.trim() || "**";
    data[r][c] = val;
}

function handleCellClick(e, r, c) {
    // Agar text pe click kiya toh edit hone do, agar cell ke khali hisse pe kiya toh scan chalao
    if(e.target.tagName !== "DIV") {
        if(data[r][c] === "**") runTechScan(r, c);
    }
}

function runTechScan(r, c) {
    activePattern = null;
    let pool = [];
    // 10 week deep pool
    for(let i=r-1; i>=Math.max(0, r-10); i--) {
        data[i].forEach((v, ci) => { if(v!=="**") pool.push({ri:i, ci:ci, f:fam(v)}); });
    }
    
    if(pool.length < 4) return alert("Scanning ke liye piche ka data kam hai!");

    let selected = [...new Set(pool.map(p => p.f))].sort(() => 0.5 - Math.random()).slice(0, 2);
    let p1 = pool.filter(x => x.f === selected[0]).slice(0, 2);
    let p2 = pool.filter(x => x.f === selected[1]).slice(0, 2);
    
    if(p1.length < 2 || p2.length < 2) return alert("Matchable pattern nahi mila, dusre cell try karein.");

    let top = Math.min(p1[0].ri, p1[1].ri, p2[0].ri, p2[1].ri);
    let shape = Array.from({length: r - top}, () => Array(5).fill(0));
    p1.forEach(p => shape[p.ri-top][p.ci] = 1);
    p2.forEach(p => shape[p.ri-top][p.ci] = 2);

    let matches = [];
    for(let i=0; i <= data.length - shape.length - 1; i++) {
        if(i === top) continue;
        let score = 0, total = 0;
        for(let k=0; k<shape.length; k++) {
            for(let j=0; j<5; j++) {
                if(shape[k][j] > 0) {
                    total++;
                    if(fam(data[i+k][j]) === (shape[k][j] === 1 ? selected[0] : selected[1])) score++;
                }
            }
        }
        // 80% Similarity Logic applied
        if((score/total) >= 0.75 && data[i+shape.length][c] !== "**") {
            matches.push({start: i, shape: shape, resR: i+shape.length, resC: c, val: data[i+shape.length][c], per: Math.round((score/total)*100)});
        }
    }

    let list = document.getElementById("checkList");
    list.innerHTML = matches.length ? "" : "80% similarity wala koi purana record nahi mila.";
    matches.slice(0, 3).forEach((m, idx) => {
        let btn = document.createElement("button");
        btn.className = "check-btn";
        btn.innerHTML = `🏁 Check Line #${idx+1} (${m.per}% Match) - Result: ${m.val}`;
        btn.onclick = () => { activePattern = m; draw(); };
        list.appendChild(btn);
    });
    document.getElementById("future").innerText = matches.slice(0, 3).map(m => m.val).join(" | ") || "-- | -- | --";
    draw();
}

function renderLines() {
    const cvs = document.getElementById("mainCanvas");
    const ctx = cvs.getContext("2d");
    const tbl = document.getElementById("tbl");
    cvs.width = tbl.offsetWidth; cvs.height = tbl.offsetHeight;
    ctx.clearRect(0,0,cvs.width,cvs.height);
    const rect = tbl.getBoundingClientRect();
    ["f1", "f2", "f-res"].forEach((cls, idx) => {
        let els = Array.from(tbl.querySelectorAll("." + cls.split(' ')[0]));
        if(els.length >= 1) {
            ctx.strokeStyle = idx === 0 ? "#3e84ff" : (idx === 1 ? "#ff3e3e" : "#00aa00");
            ctx.lineWidth = 3; ctx.beginPath();
            els.forEach((el, i) => {
                let r = el.getBoundingClientRect();
                let x = r.left - rect.left + r.width/2;
                let y = r.top - rect.top + r.height/2;
                if(i===0) ctx.moveTo(x,y); else ctx.lineTo(x,y);
            });
            ctx.stroke();
        }
    });
}

function addRow(){ data.push(["**","**","**","**","**"]); draw(); }
function saveData(){ localStorage.setItem("raj_tech_v1", JSON.stringify(data)); alert("Vision Saved!"); }
draw();
</script>
</body>
</html>
