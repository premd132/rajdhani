<!DOCTYPE html>
<html lang="hi">
<head>
<meta charset="UTF-8">
<title>Kalyan AI V20 - CSV Loader Pro</title>
<style>
    :root { --gold: #ffd700; --blue: #00d2ff; --bg: #000; }
    body { font-family: Arial; background: var(--bg); color: #fff; padding: 15px; }
    
    /* CSV UPLOAD SECTION - SABSE UPAR */
    .upload-section { 
        background: #222; 
        padding: 25px; 
        border: 3px dashed var(--gold); 
        text-align: center; 
        border-radius: 15px; 
        margin-bottom: 25px;
    }
    .csv-btn { 
        background: var(--gold); 
        color: #000; 
        padding: 15px 30px; 
        font-size: 18px; 
        font-weight: bold; 
        border-radius: 10px; 
        cursor: pointer; 
        border: none;
    }
    .csv-btn:hover { background: #fff; transform: scale(1.05); }

    .table-container { background: #fff; padding: 10px; border-radius: 8px; display: inline-block; position: relative; }
    table { border-collapse: collapse; color: #000; font-weight: 900; }
    td, th { border: 1px solid #333; width: 45px; height: 45px; text-align: center; }
    th { background: #800000; color: #fff; font-size: 12px; }
    .blank { background: #eee !important; cursor: pointer; }

    .future-panel { background: #111; border: 2px solid var(--blue); padding: 20px; border-radius: 15px; margin-top: 20px; text-align: center; }
    .f-box { display: flex; gap: 10px; justify-content: center; margin-top: 15px; }
    .card { background: #222; border: 1px solid var(--gold); padding: 15px; border-radius: 8px; width: 90px; }
    .card b { font-size: 30px; color: var(--gold); display: block; }
</style>
</head>
<body>

<div class="upload-section">
    <h2 style="margin-top:0; color:var(--gold);">Step 1: Apni CSV File Yahan Dalein</h2>
    <p style="color:#aaa;">(Aapki file mein jodiyaan 15, 60, 01 ke format mein honi chahiye)</p>
    <button class="csv-btn" onclick="document.getElementById('csvInput').click()">📂 LOAD 10-YEAR HISTORY (CSV)</button>
    <input type="file" id="csvInput" style="display:none" onchange="importCSV(this)">
</div>

<center>
    <div class="table-container">
        <table id="tbl"></table>
    </div>
</center>

<div class="future-panel">
    <h3 style="margin:0; color:var(--blue);">🔮 AI FUTURE PREDICTION</h3>
    <div class="f-box">
        <div class="card"><span>MAIN</span><b id="res1">--</b></div>
        <div class="card"><span>SUPP</span><b id="res2">--</b></div>
        <div class="card"><span>CUT</span><b id="res3">--</b></div>
    </div>
</div>

<script>
let db = Array(20).fill(["**","**","**","**","**","**"]);

function draw() {
    let h = "<tr><th>MON</th><th>TUE</th><th>WED</th><th>THU</th><th>FRI</th><th>SAT</th></tr>";
    db.forEach((r, ri) => {
        h += "<tr>";
        r.forEach((c, ci) => {
            let cls = c === "**" ? "blank" : "";
            h += `<td class="${cls}" onclick="predict(${ri},${ci})">${c}</td>`;
        });
        h += "</tr>";
    });
    document.getElementById("tbl").innerHTML = h;
}

function importCSV(input) {
    let reader = new FileReader();
    reader.onload = function() {
        let lines = reader.result.split('\n');
        db = lines.filter(l => l.trim() !== "").map(l => {
            let cells = l.split(',').map(v => {
                v = v.trim();
                return v.length === 1 ? "0"+v : (v || "**");
            });
            // Ensure 6 cells per row
            while(cells.length < 6) cells.push("**");
            return cells.slice(0,6);
        });
        draw();
        alert("Data Load Ho Gaya Hai! Ab kisi bhi khali (Grey) cell par click karein.");
    };
    reader.readAsText(input.files[0]);
}

function predict(r, c) {
    if(db[r][c] !== "**") return;
    // Simple logic for example
    let prev = db[r-1] ? db[r-1][c] : "15";
    document.getElementById("res1").innerText = prev;
    document.getElementById("res2").innerText = "01";
    document.getElementById("res3").innerText = "56";
}

draw();
</script>
</body>
</html>
