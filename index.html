<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Kalyan Pro – AI Pattern System</title>
    <style>
        :root { --gold: #ffd700; --blue: #3e86ff; --red: #ff3e3e; --bg: #0a0a0a; --panel: #1a1a1a; }
        body { font-family: 'Segoe UI', Arial; background: var(--bg); color: #fff; margin: 0; padding: 0; overflow-x: hidden; }
        
        /* LOGIN PAGE STYLING */
        #login-page {
            position: fixed; top: 0; left: 0; width: 100%; height: 100%;
            background: radial-gradient(circle, #1a1a1a 0%, #000 100%);
            display: flex; flex-direction: column; align-items: center; justify-content: center; z-index: 9999;
        }
        .login-card {
            background: var(--panel); padding: 30px; border-radius: 15px;
            border: 1px solid var(--gold); text-align: center; width: 85%; max-width: 350px;
            box-shadow: 0 0 20px rgba(255, 215, 0, 0.2);
        }
        .login-card h1 { color: var(--gold); margin-bottom: 20px; font-size: 24px; }
        .input-group { margin-bottom: 15px; text-align: left; }
        .input-group label { display: block; font-size: 12px; color: #888; margin-bottom: 5px; }
        .login-input {
            width: 100%; padding: 12px; background: #000; border: 1px solid #333;
            color: #fff; border-radius: 8px; box-sizing: border-box; outline: none;
        }
        .btn-primary { 
            background: var(--gold); color: #000; width: 100%; padding: 12px; 
            border: none; border-radius: 8px; font-weight: bold; cursor: pointer; font-size: 16px;
        }

        /* MAIN APP STYLING */
        .app-header { background: #111; padding: 10px 15px; display: flex; justify-content: space-between; align-items: center; border-bottom: 1px solid #333; }
        .user-tag { color: var(--gold); font-size: 12px; font-weight: bold; }
        .logout-btn { background: #333; color: #fff; border: none; padding: 5px 10px; border-radius: 4px; font-size: 10px; }
        
        .toolbar { background: var(--panel); padding: 10px; border-radius: 8px; border: 1px solid #444; margin: 10px; display: flex; gap: 8px; flex-wrap: wrap; justify-content: center; }
        .table-container { position: relative; display: inline-block; background: #fff; border-radius: 5px; overflow: hidden; max-width: 95%; }
        table { border-collapse: collapse; font-size: 12px; position: relative; z-index: 2; color: #000; width: 100%; }
        td, th { border: 1px solid #ccc; padding: 8px 4px; text-align: center; font-weight: bold; width: 35px; height: 35px; }
        th { background: #800000; color: white; }
        td[contenteditable] { background: #fffbe6; outline: none; }
        .circle { border: 2.5px solid var(--red); border-radius: 100%; background: rgba(255, 0, 0, 0.15); z-index: 5; }
        .hidden { display: none !important; }
        .card { background: var(--panel); padding: 12px; border-radius: 8px; border-left: 4px solid var(--gold); margin: 10px; }
        canvas { position: absolute; top: 0; left: 0; pointer-events: none; z-index: 3; }
    </style>
</head>
<body>

<div id="login-page">
    <div class="login-card">
        <h1>🏆 KALYAN PRO AI</h1>
        <div class="input-group">
            <label>Mobile Number</label>
            <input type="tel" id="user-mobile" class="login-input" placeholder="Enter Mobile" maxlength="10">
        </div>
        <div class="input-group">
            <label>Access PIN</label>
            <input type="password" id="user-pin" class="login-input" placeholder="Any PIN to signup">
        </div>
        <button class="btn-primary" onclick="attemptLogin()">ENTER SYSTEM</button>
    </div>
</div>

<div id="main-app" class="hidden">
    <div class="app-header">
        <span class="user-tag" id="display-user"></span>
        <button class="logout-btn" onclick="logout()">LOGOUT</button>
    </div>

    <h2 style="text-align:center; color:var(--gold);">KALYAN PATTERN AI</h2>

    <div class="toolbar">
        <button onclick="addRow()" style="background:#444; color:#fff; border:none; padding:8px; border-radius:4px;">➕ Add Row</button>
        <span id="admin-tools" class="hidden">
            <button onclick="saveData()" style="background:#28a745; color:white; border:none; padding:8px; border-radius:4px;">💾 Save Data</button>
            <button onclick="clearData()" style="background:#dc3545; color:white; border:none; padding:8px; border-radius:4px;">🗑️ Reset</button>
        </span>
    </div>

    <center>
        <div class="table-container">
            <canvas id="mainCanvas"></canvas>
            <table id="tbl"></table>
        </div>
    </center>

    <div class="card">
        <h3 style="color:var(--gold); margin:0 0 10px 0;">🤖 AI Prediction</h3>
        <div id="ai">Pattern select karein...</div>
    </div>
</div>

<script>
const STORAGE_KEY = "pdata_kalyan_v2";
const ADMIN_NUMBER = "1234567890"; // 👈 Yahan apna mobile number likhein admin banne ke liye

let data = JSON.parse(localStorage.getItem(STORAGE_KEY)) || [["51","91","41","57","19","95"],["05","90","74","06","19","63"],["**","**","**","**","**","**"]];

function attemptLogin() {
    const mobile = document.getElementById('user-mobile').value;
    if(mobile.length < 10) { alert("Mobile number sahi nahi hai!"); return; }
    localStorage.setItem("session_mobile", mobile);
    enterApp(mobile);
}

function enterApp(mobile) {
    document.getElementById('login-page').classList.add('hidden');
    document.getElementById('main-app').classList.remove('hidden');
    document.getElementById('display-user').innerText = "User: " + mobile;
    if(mobile === ADMIN_NUMBER) document.getElementById('admin-tools').classList.remove('hidden');
    draw();
}

function logout() { localStorage.removeItem("session_mobile"); location.reload(); }

function draw() {
    let h="<tr><th>MON</th><th>TUE</th><th>WED</th><th>THU</th><th>FRI</th><th>SAT</th></tr>";
    data.forEach((r,ri)=>{
        h+="<tr>";
        r.forEach((c,ci)=>{ h+=`<td contenteditable oninput="edit(${ri},${ci},this)">${c}</td>`; });
        h+="</tr>";
    });
    document.getElementById("tbl").innerHTML=h;
}

function edit(r,c,el){ data[r][c]=el.innerText; }
function addRow(){ data.push(["**","**","**","**","**","**"]); draw(); }
function saveData(){ localStorage.setItem(STORAGE_KEY,JSON.stringify(data)); alert("Data Saved!"); }
function clearData(){ if(confirm("Sab delete karein?")){ localStorage.clear(); location.reload(); }}

window.onload = () => {
    const savedUser = localStorage.getItem("session_mobile");
    if(savedUser) enterApp(savedUser);
};
</script>
</body>
</html>
