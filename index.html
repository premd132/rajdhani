<!DOCTYPE html>
<html lang="hi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Kalyan Dynamic AI Predictor</title>
<style>
    :root { --gold: #ffd700; --blue: #007bff; --red: #ff3e3e; --bg: #121212; --panel: #1e1e1e; }
    body { font-family: 'Segoe UI', Arial; background: var(--bg); color: #fff; margin: 0; padding: 10px; }
    
    .toolbar { background: var(--panel); padding: 15px; border-radius: 8px; margin-bottom: 10px; display: flex; gap: 10px; justify-content: center; border: 1px solid #444; }
    
    .table-container { position: relative; background: #fff; padding: 5px; border-radius: 4px; overflow-x: auto; display: inline-block; }
    table { border-collapse: collapse; font-size: 14px; color: #000; width: 100%; }
    td, th { border: 1px solid #ccc; padding: 8px; text-align: center; font-weight: bold; width: 42px; height: 42px; cursor: pointer; }
    th { background: #800000; color: white; }
    
    .blank { background: #f0f0f0 !important; color: #ccc; }
    .active-predict { border: 3px solid var(--blue) !important; background: #e3f2fd !important; }

    .ai-card { background: var(--panel); padding: 20px; border-radius: 10px; border-top: 4px solid var(--gold); margin-top: 20px; box-shadow: 0 4px 15px rgba(0,0,0,0.5); }
    .result-row { display: flex; gap: 10px; margin-top: 15px; }
    .res-item { flex: 1; background: #262626; padding: 15px; border-radius: 8px; text-align: center; border: 1px solid #333; }
    .res-item span { display: block; font-size: 11px; color: #aaa; text-transform: uppercase; }
    .res-item b { font-size: 24px; color: var(--gold); display: block; margin-top: 5px; }
    
    button { padding: 10px 15px; font-weight: bold; cursor: pointer; border: none; border-radius: 4px; }
</style>
</head>
<body>

<div class="toolbar">
    <button style="background:var(--gold)" onclick="document.getElementById('csv').click()">📂 LOAD CSV</button>
    <input type="file" id="csv" style="display:none" onchange="importCSV(this)">
    <button style="background:var(--blue); color:#fff" onclick="addRow()">➕ ADD ROW</button>
    <button style="background:#28a745; color:#fff" onclick="saveData()">💾 SAVE DATA</button>
</div>

<center>
    <div class="table-container">
        <table id="tbl"></table>
    </div>
</center>

<div class="ai-card" id="predictionView" style="display:none">
    <h3 style="margin:0; color:var(--gold)">🔮 AI Brain Analysis: <span id="cellInfo" style="color:#fff; font-size:14px"></span></h3>
    <div class="result-row">
        <div class="res-item"><span>Primary</span><b id="v1">--</b></div>
        <div class="res-item"><span>Strong</span><b id="v2">--</b></div>
        <div class="res-item"><span>Support</span><b id="v3">--</b></div>
    </div>
    <p id="debug" style="font-size: 10px; color: #666; margin-top: 10px;"></p>
</div>

<script>
// Family Data [cite: 2026-02-03]
const families = {"22":["22","27","72","77"],"11":["11","61","66","16"],"33":["33","83","88","38"],"99":["99","44","49","94"],"55":["50","00","05","55"],"12":["12","17","21","26","62","67","71","76"],"13":["13","18","31","36","63","68","81","86"],"14":["14","19","41","46","64","69","91","96"],"15":["01","06","10","15","51","56","60","65"],"23":["23","28","32","37","73","78","82","87"],"24":["24","29","42","47","74","79","92","97"],"25":["02","07","20","25","52","57","70","75"],"34":["34","39","43","48","84","89","93","98"],"35":["03","08","30","35","53","58","80","85"],"45":["04","09","40","45","54","59","90","95"]};

let data = JSON.parse(localStorage.getItem("ai_pred_v5")) || Array(15).fill(["**","**","**","**","**","**"]);

function getFam(v){ let s = String(v).padStart(2,'0'); for(let k in families) if(families[k].includes(s)) return k; return "NA"; }

function draw() {
    let h = "<tr><th>MON</th><th>TUE</th><th>WED</th><th>THU</th><th>FRI</th><th>SAT</th></tr>";
    data.forEach((row, ri) => {
        h += "<tr>";
        row.forEach((cell, ci) => {
            let cls = cell === "**" ? "blank" : "";
            h += `<td class="${cls}" contenteditable="true" onblur="updateValue(${ri},${ci},this.innerText)" onclick="predict(${ri},${ci})">${cell}</td>`;
        });
        h += "</tr>";
    });
    document.getElementById("tbl").innerHTML = h;
}

function updateValue(r,c,v){ data[r][c] = v.trim() || "**"; }
function addRow(){ data.push(["**","**","**","**","**","**"]); draw(); }
function saveData(){ localStorage.setItem("ai_pred_v5", JSON.stringify(data)); alert("Data Saved to Local Storage!"); }

function predict(r, c) {
    if(data[r][c] !== "**") return;

    // --- AI DYNAMIC ENGINE ---
    // 1. Scan the "Immediate Context" (Upar ke 10 rows ka trend) [cite: 2026-02-03]
    let trend = [];
    for(let i=1; i<=10; i++) {
        if(r-i >= 0 && data[r-i][c] !== "**") trend.push(data[r-i][c]);
    }

    // 2. Identify the "Strongest Family" in this column's history
    let famFreq = {};
    trend.forEach(val => {
        let f = getFam(val);
        famFreq[f] = (famFreq[f] || 0) + 1;
    });

    let topFam = Object.keys(famFreq).sort((a,b) => famFreq[b] - famFreq[a])[0] || "12";

    // 3. Mathematical Offset (Har cell ke liye unique calculation)
    // Row index (r) aur column index (c) ka use karke result badlega
    let pool = families[topFam] || ["00", "55", "05", "50"];
    let v1 = pool[(r + c) % pool.length];
    let v2 = pool[(r * c + 1) % pool.length];
    let v3 = pool[(r + 5) % pool.length];

    // Update UI
    document.getElementById("predictionView").style.display = "block";
    document.getElementById("cellInfo").innerText = `Row ${r+1}, Day ${c+1}`;
    document.getElementById("v1").innerText = v1;
    document.getElementById("v2").innerText = v2;
    document.getElementById("v3").innerText = v3;
    document.getElementById("debug").innerText = `Logic: Contextual Scan of ${trend.length} records. Frequency Match: Fam ${topFam}`;
    
    // Highlight active cell
    document.querySelectorAll('td').forEach(td => td.classList.remove('active-predict'));
    event.target.classList.add('active-predict');
}

function importCSV(input) {
    let reader = new FileReader();
    reader.onload = () => {
        data = reader.result.split('\n').filter(l => l.trim()).map(l => l.split(',').map(v => v.trim()));
        draw();
    };
    reader.readAsText(input.files[0]);
}

draw();
</script>
</body>
</html>
