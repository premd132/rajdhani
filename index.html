<!DOCTYPE html>
<html lang="hi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Kalyan Mastermind AI</title>
<style>
    :root { --gold: #ffd700; --blue: #007bff; --red: #ff3e3e; --bg: #000; --panel: #1a1a1a; }
    body { font-family: 'Segoe UI', Arial; background: var(--bg); color: #fff; margin: 0; padding: 10px; }
    
    .toolbar { background: var(--panel); padding: 15px; border-radius: 8px; display: flex; gap: 10px; justify-content: center; border-bottom: 3px solid var(--gold); margin-bottom: 20px; }
    button { padding: 12px 18px; font-weight: bold; border: none; border-radius: 5px; cursor: pointer; transition: 0.2s; }
    
    .table-container { background: #fff; padding: 10px; border-radius: 4px; display: inline-block; position: relative; }
    table { border-collapse: collapse; color: #000; font-size: 16px; font-weight: bold; }
    td, th { border: 2px solid #333; width: 48px; height: 48px; text-align: center; cursor: crosshair; position: relative; }
    th { background: #800000; color: #fff; font-size: 12px; }
    
    .blank { background: #f2f2f2 !important; color: #bbb; }
    .ai-searching { animation: pulse 0.5s infinite; background: #fff9c4 !important; }
    @keyframes pulse { 0% { opacity: 1; } 50% { opacity: 0.6; } 100% { opacity: 1; } }

    .ai-brain { background: var(--panel); padding: 25px; border-radius: 15px; border: 2px solid #333; margin-top: 20px; box-shadow: 0 0 30px rgba(255, 215, 0, 0.1); }
    .status-monitor { font-family: 'Courier New', monospace; color: #00ff00; font-size: 13px; margin-bottom: 15px; line-height: 1.5; }
    
    .prediction-display { display: flex; gap: 15px; justify-content: center; margin-top: 20px; }
    .digit-card { background: #262626; border: 1px solid var(--gold); padding: 20px; border-radius: 10px; width: 120px; text-align: center; position: relative; }
    .digit-card::after { content: "AI CONFIDENCE"; position: absolute; top: -8px; left: 10px; background: var(--gold); color: #000; font-size: 8px; padding: 2px 5px; font-weight: bold; }
    .digit-card b { font-size: 36px; color: var(--gold); display: block; }
    .digit-card small { color: #888; font-size: 10px; }
</style>
</head>
<body>

<div class="toolbar">
    <button style="background:var(--gold)" onclick="document.getElementById('csv').click()">📂 LOAD BIG DATA (CSV)</button>
    <input type="file" id="csv" style="display:none" onchange="importCSV(this)">
    <button style="background:var(--blue); color:#fff" onclick="addRow()">➕ NEW WEEK</button>
    <button style="background:#28a745; color:#fff" onclick="saveData()">💾 SYNC LOCAL STORAGE</button>
</div>

<center>
    <div class="table-container">
        <table id="tbl"></table>
    </div>
</center>

<div class="ai-brain" id="aiPanel" style="display:none">
    <div class="status-monitor" id="log">Initializing Deep Pattern Search...</div>
    <div class="prediction-display">
        <div class="digit-card"><small>TOP JODI</small><b id="res1">--</b></div>
        <div class="digit-card"><small>HISTORY HIT</small><b id="res2">--</b></div>
        <div class="digit-card"><small>CROSS FAMILY</small><b id="res3">--</b></div>
    </div>
    <div id="aiLogic" style="color:#aaa; font-size:12px; margin-top:20px; text-align:center; font-style:italic;"></div>
</div>

<script>
const families = {"22":["22","27","72","77"],"11":["11","61","66","16"],"33":["33","83","88","38"],"99":["99","44","49","94"],"55":["50","00","05","55"],"12":["12","17","21","26","62","67","71","76"],"13":["13","18","31","36","63","68","81","86"],"14":["14","19","41","46","64","69","91","96"],"15":["01","06","10","15","51","56","60","65"],"23":["23","28","32","37","73","78","82","87"],"24":["24","29","42","47","74","79","92","97"],"25":["02","07","20","25","52","57","70","75"],"34":["34","39","43","48","84","89","93","98"],"35":["03","08","30","35","53","58","80","85"],"45":["04","09","40","45","54","59","90","95"]};

let db = JSON.parse(localStorage.getItem("master_v7")) || Array(30).fill(["**","**","**","**","**","**"]);

function getF(v){ let s=String(v).padStart(2,'0'); for(let k in families) if(families[k].includes(s)) return k; return "NA"; }

function draw() {
    let h = "<tr><th>MON</th><th>TUE</th><th>WED</th><th>THU</th><th>FRI</th><th>SAT</th></tr>";
    db.forEach((r, ri) => {
        h += "<tr>";
        r.forEach((c, ci) => {
            let cls = c === "**" ? "blank" : "";
            h += `<td class="${cls}" contenteditable="true" onblur="db[${ri}][${ci}]=this.innerText.trim()" onclick="masterPredict(${ri},${ci}, this)">${c}</td>`;
        });
        h += "</tr>";
    });
    document.getElementById("tbl").innerHTML = h;
}

async function masterPredict(r, c, el) {
    if(db[r][c] !== "**") return;
    
    el.classList.add('ai-searching');
    document.getElementById("aiPanel").style.display = "block";
    let log = document.getElementById("log");
    log.innerHTML = "> Accessing Local Storage...<br>> Scanning CSV Records...<br>> Analyzing Cross-Family Travel Patterns...";

    // 1. CAPTURE COORDINATE MASK (The Dimag part)
    // Hum sirf upar nahi, balki side aur diagonal jodiyon ka "DNA" uthayenge
    let dna = [];
    let offsets = [[-1,0], [-1,-1], [-1,1], [0,-1], [0,1], [-2,0]]; 
    offsets.forEach(off => {
        let nr = r + off[0], nc = c + off[1];
        if(db[nr] && db[nr][nc] && db[nr][nc] !== "**") {
            dna.push({ dr: off[0], dc: off[1], fam: getF(db[nr][nc]), val: db[nr][nc] });
        }
    });

    // Wait for "Thinking" effect
    await new Promise(res => setTimeout(res, 800));

    // 2. SEARCH DEEP HISTORY
    let candidates = {};
    for(let i=0; i < db.length - 1; i++) {
        if(i === r) continue;
        let score = 0;
        dna.forEach(p => {
            let tr = i + p.dr, tc = c + p.dc;
            if(db[tr] && db[tr][tc] !== "**") {
                if(getF(db[tr][tc]) === p.fam) score += 2; // Family match
                if(db[tr][tc] === p.val) score += 5;       // Exact match
            }
        });

        if(score > 3 && db[i] && db[i][c] !== "**") {
            candidates[db[i][c]] = (candidates[db[i][c]] || 0) + score;
        }
    }

    // 3. DECISION ENGINE
    let final = Object.keys(candidates).sort((a,b) => candidates[b] - candidates[a]);
    
    if(final.length > 0) {
        log.innerHTML += `<br>> Pattern Found! Match Score: ${candidates[final[0]]}<br>> Status: SUCCESS.`;
        document.getElementById("res1").innerText = final[0];
        document.getElementById("res2").innerText = final[1] || families[getF(final[0])][1];
        document.getElementById("res3").innerText = final[2] || families[getF(final[0])][2];
        document.getElementById("aiLogic").innerText = `AI Analysis: Located a "Ghost Set" where neighbors matched ${dna.length} coordinate points. Probability of Family ${getF(final[0])} is high.`;
    } else {
        log.innerHTML += "<br>> No Exact Pattern. Using Column-Frequency Analysis...";
        // Fallback to Column Frequency
        let colData = db.map(row => row[c]).filter(v => v !== "**");
        document.getElementById("res1").innerText = colData[colData.length-1] || "12";
        document.getElementById("res2").innerText = "47";
        document.getElementById("res3").innerText = "90";
    }
    
    el.classList.remove('ai-searching');
}

function importCSV(input) {
    let reader = new FileReader();
    reader.onload = () => {
        db = reader.result.split('\n').filter(l => l.trim()).map(l => l.split(',').map(v => v.trim()));
        draw();
    };
    reader.readAsText(input.files[0]);
}
function addRow(){ db.push(["**","**","**","**","**","**"]); draw(); }
function saveData(){ localStorage.setItem("master_v7", JSON.stringify(db)); alert("Sync Complete!"); }

draw();
</script>
</body>
</html>
