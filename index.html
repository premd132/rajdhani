<!DOCTYPE html>
<html lang="hi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Rajdhani AI – Pro Pattern Scanner</title>
<style>
    :root { --gold: #ffd700; --blue: #007bff; --red: #dc3545; --green: #28a745; --bg: #000; }
    body { font-family: 'Arial', sans-serif; background: var(--bg); color: #fff; margin: 0; padding: 5px; }
    .table-container { position: relative; background: #fff; padding: 5px; border-radius: 2px; overflow-x: auto; }
    table { border-collapse: collapse; width: 100%; color: #000; font-size: 16px; table-layout: fixed; }
    td, th { border: 1px solid #000; height: 50px; text-align: center; font-weight: 700; position: relative; }
    th { background: #fdfd96; color: #000; font-size: 11px; }

    /* DPBoss Professional Marking */
    .f-circle::after {
        content: ""; position: absolute; top: 10%; left: 10%; width: 80%; height: 80%;
        border: 3.5px solid var(--blue); border-radius: 50%; box-sizing: border-box;
    }
    .base-box { 
        background: #ffff00 !important; border: 4.5px solid #000 !important; 
        color: #000; font-size: 18px; z-index: 6;
    }
    .cross-circle::after {
        content: ""; position: absolute; top: 10%; left: 10%; width: 80%; height: 80%;
        border: 3.5px solid var(--red); border-radius: 50%; box-sizing: border-box;
    }
    .prediction-cell { border: 4px solid var(--green) !important; background: #e8f5e9; color: #000; }
    .blank { background: #eee !important; color: #ccc; cursor: pointer; }

    canvas { position: absolute; top: 0; left: 0; pointer-events: none; z-index: 10; }
    .toolbar { display: flex; gap: 5px; margin-bottom: 10px; }
    button { flex: 1; padding: 12px; font-weight: bold; border: none; cursor: pointer; border-radius: 4px; font-size: 12px; }
    .card { background: #1a1a1a; padding: 12px; border-left: 5px solid var(--gold); margin-top: 10px; border-radius: 5px; }
    .check-btn { width: 100%; padding: 15px; background: #2a2a2a; color: var(--gold); border: 1px solid #444; margin-top: 8px; text-align: left; font-weight: bold; border-radius: 6px; cursor: pointer; }
</style>
</head>
<body>

<div class="toolbar">
    <input type="file" id="csvFile" accept=".csv" style="display:none" onchange="importCSV(this)">
    <button style="background:var(--gold)" onclick="document.getElementById('csvFile').click()">📂 LOAD CSV</button>
    <button style="background:var(--green); color:#fff" onclick="saveData()">💾 SAVE DATA</button>
</div>

<div class="table-container">
    <canvas id="mainCanvas"></canvas>
    <table id="tbl"></table>
</div>

<div class="card">
    <h3>📍 Check Lines (Shape & Family Cross)</h3>
    <div id="checkList">Click on (**) to start scan...</div>
</div>

<div id="futureCard" class="card" style="display:none">
    <h3>🔮 Future AI Prediction</h3>
    <div id="future" style="font-size: 26px; color: var(--gold); text-align: center; font-weight: bold;">-- | -- | --</div>
</div>

<script>
const families = {"22":["22","27","72","77"],"11":["11","61","66","16"],"33":["33","83","88","38"],"99":["99","44","49","94"],"55":["50","00","05","55"],"12":["12","17","21","26","62","67","71","76"],"13":["13","18","31","36","63","68","81","86"],"14":["14","19","41","46","64","69","91","96"],"15":["01","06","10","15","51","56","60","65"],"23":["23","28","32","37","73","78","82","87"],"24":["24","29","42","47","74","79","92","97"],"25":["02","07","20","25","52","57","70","75"],"34":["34","39","43","48","84","89","93","98"],"35":["03","08","30","35","53","58","80","85"],"45":["04","09","40","45","54","59","90","95"]};
let data = JSON.parse(localStorage.getItem("raj_final_pro")) || Array(25).fill(["**","**","**","**","**","**"]);
let activeMatch = null;
let lastClick = null;

function getFam(v){ let s = String(v).padStart(2,'0'); for(let k in families) if(families[k].includes(s)) return k; return "NA"; }

function draw() {
    let h = "<tr><th>MON</th><th>TUE</th><th>WED</th><th>THU</th><th>FRI</th><th>SAT</th></tr>";
    data.forEach((row, ri) => {
        h += `<tr id="tr-${ri}">`;
        row.forEach((cell, ci) => {
            let cls = cell === "**" ? "blank" : "";
            if(activeMatch) {
                const isCur = (lastClick && ri > lastClick.r - 11 && ri < lastClick.r);
                const isHist = (ri >= activeMatch.start && ri < activeMatch.start + 10);
                let relR = isCur ? ri - (lastClick.r - 10) : (isHist ? ri - activeMatch.start : -1);

                if (relR !== -1) {
                    if (relR === activeMatch.baseR && ci === activeMatch.baseC) cls += " base-box";
                    else if (activeMatch.points.some(p => p.r === relR && p.c === ci)) cls += " f-circle";
                    // Cross family marking within the 10 rows
                    if (isHist && activeMatch.crossPoints && activeMatch.crossPoints.some(p => p.r === ri && p.c === ci)) cls += " cross-circle";
                }
                if (ri === activeMatch.resR && ci === activeMatch.resC) cls += " prediction-cell";
                if (lastClick && ri === lastClick.r && ci === lastClick.c) cls += " prediction-cell";
            }
            h += `<td class="${cls}" onclick="process(${ri},${ci})" contenteditable="true" onblur="updateCell(${ri},${ci},this.innerText)">${cell}</td>`;
        });
        h += "</tr>";
    });
    document.getElementById("tbl").innerHTML = h;
    setTimeout(renderLines, 100);
}

function updateCell(r, c, v) { data[r][c] = v.trim() || "**"; }

function process(r, c) {
    if(data[r][c] !== "**") return;
    lastClick = {r, c}; activeMatch = null;
    
    // 1. Capture Current Shape & Base (Coordinates Only)
    let shapePoints = [];
    let baseR = 9, baseC = 0; // Fixed Base Spot (Bottom Left of pattern for example)
    let currentBaseFamily = getFam(data[r - (10 - baseR)][baseC]);

    for(let i=1; i<=10; i++) {
        data[r-i].forEach((v, ci) => {
            if(v !== "**" && shapePoints.length < 3) {
                if(!(10-i === baseR && ci === baseC)) shapePoints.push({r: 10-i, c: ci});
            }
        });
    }

    // 2. Scan History for same "Shape" & "Base Family"
    let matches = [];
    for(let i=0; i < data.length - 11; i++) {
        if(getFam(data[i + baseR][baseC]) !== currentBaseFamily) continue;

        let coordScore = 0;
        shapePoints.forEach(p => { if(data[i+p.r][p.c] !== "**") coordScore++; });

        if(coordScore >= 2 && data[i+10][c] !== "**") {
            // Find cross family marking for the result jodi within the 10 rows
            let resVal = data[i+10][c];
            let resFam = getFam(resVal);
            let crossPoints = [];
            for(let kr=0; kr<10; kr++) {
                data[i+kr].forEach((v, kc) => {
                    if(getFam(v) === resFam) crossPoints.push({r: i+kr, c: kc});
                });
            }

            matches.push({
                start: i, points: shapePoints, baseR, baseC,
                resR: i+10, resC: c, val: resVal, crossPoints
            });
        }
    }

    let list = document.getElementById("checkList");
    list.innerHTML = matches.length ? "" : "Koi match nahi mila.";
    matches.slice(0, 3).forEach((m, idx) => {
        let btn = document.createElement("button"); btn.className = "check-btn";
        btn.innerHTML = `🚩 Check Line #${idx+1} | Result: ${m.val}`;
        btn.onclick = () => { activeMatch = m; draw(); document.getElementById(`tr-${m.start}`).scrollIntoView({behavior:"smooth", block:"center"}); };
        list.appendChild(btn);
    });
    
    if(matches.length > 0) {
        document.getElementById("futureCard").style.display = "block";
        document.getElementById("future").innerText = matches.slice(0,3).map(m => m.val).join(" | ");
    }
    draw();
}

function renderLines() {
    const cvs = document.getElementById("mainCanvas");
    const ctx = cvs.getContext("2d");
    const tbl = document.getElementById("tbl");
    cvs.width = tbl.offsetWidth; cvs.height = tbl.offsetHeight;
    ctx.clearRect(0,0,cvs.width,cvs.height);
    const rect = tbl.getBoundingClientRect();

    const drawLine = (sel, col, width) => {
        let els = Array.from(tbl.querySelectorAll(sel));
        if(els.length < 2) return;
        ctx.strokeStyle = col; ctx.lineWidth = width; ctx.beginPath();
        els.forEach((el, i) => {
            let r = el.getBoundingClientRect();
            let x = r.left - rect.left + r.width/2;
            let y = r.top - rect.top + r.height/2;
            if(i===0) ctx.moveTo(x,y); else ctx.lineTo(x,y);
        });
        ctx.stroke();
    };
    drawLine(".f-circle, .base-box", "#007bff", 3); // Shape connection
    drawLine(".cross-circle, .prediction-cell", "#dc3545", 2); // Result Cross connection
}

function importCSV(input) {
    const reader = new FileReader();
    reader.onload = (e) => {
        data = e.target.result.split('\n').filter(r => r.trim()).map(r => {
            let cols = r.split(',').map(c => c.trim().padStart(2,'0').replace(/^00$/, "**"));
            while(cols.length < 6) cols.push("**");
            return cols.slice(0, 6);
        });
        saveData(); draw();
    };
    reader.readAsText(input.files[0]);
}
function saveData() { localStorage.setItem("raj_final_pro", JSON.stringify(data)); alert("Memory Saved!"); }
draw();
</script>
</body>
</html>
