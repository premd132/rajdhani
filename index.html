<!DOCTYPE html>
<html lang="hi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Kalyan AI Master - 01 Formatted</title>
<style>
    :root { --gold: #ffd700; --blue: #007bff; --red: #ff3e3e; --bg: #0a0a0a; --panel: #161616; }
    body { font-family: 'Segoe UI', Arial; background: var(--bg); color: #fff; margin: 0; padding: 10px; }
    
    .toolbar { background: var(--panel); padding: 12px; border-radius: 8px; display: flex; gap: 8px; justify-content: center; border-bottom: 2px solid var(--gold); margin-bottom: 15px; }
    button { padding: 10px 15px; font-weight: bold; border: none; border-radius: 4px; cursor: pointer; font-size: 12px; }
    
    .table-container { background: #fff; padding: 8px; border-radius: 4px; display: inline-block; position: relative; box-shadow: 0 0 20px rgba(0,0,0,0.5); }
    table { border-collapse: collapse; color: #000; font-size: 15px; }
    td, th { border: 1px solid #333; width: 45px; height: 45px; text-align: center; font-weight: bold; cursor: cell; position: relative; }
    th { background: #800000; color: #fff; font-size: 11px; }
    
    .blank { background: #f0f0f0 !important; color: #ccc; }
    .mark-pair { border: 3px solid var(--blue) !important; background: rgba(0,123,255,0.1); }
    
    /* AI Brain Layout */
    .ai-card { background: var(--panel); padding: 20px; border-radius: 12px; border: 1px solid #333; margin-top: 15px; }
    .prediction-grid { display: flex; gap: 10px; justify-content: center; margin-top: 15px; }
    .pred-box { background: #222; border: 1px solid var(--gold); padding: 15px; border-radius: 8px; width: 90px; text-align: center; }
    .pred-box b { font-size: 28px; color: var(--gold); display: block; }
    
    .check-line { margin-top: 15px; padding: 10px; background: #28a745; color: #fff; border-radius: 5px; cursor: pointer; text-align: center; font-size: 13px; font-weight: bold; }
    
    #popup { position: fixed; top: 50%; left: 50%; transform: translate(-50%, -50%); background: #fff; color: #000; padding: 20px; border-radius: 10px; z-index: 100; display: none; box-shadow: 0 0 50px rgba(0,0,0,0.8); }
    .overlay { position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.8); display: none; z-index: 90; }
</style>
</head>
<body>

<div class="toolbar">
    <button style="background:var(--gold)" onclick="document.getElementById('csv').click()">📂 LOAD CSV</button>
    <input type="file" id="csv" style="display:none" onchange="importCSV(this)">
    <button style="background:var(--blue); color:#fff" onclick="addRow()">➕ ROW</button>
    <button style="background:#28a745; color:#fff" onclick="saveData()">💾 SAVE</button>
</div>

<center>
    <div class="table-container">
        <table id="tbl"></table>
    </div>
</center>

<div class="ai-card" id="aiPanel" style="display:none">
    <h3 style="margin:0; color:var(--gold); font-size: 16px;">🤖 Deep Memory AI Prediction</h3>
    <div class="prediction-grid">
        <div class="pred-box"><small>BEST</small><b id="b1">--</b></div>
        <div class="pred-box"><small>SEC</small><b id="b2">--</b></div>
        <div class="pred-box"><small>FAM</small><b id="b3">--</b></div>
    </div>
    <div class="check-line" id="checkLineBtn">🔍 CLICK TO CHECK HISTORY PATTERN</div>
</div>

<div class="overlay" id="overlay" onclick="closePopup()"></div>
<div id="popup">
    <h3 style="margin-top:0">Historical Proof Found!</h3>
    <p id="proofText"></p>
    <button onclick="closePopup()" style="background:#800000; color:#fff; width:100%">CLOSE</button>
</div>

<script>
const families = {"22":["22","27","72","77"],"11":["11","61","66","16"],"33":["33","83","88","38"],"99":["99","44","49","94"],"55":["50","00","05","55"],"12":["12","17","21","26","62","67","71","76"],"13":["13","18","31","36","63","68","81","86"],"14":["14","19","41","46","64","69","91","96"],"15":["01","06","10","15","51","56","60","65"],"23":["23","28","32","37","73","78","82","87"],"24":["24","29","42","47","74","79","92","97"],"25":["02","07","20","25","52","57","70","75"],"34":["34","39","43","48","84","89","93","98"],"35":["03","08","30","35","53","58","80","85"],"45":["04","09","40","45","54","59","90","95"]};

let db = JSON.parse(localStorage.getItem("master_v8")) || Array(20).fill(["**","**","**","**","**","**"]);

// Auto format to 01, 02
function fmt(v){ 
    if(v === "**" || v === "") return "**";
    let s = v.replace(/[^0-9]/g, '');
    return s.length === 1 ? "0" + s : s.substring(0,2);
}

function getF(v){ let s=fmt(v); for(let k in families) if(families[k].includes(s)) return k; return "NA"; }

function draw() {
    let h = "<tr><th>MON</th><th>TUE</th><th>WED</th><th>THU</th><th>FRI</th><th>SAT</th></tr>";
    db.forEach((r, ri) => {
        h += "<tr>";
        r.forEach((c, ci) => {
            let cls = c === "**" ? "blank" : "";
            h += `<td class="${cls}" contenteditable="true" onblur="updateVal(${ri},${ci},this.innerText)" onclick="aiScan(${ri},${ci})">${c}</td>`;
        });
        h += "</tr>";
    });
    document.getElementById("tbl").innerHTML = h;
}

function updateVal(r,c,v){ db[r][c] = fmt(v); draw(); }

let lastMatchProof = "";

function aiScan(r, c) {
    if(db[r][c] !== "**") return;
    
    document.getElementById("aiPanel").style.display = "block";
    
    // Capture DNA of surrounding pairs (3-point scan) [cite: 2026-02-03]
    let neighbors = [];
    if(r > 0) neighbors.push({dr: -1, dc: 0, val: db[r-1][c]}); // Upar wala
    if(c > 0) neighbors.push({dr: 0, dc: -1, val: db[r][c-1]}); // Side wala
    
    let scores = {};
    let proofFound = "No exact history match. Analysis based on column frequency.";

    // DEEP HISTORY SEARCH [cite: 2026-02-03]
    for(let i=0; i < db.length - 1; i++) {
        if(i === r) continue;
        let matchCount = 0;
        neighbors.forEach(n => {
            if(db[i+n.dr] && db[i+n.dr][c+n.dc] === n.val && n.val !== "**") matchCount++;
        });

        if(matchCount > 0 && db[i][c] !== "**") {
            let v = db[i][c];
            scores[v] = (scores[v] || 0) + matchCount;
            proofFound = `Found similar pattern at Week ${i+1}. In that record, when neighbors were same, the result was ${v}.`;
        }
    }

    let results = Object.keys(scores).sort((a,b) => scores[b] - scores[a]);
    let final1 = results[0] || "08"; // Fallback
    let final2 = results[1] || families[getF(final1)][1];
    let final3 = results[2] || families[getF(final1)][2];

    document.getElementById("b1").innerText = fmt(final1);
    document.getElementById("b2").innerText = fmt(final2);
    document.getElementById("b3").innerText = fmt(final3);
    lastMatchProof = proofFound;

    document.getElementById("checkLineBtn").onclick = () => {
        document.getElementById("proofText").innerText = lastMatchProof;
        document.getElementById("popup").style.display = "block";
        document.getElementById("overlay").style.display = "block";
    };
}

function closePopup(){ document.getElementById("popup").style.display="none"; document.getElementById("overlay").style.display="none"; }
function addRow(){ db.push(["**","**","**","**","**","**"]); draw(); }
function saveData(){ localStorage.setItem("master_v8", JSON.stringify(db)); alert("Saved!"); }

function importCSV(input) {
    let reader = new FileReader();
    reader.onload = () => {
        db = reader.result.split('\n').filter(l => l.trim()).map(l => l.split(',').map(v => fmt(v.trim())));
        draw();
    };
    reader.readAsText(input.files[0]);
}

draw();
</script>
</body>
</html>
