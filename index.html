<!DOCTYPE html>
<html lang="hi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Rajdhani AI – Full Vision Fix</title>
<style>
    :root { --gold: #ffd700; --blue: #3e84ff; --red: #ff3e3e; --green: #00ff00; --bg: #0a0a0a; }
    body { font-family: 'Segoe UI', Arial; background: var(--bg); color: #fff; margin: 0; padding: 10px; }
    .toolbar { background: #1a1a1a; padding: 15px; border-radius: 10px; display: flex; gap: 10px; justify-content: center; border-bottom: 2px solid var(--gold); margin-bottom: 15px; flex-wrap: wrap; }
    .table-container { position: relative; display: inline-block; background: #fff; border-radius: 5px; padding: 10px; }
    table { border-collapse: collapse; font-size: 13px; color: #000; position: relative; z-index: 10; }
    td, th { border: 1px solid #999; width: 45px; height: 42px; text-align: center; font-weight: bold; }
    th { background: #800; color: #fff; }
    
    /* Patterns & Highlights */
    .f1 { border: 3px solid var(--blue) !important; border-radius: 50%; background: rgba(62, 132, 255, 0.2); }
    .f2 { border: 3px solid var(--red) !important; border-radius: 50%; background: rgba(255, 62, 62, 0.2); }
    .f-res { border: 3px solid var(--green) !important; background: rgba(0, 255, 0, 0.2); }
    .blank { background: #eee !important; cursor: pointer; border: 1px dashed #777 !important; color: #999; }

    canvas { position: absolute; top: 0; left: 0; pointer-events: none; z-index: 20; }
    .dashboard { display: grid; grid-template-columns: 1fr 1fr; gap: 15px; margin-top: 20px; }
    .card { background: #1a1a1a; padding: 15px; border-radius: 8px; border-left: 5px solid var(--gold); }
    button { padding: 10px 15px; cursor: pointer; font-weight: bold; border-radius: 5px; border: none; }
    .btn-csv { background: var(--gold); color: #000; }
    .btn-add { background: var(--blue); color: #fff; }
    .btn-save { background: var(--green); color: #000; }
    .check-btn { display: block; width: 100%; margin-top: 8px; padding: 12px; background: #222; color: var(--gold); border: 1px solid #444; border-radius: 5px; text-align: left; }
    
    /* Popup */
    #popup { display: none; position: fixed; top: 50%; left: 50%; transform: translate(-50%, -50%); background: #fff; color: #000; padding: 20px; border: 5px solid var(--gold); z-index: 1000; border-radius: 10px; width: 90%; max-width: 450px; box-shadow: 0 0 100px #000; }
    .overlay { display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.85); z-index: 999; }
</style>
</head>
<body>

<div class="toolbar">
    <input type="file" id="csvFile" accept=".csv" style="display:none" onchange="importCSV(this)">
    <button class="btn-csv" onclick="document.getElementById('csvFile').click()">📂 Upload CSV</button>
    <button class="btn-add" onclick="addRow()">➕ Add Row</button>
    <button class="btn-save" onclick="saveToLocal()">💾 Save Memory</button>
    <button onclick="localStorage.clear(); location.reload();" style="background:red; color:white;">🗑️ Reset</button>
</div>

<center>
    <div class="table-container">
        <canvas id="mainCanvas"></canvas>
        <table id="tbl"></table>
    </div>
</center>

<div class="dashboard">
    <div class="card">
        <h3>📍 Check Lines (80% Similarity)</h3>
        <div id="checkList">Click any blank cell (**) to scan...</div>
    </div>
    <div class="card">
        <h3>🔮 Future AI (3 Pair)</h3>
        <div id="future" style="font-size: 26px; color: var(--gold); font-weight: bold; text-align: center;">-- | -- | --</div>
    </div>
</div>

<div class="overlay" id="overlay" onclick="closePopup()"></div>
<div id="popup">
    <h3 style="text-align:center; color:#800;">Real Record Pattern</h3>
    <div id="popContent"></div>
    <center><button onclick="closePopup()" style="margin-top:15px; padding:10px 20px; background:red; color:white; border:none; cursor:pointer;">CLOSE</button></center>
</div>

<script>
const families = {"22":["22","27","72","77"],"11":["11","61","66","16"],"33":["33","83","88","38"],"99":["99","44","49","94"],"55":["50","00","05","55"],"12":["12","17","21","26","62","67","71","76"],"13":["13","18","31","36","63","68","81","86"],"14":["14","19","41","46","64","69","91","96"],"15":["01","06","10","15","51","56","60","65"],"23":["23","28","32","37","73","78","82","87"],"24":["24","29","42","47","74","79","92","97"],"25":["02","07","20","25","52","57","70","75"],"34":["34","39","43","48","84","89","93","98"],"35":["03","08","30","35","53","58","80","85"],"45":["04","09","40","45","54","59","90","95"]};
let data = JSON.parse(localStorage.getItem("raj_vision_final")) || [["**","**","**","**","**"]];
let activePattern = null;

function fam(v){ let s = String(v).padStart(2,'0'); for(let k in families) if(families[k].includes(s)) return k; return "NA"; }

function draw() {
    let h = "<tr><th>MON</th><th>TUE</th><th>WED</th><th>THU</th><th>FRI</th></tr>";
    data.forEach((row, ri) => {
        h += "<tr>";
        row.forEach((cell, ci) => {
            let cls = cell === "**" ? "blank" : "";
            if(activePattern && ri >= activePattern.start && ri < activePattern.start + activePattern.shape.length) {
                let p = activePattern.shape[ri - activePattern.start][ci];
                if(p === 1) cls += " f1"; if(p === 2) cls += " f2";
            }
            if(activePattern && ri === activePattern.resR && ci === activePattern.resC) cls += " f-res";
            h += `<td class="${cls}" contenteditable="true" onblur="updateCell(${ri},${ci},this.innerText)" onclick="techScan(${ri},${ci})">${cell}</td>`;
        });
        h += "</tr>";
    });
    document.getElementById("tbl").innerHTML = h;
    setTimeout(renderLines, 100);
}

function updateCell(r, c, v) { data[r][c] = v.trim() || "**"; }

function importCSV(input) {
    const reader = new FileReader();
    reader.onload = (e) => {
        const rows = e.target.result.split('\n').filter(r => r.trim());
        data = rows.map(r => {
            let cols = r.split(',').map(c => c.trim().padStart(2,'0').replace(/^00$/, "**"));
            while(cols.length < 5) cols.push("**");
            return cols.slice(0, 5);
        });
        saveToLocal(); draw();
    };
    reader.readAsText(input.files[0]);
}

function techScan(r, c) {
    if(data[r][c] !== "**") return;
    activePattern = null;
    let pool = [];
    // 10 weeks depth as per memory
    for(let i=r-1; i>=Math.max(0, r-10); i--) {
        data[i].forEach((v, ci) => { if(v!=="**") pool.push({ri:i, ci:ci, f:fam(v)}); });
    }
    if(pool.length < 4) return alert("Piche ka data kam hai! Kam se kam 10 rows bhariye.");

    // Pattern creation from blank row
    let selected = [...new Set(pool.map(p => p.f))].sort(() => 0.5 - Math.random()).slice(0, 2);
    let p1 = pool.filter(x => x.f === selected[0]).slice(0, 2);
    let p2 = pool.filter(x => x.f === selected[1]).slice(0, 2);
    if(p1.length < 2 || p2.length < 2) return;

    let top = Math.min(p1[0].ri, p1[1].ri, p2[0].ri, p2[1].ri);
    let shape = Array.from({length: r - top}, () => Array(5).fill(0));
    p1.forEach(p => shape[p.ri-top][p.ci] = 1);
    p2.forEach(p => shape[p.ri-top][p.ci] = 2);

    let matches = [];
    for(let i=0; i <= data.length - shape.length - 1; i++) {
        if(i === top) continue;
        let score = 0, total = 0;
        for(let k=0; k<shape.length; k++) {
            for(let j=0; j<5; j++) {
                if(shape[k][j] > 0) {
                    total++;
                    if(fam(data[i+k][j]) === (shape[k][j] === 1 ? selected[0] : selected[1])) score++;
                }
            }
        }
        // 80% Similarity Logic
        if((score/total) >= 0.75 && data[i+shape.length][c] !== "**") {
            matches.push({start: i, shape: shape, resR: i+shape.length, resC: c, val: data[i+shape.length][c], per: Math.round((score/total)*100)});
        }
    }

    let list = document.getElementById("checkList");
    list.innerHTML = matches.length ? "" : "Koi 80% match nahi mila. Dubara click karein.";
    matches.slice(0, 3).forEach((m, idx) => {
        let btn = document.createElement("button");
        btn.className = "check-btn";
        btn.innerHTML = `🏁 Check Line #${idx+1} (${m.per}% Match) | Row: ${m.start+1} | Result: ${m.val}`;
        btn.onclick = () => { activePattern = m; draw(); showPopup(m); };
        list.appendChild(btn);
    });
    document.getElementById("future").innerText = matches.slice(0, 3).map(m => m.val).join(" | ") || "-- | -- | --";
    draw();
}

function showPopup(m) {
    let html = "<table border='1' style='width:100%; border-collapse:collapse; background:white; color:black;'>";
    for(let i=0; i <= m.shape.length; i++) {
        html += "<tr>";
        data[m.start + i].forEach((cell, ci) => {
            let s = "padding:8px; text-align:center; font-weight:bold;";
            if(i < m.shape.length && m.shape[i][ci] > 0) s += `background:${m.shape[i][ci]===1?'rgba(62,132,255,0.3)':'rgba(255,62,62,0.3)'}; border-radius:50%;`;
            if(m.start + i === m.resR && ci === m.resC) s += "background:rgba(0,255,0,0.4); border:2px solid green;";
            html += `<td style='${s}'>${cell}</td>`;
        });
        html += "</tr>";
    }
    document.getElementById("popContent").innerHTML = html + "</table>";
    document.getElementById("popup").style.display = "block";
    document.getElementById("overlay").style.display = "block";
}

function renderLines() {
    const cvs = document.getElementById("mainCanvas");
    const ctx = cvs.getContext("2d");
    const tbl = document.getElementById("tbl");
    cvs.width = tbl.offsetWidth; cvs.height = tbl.offsetHeight;
    ctx.clearRect(0,0,cvs.width,cvs.height);
    const rect = tbl.getBoundingClientRect();
    ["f1", "f2", "f-res"].forEach((cls, idx) => {
        let els = Array.from(tbl.querySelectorAll("." + cls.split(' ')[0]));
        if(els.length >= 1) {
            ctx.strokeStyle = idx === 0 ? "#3e84ff" : (idx === 1 ? "#ff3e3e" : "#00aa00");
            ctx.lineWidth = 3; ctx.beginPath();
            els.forEach((el, i) => {
                let r = el.getBoundingClientRect();
                let x = r.left - rect.left + r.width/2;
                let y = r.top - rect.top + r.height/2;
                if(i===0) ctx.moveTo(x,y); else ctx.lineTo(x,y);
            });
            ctx.stroke();
        }
    });
}

function closePopup() { document.getElementById("popup").style.display = "none"; document.getElementById("overlay").style.display = "none"; }
function addRow() { data.push(["**","**","**","**","**"]); draw(); }
function saveToLocal() { localStorage.setItem("raj_vision_final", JSON.stringify(data)); alert("Memory Saved!"); }
draw();
</script>
</body>
</html>
