<!DOCTYPE html>
<html lang="hi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Rajdhani AI – 3 Match Fix</title>
<style>
    :root { --gold: #ffd700; --blue: #3e84ff; --red: #ff3e3e; --bg: #0d0d0d; --panel: #1a1a1a; }
    body { font-family: 'Segoe UI', Arial; background: var(--bg); color: #fff; margin: 0; padding: 10px; }
    .toolbar { background: var(--panel); padding: 12px; border-radius: 10px; display: flex; gap: 8px; justify-content: center; border-bottom: 2px solid var(--gold); }
    .table-container { position: relative; display: inline-block; background: #fff; border-radius: 5px; padding: 8px; margin-top: 15px; }
    table { border-collapse: collapse; font-size: 13px; color: #000; position: relative; z-index: 10; }
    td, th { border: 1px solid #bbb; width: 42px; height: 38px; text-align: center; font-weight: bold; }
    th { background: #800000; color: white; }
    
    .f1 { border: 3px solid var(--blue) !important; border-radius: 50%; background: rgba(62, 132, 255, 0.2); }
    .f2 { border: 3px solid var(--red) !important; border-radius: 50%; background: rgba(255, 62, 62, 0.2); }
    .f-res { border: 3px solid #2ecc71 !important; background: rgba(46, 204, 113, 0.3); } /* Result Marking */
    .blank { background: #eee !important; cursor: pointer; border: 1px dashed #777 !important; }

    canvas { position: absolute; top: 0; left: 0; pointer-events: none; z-index: 20; }
    .dashboard { display: grid; grid-template-columns: 1fr 1fr; gap: 15px; margin-top: 20px; }
    .card { background: var(--panel); padding: 15px; border-radius: 8px; border-left: 5px solid var(--gold); }
    .check-btn { display: block; width: 100%; margin-bottom: 5px; padding: 10px; background: #222; color: var(--gold); border: 1px solid #444; cursor: pointer; text-align: left; border-radius: 4px; }
    .pred-box { font-size: 24px; color: var(--gold); font-weight: bold; text-align: center; }
</style>
</head>
<body>

<div class="toolbar">
    <input type="file" id="csvFile" style="display:none" onchange="loadCSV(this)">
    <button onclick="document.getElementById('csvFile').click()">📂 Load CSV</button>
    <button onclick="addRow()">➕ Add Row</button>
    <button onclick="saveData()">💾 Save</button>
</div>

<center>
    <div class="table-container">
        <canvas id="mainCanvas"></canvas>
        <table id="tbl"></table>
    </div>
</center>

<div class="dashboard">
    <div class="card">
        <h3>✅ 3 Check Lines</h3>
        <div id="checkList">Click blank cell...</div>
    </div>
    <div class="card">
        <h3>🔮 Future AI (3 Pairs)</h3>
        <div id="future" class="pred-box">-- -- --</div>
    </div>
</div>

<script>
const families = {"22":["22","27","72","77"],"11":["11","61","66","16"],"33":["33","83","88","38"],"99":["99","44","49","94"],"55":["50","00","05","55"],"12":["12","17","21","26","62","67","71","76"],"13":["13","18","31","36","63","68","81","86"],"14":["14","19","41","46","64","69","91","96"],"15":["01","06","10","15","51","56","60","65"],"23":["23","28","32","37","73","78","82","87"],"24":["24","29","42","47","74","79","92","97"],"25":["02","07","20","25","52","57","70","75"],"34":["34","39","43","48","84","89","93","98"],"35":["03","08","30","35","53","58","80","85"],"45":["04","09","40","45","54","59","90","95"]};
let data = JSON.parse(localStorage.getItem("raj_v12")) || [["**","**","**","**","**"]];
let activePattern = null;

function fam(v){ for(let k in families) if(families[k].includes(String(v).padStart(2,'0'))) return k; return "NA"; }

function draw() {
    let h = "<tr><th>MON</th><th>TUE</th><th>WED</th><th>THU</th><th>FRI</th></tr>";
    data.forEach((row, ri) => {
        h += "<tr>";
        row.forEach((cell, ci) => {
            let p = (activePattern && ri >= activePattern.start && ri < activePattern.start + activePattern.shape.length) ? activePattern.shape[ri - activePattern.start][ci] : 0;
            let cls = p === 1 ? "f1" : (p === 2 ? "f2" : "");
            if(activePattern && ri === activePattern.resR && ci === activePattern.resC) cls = "f-res";
            if(cell === "**") cls += " blank";
            h += `<td class="${cls}" onclick="scanPatterns(${ri},${ci})">${cell}</td>`;
        });
        h += "</tr>";
    });
    document.getElementById("tbl").innerHTML = h;
    setTimeout(renderLines, 100);
}

function scanPatterns(r, c) {
    if(data[r][c] !== "**") return;
    let pool = {};
    for(let i = r-1; i >= Math.max(0, r-10); i--) {
        data[i].forEach((v, ci) => {
            if(v !== "**") {
                let f = fam(v);
                if(!pool[f]) pool[f] = [];
                if(pool[f].length < 2) pool[f].push({ri: i, ci: ci});
            }
        });
    }
    let valid = Object.keys(pool).filter(k => pool[k].length === 2);
    if(valid.length < 2) return alert("No 10-week pattern found.");

    let selected = valid.slice(0, 2);
    let top = Math.min(...pool[selected[0]].concat(pool[selected[1]]).map(p => p.ri));
    let shape = Array.from({length: r - top}, () => Array(5).fill(0));
    selected.forEach((f, idx) => pool[f].forEach(p => shape[p.ri - top][p.ci] = idx + 1));

    let matches = [];
    for(let i=0; i <= data.length - shape.length - 1; i++) {
        let ok = true;
        for(let k=0; k<shape.length; k++) {
            for(let j=0; j<5; j++) {
                if(shape[k][j] === 1 && fam(data[i+k][j]) !== selected[0]) ok = false;
                if(shape[k][j] === 2 && fam(data[i+k][j]) !== selected[1]) ok = false;
            }
        }
        if(ok) matches.push(i);
    }

    let list = document.getElementById("checkList");
    list.innerHTML = "";
    let preds = [];
    matches.slice(0, 3).forEach((mIdx, i) => {
        let resVal = data[mIdx + shape.length][c];
        preds.push(resVal);
        let btn = document.createElement("button");
        btn.className = "check-btn";
        btn.innerHTML = `📍 Check Line #${i+1} (Row ${mIdx+1}) | Result: ${resVal}`;
        btn.onclick = () => { activePattern = {start: mIdx, shape: shape, resR: mIdx+shape.length, resC: c}; draw(); };
        list.appendChild(btn);
    });
    document.getElementById("future").innerText = preds.join(" | ") || "-- -- --";
}

function renderLines() {
    const cvs = document.getElementById("mainCanvas");
    const ctx = cvs.getContext("2d");
    const tbl = document.getElementById("tbl");
    cvs.width = tbl.offsetWidth; cvs.height = tbl.offsetHeight;
    ctx.clearRect(0,0,cvs.width,cvs.height);
    const rect = tbl.getBoundingClientRect();
    [".f1", ".f2"].forEach((cls, idx) => {
        let els = Array.from(tbl.querySelectorAll(cls));
        if(els.length >= 2) {
            ctx.strokeStyle = idx === 0 ? "#3e84ff" : "#ff3e3e";
            ctx.lineWidth = 3; ctx.beginPath();
            els.forEach((el, i) => {
                let r = el.getBoundingClientRect();
                let x = r.left - rect.left + r.width/2;
                let y = r.top - rect.top + r.height/2;
                if(i===0) ctx.moveTo(x,y); else ctx.lineTo(x,y);
            });
            ctx.stroke();
        }
    });
}

function addRow(){ data.push(["**","**","**","**","**"]); draw(); }
function saveData(){ localStorage.setItem("raj_v12", JSON.stringify(data)); alert("Saved!"); }
function loadCSV(input){
    let reader = new FileReader();
    reader.onload = () => {
        data = reader.result.split('\n').filter(l=>l.trim()).map(l => l.split(',').map(v=>v.trim().padStart(2,'0')));
        draw();
    };
    reader.readAsText(input.files[0]);
}
draw();
</script>
</body>
</html>
