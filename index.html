<!DOCTYPE html>
<html lang="hi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Rajdhani AI – Triple Line Fix</title>
<style>
    :root { --gold: #ffd700; --blue: #3e84ff; --red: #ff3e3e; --bg: #0a0a0a; --panel: #1a1a1a; }
    body { font-family: 'Segoe UI', Arial; background: var(--bg); color: #fff; margin: 0; padding: 10px; }
    .toolbar { background: var(--panel); padding: 15px; border-radius: 10px; display: flex; gap: 10px; justify-content: center; border-bottom: 2px solid var(--gold); }
    .table-container { position: relative; display: inline-block; background: #fff; border-radius: 8px; padding: 10px; margin-top: 20px; }
    table { border-collapse: collapse; font-size: 14px; color: #000; position: relative; z-index: 10; }
    td, th { border: 1px solid #ccc; width: 45px; height: 42px; text-align: center; font-weight: bold; }
    th { background: #800000; color: white; }
    
    /* Patterns */
    .f1 { border: 3px solid var(--blue) !important; border-radius: 50%; background: rgba(62, 132, 255, 0.2); transition: 0.3s; }
    .f2 { border: 3px solid var(--red) !important; border-radius: 50%; background: rgba(255, 62, 62, 0.2); transition: 0.3s; }
    .blank { background: #f0f0f0 !important; cursor: pointer; border: 2px dashed #999 !important; }

    canvas { position: absolute; top: 0; left: 0; pointer-events: none; z-index: 20; }
    .dashboard { display: grid; grid-template-columns: 1fr 1fr; gap: 15px; margin-top: 20px; }
    .card { background: var(--panel); padding: 15px; border-radius: 10px; border-left: 5px solid var(--gold); }
    .check-btn { display: block; width: 100%; margin-bottom: 8px; padding: 12px; background: #222; color: var(--gold); border: 1px solid #444; text-align: left; cursor: pointer; border-radius: 5px; }
    .check-btn:hover { background: #333; border-color: var(--gold); }
    .pred-num { font-size: 28px; color: var(--gold); font-weight: bold; text-align: center; }
</style>
</head>
<body>

<div class="toolbar">
    <input type="file" id="csvFile" style="display:none" onchange="loadCSV(this)">
    <button onclick="document.getElementById('csvFile').click()">📂 Upload History</button>
    <button onclick="addRow()">➕ Add Row</button>
    <button onclick="saveData()" style="background:#28a745; color:white;">💾 Save Memory</button>
</div>

<center>
    <div class="table-container">
        <canvas id="mainCanvas"></canvas>
        <table id="tbl"></table>
    </div>
</center>

<div class="dashboard">
    <div class="card">
        <h3>🔗 3 Check Lines (History)</h3>
        <div id="checks">Click a blank cell to generate...</div>
    </div>
    <div class="card">
        <h3>🔮 Future AI (3 Jodi)</h3>
        <div id="future" class="pred-num">-- | -- | --</div>
    </div>
</div>

<script>
const families = {"22":["22","27","72","77"],"11":["11","61","66","16"],"33":["33","83","88","38"],"99":["99","44","49","94"],"55":["50","00","05","55"],"12":["12","17","21","26","62","67","71","76"],"13":["13","18","31","36","63","68","81","86"],"14":["14","19","41","46","64","69","91","96"],"15":["01","06","10","15","51","56","60","65"],"23":["23","28","32","37","73","78","82","87"],"24":["24","29","42","47","74","79","92","97"],"25":["02","07","20","25","52","57","70","75"],"34":["34","39","43","48","84","89","93","98"],"35":["03","08","30","35","53","58","80","85"],"45":["04","09","40","45","54","59","90","95"]};
let data = JSON.parse(localStorage.getItem("raj_ultra_v10")) || [["**","**","**","**","**"]];
let activePattern = null;

function fam(v){ for(let k in families) if(families[k].includes(String(v).padStart(2,'0'))) return k; return "NA"; }

function draw() {
    let html = "<tr><th>MON</th><th>TUE</th><th>WED</th><th>THU</th><th>FRI</th></tr>";
    data.forEach((row, ri) => {
        html += "<tr>";
        row.forEach((cell, ci) => {
            let p = getPatternType(ri, ci);
            let cls = p === 1 ? "f1" : (p === 2 ? "f2" : "");
            if(cell === "**") cls += " blank";
            html += `<td class="${cls}" onclick="runTripleScan(${ri},${ci})">${cell}</td>`;
        });
        html += "</tr>";
    });
    document.getElementById("tbl").innerHTML = html;
    setTimeout(renderLines, 100);
}

function runTripleScan(r, c) {
    if(data[r][c] !== "**") return;
    activePattern = null;
    let pool = {};
    
    // 10-WEEK DEPTH SCAN
    for(let i = r-1; i >= Math.max(0, r-10); i--) {
        data[i].forEach((v, ci) => {
            if(v !== "**") {
                let f = fam(v);
                if(!pool[f]) pool[f] = [];
                if(pool[f].length < 2) pool[f].push({ri: i, ci: ci});
            }
        });
    }

    let valid = Object.keys(pool).filter(k => pool[k].length === 2);
    if(valid.length < 2) return alert("10 Weeks data me 2+2 pattern nahi mila!");

    // Har click par different patterns pick karega
    let selected = valid.sort(() => 0.5 - Math.random()).slice(0, 2);
    let topRi = Math.min(...pool[selected[0]].concat(pool[selected[1]]).map(p => p.ri));
    let shape = Array.from({length: r - topRi}, () => Array(5).fill(0));

    selected.forEach((f, idx) => {
        pool[f].forEach(p => { shape[p.ri - topRi][p.ci] = idx + 1; });
    });

    // SEARCH FOR 3 MATCHES
    let matches = [];
    for(let i=0; i <= data.length - shape.length - 1; i++) {
        let ok = true;
        for(let k=0; k<shape.length; k++) {
            for(let j=0; j<5; j++) {
                if(shape[k][j] === 1 && fam(data[i+k][j]) !== selected[0]) ok = false;
                if(shape[k][j] === 2 && fam(data[i+k][j]) !== selected[1]) ok = false;
            }
        }
        if(ok) matches.push(i);
    }

    displayTripleChecks(shape, matches, c);
}

function displayTripleChecks(shape, matches, targetCol) {
    let div = document.getElementById("checks");
    div.innerHTML = "";
    let pred = [];

    // Show up to 3 Check Lines
    matches.slice(0, 3).forEach((mIdx, i) => {
        let result = data[mIdx + shape.length][targetCol];
        if(result !== "**") pred.push(result);

        let btn = document.createElement("button");
        btn.className = "check-btn";
        btn.innerHTML = `🏁 <b>Check Line #${i+1}</b><br><small>Historical Row: ${mIdx+1} | Result: ${result}</small>`;
        btn.onclick = () => {
            activePattern = {start: mIdx, shape: shape};
            draw();
            window.scrollTo({top: 100, behavior: 'smooth'});
        };
        div.appendChild(btn);
    });

    if(matches.length === 0) div.innerHTML = "No historical matches found.";
    document.getElementById("future").innerText = pred.length ? pred.join(" | ") : "-- | -- | --";
}

function getPatternType(ri, ci) {
    if(!activePattern) return null;
    let i = ri - activePattern.start;
    return (i >= 0 && i < activePattern.shape.length) ? activePattern.shape[i][ci] : null;
}

function renderLines() {
    const cvs = document.getElementById("mainCanvas");
    const ctx = cvs.getContext("2d");
    const tbl = document.getElementById("tbl");
    cvs.width = tbl.offsetWidth; cvs.height = tbl.offsetHeight;
    ctx.clearRect(0,0,cvs.width,cvs.height);
    const rect = tbl.getBoundingClientRect();

    ["f1", "f2"].forEach((cls, idx) => {
        let els = Array.from(tbl.querySelectorAll("." + cls));
        if(els.length >= 2) {
            ctx.strokeStyle = idx === 0 ? "#3e84ff" : "#ff3e3e";
            ctx.lineWidth = 4; ctx.setLineDash([5, 5]); ctx.beginPath();
            els.forEach((el, i) => {
                let r = el.getBoundingClientRect();
                let x = r.left - rect.left + r.width/2;
                let y = r.top - rect.top + r.height/2;
                if(i===0) ctx.moveTo(x,y); else ctx.lineTo(x,y);
            });
            ctx.stroke();
        }
    });
}

function addRow(){ data.push(["**","**","**","**","**"]); draw(); }
function saveData(){ localStorage.setItem("raj_ultra_v10", JSON.stringify(data)); alert("Memory Saved!"); }
function loadCSV(input){
    let reader = new FileReader();
    reader.onload = () => {
        data = reader.result.split('\n').filter(l=>l.trim()).map(l => l.split(',').map(v=>v.trim().padStart(2,'0')));
        draw();
    };
    reader.readAsText(input.files[0]);
}

draw();
</script>
</body>
</html>
