<!DOCTYPE html>
<html lang="hi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Rajdhani AI – Triple Check Fix</title>
<style>
    :root { --gold: #ffd700; --blue: #3e84ff; --red: #ff3e3e; --green: #2ecc71; --bg: #0a0a0a; --panel: #1a1a1a; }
    body { font-family: 'Segoe UI', Arial; background: var(--bg); color: #fff; margin: 0; padding: 10px; }
    .toolbar { background: var(--panel); padding: 15px; border-radius: 10px; display: flex; gap: 10px; justify-content: center; border-bottom: 2px solid var(--gold); }
    .table-container { position: relative; display: inline-block; background: #fff; border-radius: 8px; padding: 10px; margin-top: 20px; }
    table { border-collapse: collapse; font-size: 14px; color: #000; position: relative; z-index: 10; }
    td, th { border: 1px solid #ccc; width: 45px; height: 42px; text-align: center; font-weight: bold; }
    th { background: #800000; color: white; }
    
    /* Circle Markings */
    .f1 { border: 3px solid var(--blue) !important; border-radius: 50%; background: rgba(62, 132, 255, 0.2); }
    .f2 { border: 3px solid var(--red) !important; border-radius: 50%; background: rgba(255, 62, 62, 0.2); }
    .f3 { border: 3px solid var(--green) !important; border-radius: 50%; background: rgba(46, 204, 113, 0.2); }
    .blank { background: #f0f0f0 !important; cursor: pointer; border: 2px dashed #999 !important; }

    canvas { position: absolute; top: 0; left: 0; pointer-events: none; z-index: 20; }
    .card { background: var(--panel); padding: 15px; border-radius: 10px; border-left: 5px solid var(--gold); margin-top: 20px; }
    .pred-box { font-size: 24px; color: var(--gold); font-weight: bold; text-align: center; letter-spacing: 3px; }
</style>
</head>
<body>

<div class="toolbar">
    <input type="file" id="csvFile" style="display:none" onchange="loadCSV(this)">
    <button onclick="document.getElementById('csvFile').click()">📂 Upload Data</button>
    <button onclick="addRow()">➕ Add Row</button>
    <button onclick="saveData()">💾 Save</button>
</div>

<center>
    <div class="table-container">
        <canvas id="mainCanvas"></canvas>
        <table id="tbl"></table>
    </div>
</center>

<div class="card">
    <h3>🔮 Future AI (3 Best Predictions)</h3>
    <div id="future" class="pred-box">-- | -- | --</div>
    <p id="status" style="text-align:center; color:#aaa;">Click a blank cell to see 3 check lines</p>
</div>

<script>
const families = {"22":["22","27","72","77"],"11":["11","61","66","16"],"33":["33","83","88","38"],"99":["99","44","49","94"],"55":["50","00","05","55"],"12":["12","17","21","26","62","67","71","76"],"13":["13","18","31","36","63","68","81","86"],"14":["14","19","41","46","64","69","91","96"],"15":["01","06","10","15","51","56","60","65"],"23":["23","28","32","37","73","78","82","87"],"24":["24","29","42","47","74","79","92","97"],"25":["02","07","20","25","52","57","70","75"],"34":["34","39","43","48","84","89","93","98"],"35":["03","08","30","35","53","58","80","85"],"45":["04","09","40","45","54","59","90","95"]};
let data = JSON.parse(localStorage.getItem("raj_final_v11")) || [["**","**","**","**","**"]];
let tripleMatches = []; // Store up to 3 patterns

function fam(v){ for(let k in families) if(families[k].includes(String(v).padStart(2,'0'))) return k; return "NA"; }

function draw() {
    let html = "<tr><th>MON</th><th>TUE</th><th>WED</th><th>THU</th><th>FRI</th></tr>";
    data.forEach((row, ri) => {
        html += "<tr>";
        row.forEach((cell, ci) => {
            let cls = "";
            tripleMatches.forEach((m, idx) => {
                let i = ri - m.start;
                if(i >= 0 && i < m.shape.length && m.shape[i][ci] > 0) cls = "f" + (idx + 1);
            });
            if(cell === "**") cls += " blank";
            html += `<td class="${cls}" onclick="tripleScan(${ri},${ci})">${cell}</td>`;
        });
        html += "</tr>";
    });
    document.getElementById("tbl").innerHTML = html;
    setTimeout(renderLines, 100);
}

function tripleScan(r, c) {
    if(data[r][c] !== "**") return;
    tripleMatches = [];
    let pool = {};
    
    // Scan last 10 weeks
    for(let i = r-1; i >= Math.max(0, r-10); i--) {
        data[i].forEach((v, ci) => {
            if(v !== "**") {
                let f = fam(v);
                if(!pool[f]) pool[f] = [];
                if(pool[f].length < 2) pool[f].push({ri: i, ci: ci});
            }
        });
    }

    let valid = Object.keys(pool).filter(k => pool[k].length === 2);
    if(valid.length < 2) return alert("Pattern not found in 10-week data.");

    // Find 3 different matches
    let allMatchesFound = [];
    for(let attempt=0; attempt < 10 && allMatchesFound.length < 3; attempt++) {
        let selected = valid.sort(() => 0.5 - Math.random()).slice(0, 2);
        let topRi = Math.min(...pool[selected[0]].concat(pool[selected[1]]).map(p => p.ri));
        let shape = Array.from({length: r - topRi}, () => Array(5).fill(0));
        selected.forEach((f, idx) => pool[f].forEach(p => { shape[p.ri - topRi][p.ci] = idx + 1; }));

        for(let i=0; i <= data.length - shape.length - 1; i++) {
            let ok = true;
            for(let k=0; k<shape.length; k++) {
                for(let j=0; j<5; j++) {
                    if(shape[k][j] === 1 && fam(data[i+k][j]) !== selected[0]) ok = false;
                    if(shape[k][j] === 2 && fam(data[i+k][j]) !== selected[1]) ok = false;
                }
            }
            if(ok && !allMatchesFound.some(m => m.start === i)) {
                allMatchesFound.push({start: i, shape: shape, result: data[i + shape.length][c]});
                break; 
            }
        }
    }

    tripleMatches = allMatchesFound.slice(0, 3);
    document.getElementById("future").innerText = tripleMatches.map(m => m.result).join(" | ") || "-- | -- | --";
    document.getElementById("status").innerText = `Found ${tripleMatches.length} Check Lines in History`;
    draw();
}

function renderLines() {
    const cvs = document.getElementById("mainCanvas");
    const ctx = cvs.getContext("2d");
    const tbl = document.getElementById("tbl");
    cvs.width = tbl.offsetWidth; cvs.height = tbl.offsetHeight;
    ctx.clearRect(0,0,cvs.width,cvs.height);
    const rect = tbl.getBoundingClientRect();

    tripleMatches.forEach((m, idx) => {
        let cls = ".f" + (idx + 1);
        let els = Array.from(tbl.querySelectorAll(cls));
        if(els.length >= 2) {
            ctx.strokeStyle = idx === 0 ? "#3e84ff" : (idx === 1 ? "#ff3e3e" : "#2ecc71");
            ctx.lineWidth = 3; ctx.beginPath();
            els.forEach((el, i) => {
                let r = el.getBoundingClientRect();
                let x = r.left - rect.left + r.width/2;
                let y = r.top - rect.top + r.height/2;
                if(i===0) ctx.moveTo(x,y); else ctx.lineTo(x,y);
            });
            ctx.stroke();
        }
    });
}

function addRow(){ data.push(["**","**","**","**","**"]); draw(); }
function saveData(){ localStorage.setItem("raj_final_v11", JSON.stringify(data)); alert("Saved!"); }
function loadCSV(input){
    let reader = new FileReader();
    reader.onload = () => {
        data = reader.result.split('\n').filter(l=>l.trim()).map(l => l.split(',').map(v=>v.trim().padStart(2,'0')));
        draw();
    };
    reader.readAsText(input.files[0]);
}

draw();
</script>
</body>
</html>
