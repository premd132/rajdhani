<!DOCTYPE html>
<html lang="hi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Rajdhani AI Ultra Pro</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>
<style>
    :root { --gold: #ffd700; --blue: #3e84ff; --red: #ff3e3e; --green: #2ecc71; --bg: #0a0a0a; --panel: #1a1a1a; }
    body { font-family: 'Segoe UI', Arial; background: var(--bg); color: #fff; margin: 0; padding: 10px; }
    h2 { color: var(--gold); text-align: center; text-transform: uppercase; letter-spacing: 2px; }
    .toolbar { background: var(--panel); padding: 12px; border-radius: 10px; border: 1px solid #333; margin-bottom: 15px; display: flex; gap: 10px; justify-content: center; flex-wrap: wrap; }
    .table-container { position: relative; display: inline-block; background: #fff; border-radius: 8px; padding: 10px; box-shadow: 0 0 30px rgba(255,215,0,0.2); }
    table { border-collapse: collapse; font-size: 13px; position: relative; z-index: 2; color: #000; }
    td, th { border: 1px solid #bbb; padding: 6px; text-align: center; font-weight: bold; width: 42px; height: 38px; }
    th { background: #500; color: #fff; }
    
    /* Markings */
    .f1 { border: 3px solid var(--blue) !important; border-radius: 50%; background: rgba(62, 132, 255, 0.2); }
    .f2 { border: 3px solid var(--red) !important; border-radius: 50%; background: rgba(255, 62, 62, 0.2); }
    .f-link { border: 3px double var(--green) !important; border-radius: 20%; background: rgba(46, 204, 113, 0.2); } /* Special Marking */
    .blank { background: #ddd !important; cursor: pointer; border: 2px dashed #777 !important; }

    .dashboard { display: grid; grid-template-columns: repeat(auto-fit, minmax(300px, 1fr)); gap: 15px; margin-top: 20px; }
    .card { background: var(--panel); border: 1px solid #333; padding: 15px; border-radius: 10px; border-top: 4px solid var(--gold); }
    .match-btn { background: #333; color: #fff; border: 1px solid var(--gold); padding: 10px; width: 100%; text-align: left; margin-bottom: 8px; border-radius: 5px; cursor: pointer; }
    .prediction-box { font-size: 1.5rem; color: var(--gold); font-weight: bold; text-align: center; margin-top: 10px; }
    
    canvas { position: absolute; top: 0; left: 0; pointer-events: none; z-index: 5; }
    #popup { position: fixed; left: 50%; top: 50%; transform: translate(-50%, -50%); background: #fff; color:#000; border: 4px solid var(--gold); display: none; z-index: 100; padding: 20px; border-radius: 12px; max-width: 90%; }
    .overlay { position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.9); display: none; z-index: 90; }
</style>
</head>
<body>

<h2>🏆 RAJDHANI AI ULTRA PRO</h2>

<div class="toolbar">
    <input type="file" id="csvFile" accept=".csv" style="display:none">
    <button onclick="document.getElementById('csvFile').click()" style="background:#5c2d91; color:white;">📂 Load CSV</button>
    <button onclick="addRow()">➕ Add Row</button>
    <button onclick="saveData()" style="background:#1e7e34; color:white;">💾 Save</button>
    <button onclick="clearData()" style="background:#bd2130; color:white;">🗑️ Reset</button>
</div>

<center>
    <div id="captureArea" class="table-container">
        <canvas id="mainCanvas"></canvas>
        <table id="tbl"></table>
    </div>
</center>

<div class="dashboard">
    <div class="card">
        <h3>🎯 Triple Check Matches</h3>
        <div id="checks">Click a blank cell to scan...</div>
    </div>
    <div class="card">
        <h3>🔮 Future AI (3 Jodi Prediction)</h3>
        <div id="future" class="prediction-box">-- -- --</div>
    </div>
</div>

<div class="overlay" id="overlay" onclick="closePopup()"></div>
<div id="popup">
    <button onclick="closePopup()" style="float:right; background:red; color:white;">X</button>
    <h3>Detailed Pattern Connection</h3>
    <div id="popData"></div>
</div>

<script>
const STORAGE_KEY = "rajdhani_ultra_v1";
const families = {
    "22":["22","27","72","77"],"11":["11","61","66","16"],"33":["33","83","88","38"],"99":["99","44","49","94"],"55":["50","00","05","55"],
    "12":["12","17","21","26","62","67","71","76"],"13":["13","18","31","36","63","68","81","86"],"14":["14","19","41","46","64","69","91","96"],
    "15":["01","06","10","15","51","56","60","65"],"23":["23","28","32","37","73","78","82","87"],"24":["24","29","42","47","74","79","92","97"],
    "25":["02","07","20","25","52","57","70","75"],"34":["34","39","43","48","84","89","93","98"],"35":["03","08","30","35","53","58","80","85"],
    "45":["04","09","40","45","54","59","90","95"]
};

let data = JSON.parse(localStorage.getItem(STORAGE_KEY)) || [["**","**","**","**","**"]];
let activeMark = null;

function fam(v){ for(let k in families) if(families[k].includes(String(v).padStart(2,'0'))) return k; return "NA"; }
function norm(v){ if(!v || v=="**") return "**"; return String(v).trim().padStart(2,'0'); }

function draw() {
    let h = "<tr><th>MON</th><th>TUE</th><th>WED</th><th>THU</th><th>FRI</th></tr>";
    data.forEach((r, ri) => {
        h += "<tr>";
        r.forEach((c, ci) => {
            let p = isPartOfPattern(ri, ci);
            let cls = p ? (p === 1 ? "f1" : (p === 2 ? "f2" : "f-link")) : "";
            if(c == "**") cls += " blank";
            h += `<td class="${cls}" contenteditable oninput="edit(${ri},${ci},this)" onclick="${c=='**'?'startUltraScan('+ri+','+ci+')':'' }">${c}</td>`;
        });
        h += "</tr>";
    });
    document.getElementById("tbl").innerHTML = h;
    if(activeMark) setTimeout(drawLines, 50);
}

function startUltraScan(r, c) {
    activeMark = null;
    let depth = 10;
    let startRow = Math.max(0, r - depth);
    let famPool = {};

    // Scan for pattern from last row or 1 row above
    for (let i = r - 1; i >= startRow; i--) {
        for (let j = 0; j < 5; j++) {
            let val = data[i][j];
            if (val !== "**") {
                let f = fam(val);
                if (!famPool[f]) famPool[f] = [];
                if (famPool[f].length < 2) famPool[f].push({ ri: i, ci: j });
            }
        }
    }

    let candidates = Object.keys(famPool).filter(f => famPool[f].length === 2);
    if (candidates.length < 2) return alert("Min 2 families required in 10 weeks!");

    let bestFams = candidates.slice(0, 2);
    let minRi = Math.min(...famPool[bestFams[0]].concat(famPool[bestFams[1]]).map(p => p.ri));
    let shapeHeight = r - minRi;
    let shape = Array.from({ length: shapeHeight }, () => Array(5).fill(0));

    bestFams.forEach((f, idx) => {
        famPool[f].forEach(p => { shape[p.ri - minRi][p.ci] = (idx + 1); });
    });

    findTripleUltraMatch(shape, bestFams, r, c);
}

function findTripleUltraMatch(shape, famList, currentR, currentC) {
    let matches = [];
    for (let i = 0; i <= data.length - shape.length - 1; i++) {
        let ok = true;
        for (let k = 0; k < shape.length; k++) {
            for (let j = 0; j < 5; j++) {
                if (shape[k][j] === 1 && fam(data[i+k][j]) !== famList[0]) ok = false;
                if (shape[k][j] === 2 && fam(data[i+k][j]) !== famList[1]) ok = false;
                if (!ok) break;
            }
            if (!ok) break;
        }
        if (ok) matches.push({ index: i });
    }

    displayResults(shape, matches, currentC, famList);
}

function displayResults(shape, matches, targetCol, famList) {
    const area = document.getElementById("checks");
    const fut = document.getElementById("future");
    area.innerHTML = "";
    let predictions = [];

    if (matches.length === 0) {
        area.innerHTML = "No Match Found.";
        fut.innerHTML = "-- -- --";
        return;
    }

    matches.slice(0, 3).forEach((m, i) => {
        let resultRow = m.index + shape.length;
        let jodi = (data[resultRow]) ? data[resultRow][targetCol] : "**";
        if(jodi !== "**") predictions.push(jodi);

        let btn = document.createElement("button");
        btn.className = "match-btn";
        btn.innerHTML = `⭐ Check Line #${i+1} (History Row ${m.index+1}) <br> <small>Result Was: ${jodi}</small>`;
        btn.onclick = () => {
            activeMark = { start: m.index, shape: shape, linkRow: resultRow, linkCol: targetCol };
            draw();
            showPopup(m.index, shape, resultRow, targetCol);
        };
        area.appendChild(btn);
    });

    // Advance AI Prediction (Unique 3 Jodi)
    if(predictions.length) {
        let unique = [...new Set(predictions)];
        while(unique.length < 3) unique.push(Math.floor(Math.random()*99).toString().padStart(2,'0'));
        fut.innerHTML = unique.slice(0, 3).join(" | ");
    }
}

function showPopup(idx, shape, resR, resC) {
    let h = "<table border='1' style='width:100%; color:black'>";
    for(let i=0; i <= shape.length; i++) {
        h += "<tr>";
        let actualRow = idx + i;
        if(!data[actualRow]) break;
        data[actualRow].forEach((v, j) => {
            let cls = (i < shape.length && shape[i][j] === 1) ? "f1" : (i < shape.length && shape[i][j] === 2 ? "f2" : "");
            if(actualRow === resR && j === resC) cls = "f-link";
            h += `<td class='${cls}' style='padding:5px; text-align:center'>${v}</td>`;
        });
        h += "</tr>";
    }
    document.getElementById("popData").innerHTML = h + "</table>";
    document.getElementById("popup").style.display = "block";
    document.getElementById("overlay").style.display = "block";
}

function isPartOfPattern(ri, ci) {
    if (!activeMark) return null;
    let i = ri - activeMark.start;
    if (ri === activeMark.linkRow && ci === activeMark.linkCol) return 3; // Special link
    return (i >= 0 && i < activeMark.shape.length) ? activeMark.shape[i][ci] : null;
}

function drawLines() {
    const cvs = document.getElementById("mainCanvas");
    const ctx = cvs.getContext("2d");
    const tbl = document.getElementById("tbl");
    cvs.width = tbl.offsetWidth; cvs.height = tbl.offsetHeight;
    ctx.clearRect(0,0,cvs.width,cvs.height);
    const tRect = tbl.getBoundingClientRect();

    ["f1", "f2", "f-link"].forEach((cls, idx) => {
        const els = Array.from(tbl.querySelectorAll("." + cls));
        if (els.length >= 2) {
            ctx.strokeStyle = (idx === 0) ? "#3e84ff" : (idx === 1 ? "#ff3e3e" : "#2ecc71");
            ctx.lineWidth = 3; ctx.beginPath();
            for (let i = 0; i < els.length - 1; i++) {
                const r1 = els[i].getBoundingClientRect(); const r2 = els[i+1].getBoundingClientRect();
                ctx.moveTo(r1.left - tRect.left + r1.width/2, r1.top - tRect.top + r1.height/2);
                ctx.lineTo(r2.left - tRect.left + r2.width/2, r2.top - tRect.top + r2.height/2);
            }
            ctx.stroke();
        }
    });
}

function closePopup() { document.getElementById("popup").style.display = "none"; document.getElementById("overlay").style.display = "none"; }
function edit(r,c,el){ data[r][c] = norm(el.innerText); }
function addRow(){ data.push(["**","**","**","**","**"]); draw(); }
function saveData(){ localStorage.setItem(STORAGE_KEY, JSON.stringify(data)); alert("Memory Saved!"); }
function clearData(){ if(confirm("Clear All?")) { localStorage.clear(); location.reload(); } }

document.getElementById('csvFile').addEventListener('change', function(e) {
    let reader = new FileReader();
    reader.onload = (ev) => {
        data = ev.target.result.split('\n').filter(l=>l.trim()).map(l => {
            let c = l.split(',').map(v => norm(v));
            while(c.length < 5) c.push("**");
            return c.slice(0, 5);
        });
        draw();
    };
    reader.readAsText(e.target.files[0]);
});

draw();
</script>
</body>
</html>
