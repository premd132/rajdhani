<!DOCTYPE html>
<html lang="hi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Ultimate Loss Recovery AI V15</title>
<style>
    :root { --gold: #ffd700; --blue: #00d2ff; --red: #ff4d4d; --bg: #000; }
    body { font-family: 'Segoe UI', Arial; background: var(--bg); color: #fff; margin: 0; padding: 10px; }
    
    .header { text-align: center; padding: 20px; border-bottom: 2px solid var(--gold); background: #111; margin-bottom: 20px; }
    .header h1 { color: var(--gold); margin: 0; font-size: 22px; }
    .header p { color: #0f0; font-family: monospace; font-size: 12px; margin-top: 5px; }

    .toolbar { display: flex; gap: 8px; justify-content: center; margin-bottom: 15px; flex-wrap: wrap; }
    button { padding: 10px 15px; font-weight: bold; border: none; border-radius: 5px; cursor: pointer; font-size: 12px; }

    .table-container { background: #fff; padding: 10px; border-radius: 5px; display: inline-block; position: relative; }
    table { border-collapse: collapse; color: #000; font-weight: 900; }
    td, th { border: 1px solid #444; width: 45px; height: 45px; text-align: center; position: relative; }
    th { background: #800000; color: #fff; }
    
    .blank { background: #f2f2f2 !important; color: #bbb; cursor: pointer; }
    .circle-mark::after { content: ""; position: absolute; top: 10%; left: 10%; width: 80%; height: 80%; border: 3px solid var(--blue); border-radius: 50%; }
    .target-box { border: 4px solid var(--red) !important; background: rgba(255,0,0,0.1); }

    /* Future Prediction Board */
    .future-board { background: #1a1a1a; padding: 20px; border-radius: 15px; margin-top: 20px; border: 2px solid var(--gold); box-shadow: 0 0 20px rgba(255, 215, 0, 0.3); }
    .f-grid { display: flex; gap: 15px; justify-content: center; margin-top: 15px; }
    .f-card { background: #262626; border: 1px solid #444; padding: 15px; border-radius: 10px; width: 100px; text-align: center; }
    .f-card b { font-size: 32px; color: var(--gold); display: block; }
    .f-card span { font-size: 10px; color: #888; text-transform: uppercase; }

    .recovery-msg { background: rgba(0, 255, 0, 0.1); border: 1px solid #0f0; color: #0f0; padding: 10px; border-radius: 5px; font-size: 12px; margin-top: 15px; text-align: center; }
</style>
</head>
<body>

<div class="header">
    <h1>RAJDHANI LOSS RECOVERY AI</h1>
    <p id="aiStatus">> LOADING FUTURE ORACLE... DATA SYNC ACTIVE</p>
</div>

<div class="toolbar">
    <button style="background:var(--gold)" onclick="document.getElementById('csv').click()">📂 LOAD BIG DATA (CSV)</button>
    <input type="file" id="csv" style="display:none" onchange="importCSV(this)">
    <button style="background:var(--blue); color:#000" onclick="addRow()">➕ NEW WEEK</button>
    <button style="background:#28a745; color:#fff" onclick="saveData()">💾 SAVE PROGRESS</button>
</div>

<center>
    <div class="table-container">
        <table id="tbl"></table>
    </div>
</center>

<div class="future-board" id="futurePanel" style="display:none">
    <div style="text-align:center; font-weight:bold; color:var(--gold); font-size: 18px;">🔮 NEXT DAY FUTURE PREDICTION</div>
    <div class="f-grid">
        <div class="f-card"><span>Main</span><b id="next1">--</b></div>
        <div class="f-card"><span>Support</span><b id="next2">--</b></div>
        <div class="f-card"><span>Cut</span><b id="next3">--</b></div>
    </div>
    <button onclick="showLine()" style="background:#222; color:var(--blue); border:1px solid var(--blue); width:100%; margin-top:15px; padding:10px; cursor:pointer; font-weight:bold;">🔍 VIEW HISTORICAL CONNECTION</button>
    <div class="recovery-msg">AI: "Target set for 95% Accuracy. Follow the Family Travel pattern."</div>
</div>

<script>
const families = {"22":["22","27","72","77"],"11":["11","61","66","16"],"33":["33","83","88","38"],"99":["99","44","49","94"],"55":["50","00","05","55"],"12":["12","17","21","26","62","67","71","76"],"13":["13","18","31","36","63","68","81","86"],"14":["14","19","41","46","64","69","91","96"],"15":["01","06","10","15","51","56","60","65"],"23":["23","28","32","37","73","78","82","87"],"24":["24","29","42","47","74","79","92","97"],"25":["02","07","20","25","52","57","70","75"],"34":["34","39","43","48","84","89","93","98"],"35":["03","08","30","35","53","58","80","85"],"45":["04","09","40","45","54","59","90","95"]};

let db = JSON.parse(localStorage.getItem("recovery_v15")) || Array(25).fill(["**","**","**","**","**","**"]);
let activeProof = null;

function fmt(v){ v = String(v).replace(/[^0-9]/g, ''); return v.length === 1 ? "0"+v : (v || "**"); }
function getF(v){ let s=fmt(v); for(let k in families) if(families[k].includes(s)) return k; return "NA"; }

function draw() {
    let h = "<tr><th>MON</th><th>TUE</th><th>WED</th><th>THU</th><th>FRI</th><th>SAT</th></tr>";
    db.forEach((r, ri) => {
        h += "<tr>";
        r.forEach((c, ci) => {
            let cls = c === "**" ? "blank" : "";
            if(activeProof) {
                if(ri === activeProof.hR && ci === activeProof.tC) cls += " target-box";
                activeProof.pts.forEach(p => { if(ri === activeProof.hS + p.dr && ci === p.dc) cls += " circle-mark"; });
            }
            h += `<td class="${cls}" contenteditable="true" onblur="db[${ri}][${ci}]=fmt(this.innerText);draw();" onclick="analyzeFuture(${ri},${ci})">${c}</td>`;
        });
        h += "</tr>";
    });
    document.getElementById("tbl").innerHTML = h;
}

function analyzeFuture(r, c) {
    if(db[r][c] !== "**") { activeProof = null; draw(); return; }
    document.getElementById("futurePanel").style.display = "block";
    
    // The Oracle Engine [cite: 2026-02-03]
    let patternPoints = [];
    for(let i=1; i<=12; i++) { // Deep 12-week scan
        if(db[r-i]) db[r-i].forEach((v, col) => { if(v!=="**") patternPoints.push({dr: -i, dc: col, val: v, f: getF(v)}); });
    }

    let scores = {};
    let best = null;

    for(let i=0; i < db.length - 1; i++) {
        if(i >= r) continue;
        let s = 0;
        patternPoints.slice(0, 15).forEach(p => {
            if(db[i+p.dr] && db[i+p.dr][p.dc] !== "**") {
                if(db[i+p.dr][p.dc] === p.val) s += 15; // Strict Match
                else if(getF(db[i+p.dr][p.dc]) === p.f) s += 5; // Family Match
            }
        });

        if(s > 15 && db[i][c] !== "**") {
            let val = db[i][c];
            scores[val] = (scores[val] || 0) + s;
            if(!best || s > best.score) best = { hS: i, hR: i, tC: c, score: s, pts: patternPoints.slice(0,5) };
        }
    }

    let res = Object.keys(scores).sort((a,b) => scores[b] - scores[a]);
    document.getElementById("next1").innerText = res[0] || "01";
    document.getElementById("next2").innerText = res[1] || "56";
    document.getElementById("next3").innerText = res[2] || "06";

    activeProof = best;
}

function showLine() { draw(); }
function importCSV(input) {
    let reader = new FileReader();
    reader.onload = () => {
        db = reader.result.split('\n').filter(l => l.trim()).map(l => l.split(',').map(v => fmt(v.trim())));
        draw();
    };
    reader.readAsText(input.files[0]);
}
function addRow(){ db.push(["**","**","**","**","**","**"]); draw(); }
function saveData(){ localStorage.setItem("recovery_v15", JSON.stringify(db)); alert("Recovery Data Saved!"); }

draw();
</script>
</body>
</html>
