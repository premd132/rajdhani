<!DOCTYPE html>
<html lang="hi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Kalyan AI – Final Correction</title>
<style>
    :root { --gold: #ffd700; --blue: #007bff; --red: #ff0000; --bg: #000; }
    body { font-family: Arial; background: var(--bg); color: #fff; margin: 0; padding: 5px; }
    
    .table-container { position: relative; background: #fff; padding: 5px; display: inline-block; }
    table { border-collapse: collapse; color: #000; font-size: 15px; }
    td, th { border: 1px solid #999; width: 45px; height: 45px; text-align: center; font-weight: bold; position: relative; }
    th { background: #800000; color: #fff; font-size: 12px; }

    /* Screenshot Styles [cite: 2026-02-03] */
    .blue-circle::after { content: ""; position: absolute; top: 5%; left: 5%; width: 90%; height: 90%; border: 3px solid var(--blue); border-radius: 50%; box-sizing: border-box; }
    .red-box { border: 4px solid var(--red) !important; background: rgba(255,0,0,0.1); }
    .result-cell { border: 3px solid #28a745 !important; background: #e8f5e9; }
    .blank { background: #eee !important; cursor: pointer; }

    .card { background: #1e1e1e; padding: 15px; margin-top: 10px; border-left: 5px solid var(--gold); }
    .match-btn { background: #333; color: var(--gold); padding: 12px; margin: 5px 0; cursor: pointer; border: 1px solid #555; width: 100%; text-align: left; font-weight: bold; }
    canvas { position: absolute; top: 0; left: 0; pointer-events: none; z-index: 10; }
</style>
</head>
<body>

<h2 style="text-align:center; color:var(--gold);">🎯 KALYAN SHAPE MASTER</h2>

<div style="text-align:center; margin-bottom:10px;">
    <button onclick="document.getElementById('csv').click()" style="padding:10px; background:var(--gold); border:none; font-weight:bold;">📂 LOAD CHART</button>
    <input type="file" id="csv" style="display:none" onchange="loadCSV(this)">
</div>

<center>
    <div class="table-container" id="chartArea">
        <canvas id="lineCanvas"></canvas>
        <table id="mainTable"></table>
    </div>
</center>

<div class="card">
    <h3>📍 Similarity Check Lines</h3>
    <div id="results">Khali cell (**) par click karein...</div>
</div>

<div class="card">
    <h3>🔮 Future AI (3-Pair)</h3>
    <div id="future" style="font-size: 22px; color: var(--gold); text-align: center; letter-spacing: 2px;">-- | -- | --</div>
</div>

<script>
const families = {"22":["22","27","72","77"],"11":["11","61","66","16"],"33":["33","83","88","38"],"99":["99","44","49","94"],"55":["50","00","05","55"],"12":["12","17","21","26","62","67","71","76"],"13":["13","18","31","36","63","68","81","86"],"14":["14","19","41","46","64","69","91","96"],"15":["01","06","10","15","51","56","60","65"],"23":["23","28","32","37","73","78","82","87"],"24":["24","29","42","47","74","79","92","97"],"25":["02","07","20","25","52","57","70","75"],"34":["34","39","43","48","84","89","93","98"],"35":["03","08","30","35","53","58","80","85"],"45":["04","09","40","45","54","59","90","95"]};
let chartData = JSON.parse(localStorage.getItem("kalyan_v4")) || Array(25).fill(["**","**","**","**","**","**"]);
let matchData = null;

function getFam(v){ let s = String(v).padStart(2,'0'); for(let k in families) if(families[k].includes(s)) return k; return "NA"; }

function renderTable() {
    let html = "<tr><th>MON</th><th>TUE</th><th>WED</th><th>THU</th><th>FRI</th><th>SAT</th></tr>";
    chartData.forEach((row, ri) => {
        html += "<tr>";
        row.forEach((cell, ci) => {
            let cls = cell === "**" ? "blank" : "";
            if(matchData) {
                let isPatternArea = (ri >= matchData.start && ri < matchData.start + 10);
                if(isPatternArea) {
                    let relR = ri - matchData.start;
                    if(matchData.coords.some(p => p.r === relR && p.c === ci)) cls += " blue-circle";
                    if(relR === matchData.basePos.r && ci === matchData.basePos.c) cls += " red-box";
                }
                if(ri === matchData.resR && ci === matchData.resC) cls += " result-cell";
            }
            html += `<td class="${cls}" onclick="scan(${ri},${ci})" contenteditable="true" onblur="chartData[${ri}][${ci}]=this.innerText.trim()">${cell}</td>`;
        });
        html += "</tr>";
    });
    document.getElementById("mainTable").innerHTML = html;
    if(matchData) setTimeout(drawLines, 100);
}

function scan(r, c) {
    if(chartData[r][c] !== "**") return;
    
    // 1. Capture Current Shape (Any value except **) [cite: 2026-02-03]
    let basePos = {r: 8, c: 0}; // Example: Base at row 9, col 1
    let baseFamily = getFam(chartData[r - (10 - basePos.r)][basePos.c]);
    let coords = [];
    
    for(let i=1; i<=10; i++) {
        chartData[r-i].forEach((v, ci) => {
            if(v !== "**" && coords.length < 5 && !(10-i === basePos.r && ci === basePos.c)) {
                coords.push({r: 10-i, c: ci});
            }
        });
    }

    // 2. Scan History for "Shape Match" + "Base Family" [cite: 2026-02-03]
    let matches = [];
    for(let i=0; i < chartData.length - 11; i++) {
        if(getFam(chartData[i + basePos.r][basePos.c]) !== baseFamily) continue;

        let shapeOk = coords.every(p => chartData[i+p.r][p.c] !== "**");
        if(shapeOk && chartData[i+10][c] !== "**") {
            matches.push({start: i, coords, basePos, resR: i+10, resC: c, val: chartData[i+10][c]});
        }
    }

    let resDiv = document.getElementById("results");
    resDiv.innerHTML = matches.length ? "" : "Shape match nahi mila!";
    matches.slice(0, 3).forEach((m, idx) => {
        let btn = document.createElement("div"); btn.className = "match-btn";
        btn.innerHTML = `⭐ Match #${idx+1} (Row ${m.start + 1}) | Result: ${m.val}`;
        btn.onclick = () => { matchData = m; renderTable(); };
        resDiv.appendChild(btn);
    });
    document.getElementById("future").innerText = matches.slice(0,3).map(m => m.val).join(" | ") || "-- | -- | --";
    renderTable();
}

function drawLines() {
    const cvs = document.getElementById("lineCanvas"); const ctx = cvs.getContext("2d");
    const tbl = document.getElementById("mainTable");
    cvs.width = tbl.offsetWidth; cvs.height = tbl.offsetHeight;
    ctx.clearRect(0,0,cvs.width,cvs.height);
    const rect = tbl.getBoundingClientRect();

    const points = Array.from(tbl.querySelectorAll(".blue-circle, .red-box"));
    if(points.length < 2) return;
    
    ctx.strokeStyle = "blue"; ctx.lineWidth = 2.5; ctx.beginPath();
    points.forEach((el, i) => {
        let r = el.getBoundingClientRect();
        let x = r.left - rect.left + r.width/2;
        let y = r.top - rect.top + r.height/2;
        if(i === 0) ctx.moveTo(x,y); else ctx.lineTo(x,y);
    });
    ctx.stroke();
}

function loadCSV(input) {
    let fr = new FileReader();
    fr.onload = () => {
        chartData = fr.result.split('\n').filter(l => l.trim()).map(l => l.split(',').map(v => v.trim()));
        renderTable();
    };
    fr.readAsText(input.files[0]);
}
renderTable();
</script>
</body>
</html>
