<!DOCTYPE html>
<html lang="hi">
<head>
<meta charset="UTF-8">
<title>Kalyan AI V29 - Logic Total</title>
<style>
    :root { --gold: #ffd700; --blue: #00d2ff; --red: #ff3131; --bg: #050505; }
    body { font-family: 'Segoe UI', Arial; background: var(--bg); color: #fff; margin: 0; padding: 10px; }
    
    .dashboard { border: 2px solid var(--gold); background: #111; padding: 15px; border-radius: 12px; text-align: center; margin-bottom: 20px; }
    .nav-btn { background: #333; color: white; border: 1px solid #555; padding: 10px 18px; border-radius: 6px; cursor: pointer; margin: 5px; font-weight: bold; }
    .nav-btn:hover { background: var(--gold); color: #000; }

    .matrix-wrapper { background: #fff; padding: 10px; border-radius: 8px; display: inline-block; position: relative; }
    table { border-collapse: collapse; color: #000; font-weight: 900; font-size: 20px; }
    td, th { border: 1.5px solid #222; width: 55px; height: 55px; text-align: center; position: relative; }
    th { background: #800000; color: #fff; font-size: 11px; }

    /* Logic Visuals [cite: 2026-02-03] */
    .editable { cursor: text; outline: none; }
    .blank { background: #eee !important; color: #aaa; }
    .source-cell { background: #ffff00 !important; border: 3px solid var(--red) !important; color: #000; }
    .target-cell { border: 4px solid var(--red) !important; background: rgba(255,0,0,0.1); }
    .pattern-circle::after { content: ""; position: absolute; top: 10%; left: 10%; width: 80%; height: 80%; border: 3px solid var(--blue); border-radius: 50%; pointer-events: none; }
    
    .total-indicator { position: absolute; bottom: 2px; right: 2px; font-size: 10px; color: #00f; font-weight: bold; }

    .prediction-panel { background: #111; border: 2px solid var(--blue); padding: 20px; border-radius: 15px; margin-top: 20px; text-align: center; }
    .logic-grid { display: flex; gap: 10px; justify-content: center; margin-top: 15px; }
    .logic-card { background: #222; border-top: 4px solid var(--gold); padding: 15px; border-radius: 10px; width: 100px; }
    .logic-card b { font-size: 30px; color: var(--gold); display: block; }
</style>
</head>
<body>

<div class="dashboard">
    <h2 style="color:var(--gold); margin:0;">🧠 NEURAL LOGIC TOTAL V29</h2>
    <div style="margin-top:15px;">
        <button class="nav-btn" onclick="document.getElementById('csv').click()">📂 LOAD RECORD</button>
        <input type="file" id="csv" style="display:none" onchange="importCSV(this)">
        <button class="nav-btn" onclick="addRow()">➕ ADD NEW WEEK</button>
        <button class="nav-btn" onclick="saveData()" style="background:#28a745; border:none;">💾 SYNC LOCAL STORAGE</button>
    </div>
</div>

<center>
    <div class="matrix-wrapper">
        <table id="mainTbl"></table>
    </div>
</center>

<div class="prediction-panel">
    <h3 style="margin:0; color:var(--blue);">🔮 LOGIC PREDICTION (NEXT PAIR)</h3>
    <div class="logic-grid">
        <div class="logic-card"><span>JACKPOT</span><b id="p1">--</b></div>
        <div class="logic-card"><span>SUPPORT</span><b id="p2">--</b></div>
        <div class="logic-card"><span>TOTAL</span><b id="pT">--</b></div>
    </div>
    <button onclick="showCheckLine()" style="width:100%; padding:15px; margin-top:15px; background:var(--blue); color:#000; font-weight:bold; border:none; border-radius:8px; cursor:pointer;">🔍 CHECK LOGIC LINE (POPUP)</button>
</div>

<div id="overlay" onclick="closePopup()" style="display:none; position:fixed; top:0; left:0; width:100%; height:100%; background:rgba(0,0,0,0.85); z-index:100;"></div>
<div id="popup" style="display:none; position:fixed; top:50%; left:50%; transform:translate(-50%, -50%); background:white; color:black; padding:25px; border-radius:15px; z-index:101; width:280px; text-align:center; border:5px solid var(--blue);">
    <h3 style="margin-top:0">Historical Logic Found</h3>
    <div id="popContent" style="font-size:24px; font-weight:bold; margin:20px 0; color:red;"></div>
    <p style="font-size:12px; color:#666;">This prediction is based on the 10-week 'Total Sequence' mirror pattern.</p>
    <button onclick="closePopup()" style="background:red; color:white; border:none; padding:10px 20px; border-radius:5px; cursor:pointer;">CLOSE</button>
</div>

<script>
let db = JSON.parse(localStorage.getItem("v29_logic")) || Array(15).fill(["**","**","**","**","**","**"]);
let meta = null;

function fmt(v){ v = v.replace(/[^0-9]/g, ''); return v.length === 1 ? "0"+v : (v || "**"); }
function getT(v){ if(v==="**") return null; let s = (parseInt(v[0])||0) + (parseInt(v[1])||0); return s % 10; }

function draw() {
    let h = "<tr><th>MON</th><th>TUE</th><th>WED</th><th>THU</th><th>FRI</th><th>SAT</th></tr>";
    db.forEach((r, ri) => {
        h += "<tr>";
        r.forEach((c, ci) => {
            let cls = "editable";
            if(c === "**") cls += " blank";
            if(meta) {
                if(ri === meta.tR && ci === meta.tC) cls += " target-cell";
                if(ri === meta.sR && ci === meta.tC) cls += " source-cell";
                meta.pts.forEach(p => { if(ri === meta.sR + p.dr && ci === p.dc) cls += " pattern-circle"; });
            }
            let t = getT(c);
            h += `<td class="${cls}" contenteditable="true" onblur="db[${ri}][${ci}]=fmt(this.innerText);draw();" onclick="logicScan(${ri},${ci})">${c}${t!==null?`<span class="total-indicator">${t}</span>`:''}</td>`;
        });
        h += "</tr>";
    });
    document.getElementById("mainTbl").innerHTML = h;
}

function logicScan(r, c) {
    if(db[r][c] !== "**") { meta = null; draw(); return; }
    
    // Capture 10-week 'Total Logic' DNA [cite: 2026-02-03]
    let dna = [];
    for(let i=1; i<=10; i++) {
        if(db[r-i]) db[r-i].forEach((v, col) => { if(v!=="**") dna.push({dr:-i, dc:col, val:v, t:getT(v)}); });
    }

    let matches = {};
    let best = null;

    for(let i=0; i < db.length - 1; i++) {
        if(i >= r-1) continue;
        let score = 0;
        dna.forEach(p => {
            if(db[i+p.dr] && db[i+p.dr][p.dc] !== "**") {
                if(getT(db[i+p.dr][p.dc]) === p.t) score += 100; // Logic Total Match
                if(db[i+p.dr][p.dc] === p.val) score += 50; // Pair Match
            }
        });

        if(score > 100 && db[i][c] !== "**") {
            matches[db[i][c]] = (matches[db[i][c]] || 0) + score;
            if(!best || score > best.score) best = { sR: i, tR: r, tC: c, score: score, pts: dna.slice(0,6) };
        }
    }

    let sorted = Object.keys(matches).sort((a,b) => matches[b] - matches[a]);
    document.getElementById("p1").innerText = sorted[0] || "??";
    document.getElementById("p2").innerText = sorted[1] || "??";
    document.getElementById("pT").innerText = getT(sorted[0]) ?? "--";
    meta = best;
    draw();
}

function showCheckLine() {
    if(!meta) return alert("Pehle khali cell pe click karein!");
    document.getElementById("overlay").style.display = "block";
    document.getElementById("popup").style.display = "block";
    document.getElementById("popContent").innerText = "Logic Pair: " + db[meta.sR][meta.tC];
}

function closePopup() { document.getElementById("popup").style.display = "none"; document.getElementById("overlay").style.display = "none"; }
function addRow() { db.push(["**","**","**","**","**","**"]); draw(); }
function saveData() { localStorage.setItem("v29_logic", JSON.stringify(db)); alert("Logic Synced!"); }
function importCSV(i) {
    let r = new FileReader();
    r.onload = () => { db = r.result.split('\n').filter(l=>l.trim()).map(l=>l.split(',').map(v=>fmt(v.trim()))); draw(); };
    r.readAsText(i.files[0]);
}
draw();
</script>
</body>
</html>
